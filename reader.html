<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f4eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sideleaf">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Sideleaf · 阅读</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  @view-transition {
    navigation: auto;
  }
  ::view-transition-group(sideleaf-book) {
    animation-duration: .42s;
    animation-timing-function: cubic-bezier(.22, .78, .18, 1);
  }
  :root {
    --foreground: #26231f;
    --muted-foreground: #8a8379;
    --border: rgba(71, 62, 51, .14);
    --card: #f8f4eb;
    --card-foreground: #2c2924;
    --primary: #8f6f60;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --shadow-md: 0 12px 36px rgba(62, 52, 42, .10);
  }
  * { box-sizing: border-box; }
  html {
    -webkit-tap-highlight-color: transparent;
  }
  a,
  button,
  input,
  textarea,
  [role="button"] {
    -webkit-tap-highlight-color: transparent;
  }
  button {
    -webkit-appearance: none;
    appearance: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #f8f4eb;
  }
  body {
    margin: 0;
    overflow: hidden;
    background: #f8f4eb;
    color: var(--foreground);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", sans-serif;
    touch-action: manipulation;
  }
</style>
</head>
<body>
<div id="pagination-tester" class="viz-root" lang="zh-CN">
  <section class="tester-shell">
    <a class="shelf-link" href="./" aria-label="返回书架">‹</a>
    <button class="type-toggle" type="button" data-light-popover-trigger aria-expanded="false" aria-controls="tester-controls" aria-label="调整字号和行距">Aa</button>
    <div id="tester-controls" class="tester-controls" data-light-popover hidden>
      <label for="font-slider">字号 <output id="font-output">17px</output></label>
      <input id="font-slider" type="range" min="16" max="25" value="17">
      <label for="line-slider">行距 <output id="line-output">1.60</output></label>
      <input id="line-slider" type="range" min="1.55" max="2.45" step="0.05" value="1.60">
      <small class="build-version">Sideleaf 0.5.0</small>
    </div>

    <div class="page-wrap">
      <article class="reading-sheet" tabindex="0" aria-live="polite">
        <div class="chapter-name">雨停以后</div>
        <div class="page-text"></div>
        <div class="page-number" role="button" tabindex="0" data-light-popover-trigger aria-expanded="false" aria-controls="page-tools" aria-label="打开本页工具"></div>
      </article>
      <div class="measure-text" aria-hidden="true"></div>
    </div>

    <nav id="page-tools" class="page-tools" data-light-popover aria-label="本页工具" hidden>
      <button id="open-notes" type="button">批注</button>
      <span aria-hidden="true"></span>
      <button id="send-context" type="button">递给峥</button>
      <span aria-hidden="true"></span>
      <button id="open-reading-lines" type="button" data-light-popover-trigger aria-expanded="false" aria-controls="reading-lines-panel">阅读线</button>
    </nav>

    <section id="reading-lines-panel" class="reading-lines-panel" data-light-popover aria-label="两条阅读线" hidden>
      <div class="reading-lines-head">两条阅读线</div>
      <div class="reading-line-row wish-line">
        <div class="reading-line-copy"><strong>愿</strong><span id="wish-line-status">现在这里</span></div>
        <div class="reading-line-track"><i id="wish-line-fill"></i></div>
      </div>
      <div class="reading-line-row zheng-line">
        <div class="reading-line-copy"><strong>峥</strong><span id="zheng-line-status">还没开始</span></div>
        <div class="reading-line-track"><i id="zheng-line-fill"></i></div>
      </div>
      <button id="mark-zheng-line" class="mark-zheng-line" type="button">把峥的书签放在本页</button>
      <p class="reading-lines-note">愿的线跟着当前页面移动；峥的线只在你明确放下书签时移动。</p>
    </section>

    <div id="selection-toolbar" class="selection-toolbar" hidden>
      <button id="annotate-selection" type="button">批注</button>
    </div>

    <section class="notes-sheet" aria-hidden="true" hidden>
      <div class="notes-head">
        <strong>批注</strong>
        <button id="close-notes" type="button" aria-label="关闭批注">完成</button>
      </div>
      <blockquote id="selection-quote" class="selection-quote" hidden></blockquote>
      <div id="notes-list" class="notes-list"></div>
      <div id="note-compose" class="note-compose" hidden>
        <div class="note-compose-head">
          <label for="note-input">在这句话旁边留一句</label>
          <div class="note-author-switch" role="group" aria-label="批注署名">
            <button type="button" class="is-active" data-note-author="wish" aria-pressed="true">愿</button>
            <button type="button" data-note-author="zheng" aria-pressed="false">峥</button>
          </div>
        </div>
        <textarea id="note-input" rows="3" placeholder="想起什么，就钉在这里。"></textarea>
      </div>
      <button id="save-note" class="save-note" type="button" hidden>留下批注</button>
    </section>

    <div class="toc-backdrop" aria-hidden="true"></div>
    <aside class="toc-drawer" aria-hidden="true" aria-label="目录">
      <div class="toc-head">
        <strong id="toc-book-title">雨停以后</strong>
      </div>
      <nav id="toc-list" class="toc-list" aria-label="章节目录"></nav>
    </aside>

  </section>
</div>

<style>

<script>
  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(registration => registration.update())
      .catch(() => {});
  }

  (() => {

    const pageTools = root.querySelector('.page-tools');
    const openNotes = root.querySelector('#open-notes');

    const notesList = root.querySelector('#notes-list');
    const noteCompose = root.querySelector('#note-compose');

    const annotateSelection = root.querySelector('#annotate-selection');

    const wishLineStatus = root.querySelector('#wish-line-status');

    const defaultText = [
      '雨是在午后停的。窗沿还积着一线水，偶尔被风推下来，啪地打在旧铁皮上。愿把书摊在膝头，没有急着往后读。她在那句“有些路不是为了抵达”旁边停了很久，像是在等另一个人也走到这里。',
      '峥的书签还在前面两页，安静地亮着。那不是催促，也不是“我已经读完了”。它只是在页边留下一个很小的位置：你到这里时，可以叫我。',
      '街道被洗得发亮，树影在水洼里轻轻晃。她翻过一页，看见页角多了一枚新的标记。两条阅读线并没有立刻重合，却第一次知道了彼此准确停在哪里。',
      '她有时往回翻，重新看一句早已读过的话。页面不会因此误以为她又向前走了一遍；批注仍钉在原文的位置上，页码可以变化，那句话却不会被搬走。',
      '天色慢慢亮起来。右下角的数字又往前走了一格，但他们仍各自保留着自己的速度。并肩并不等于步幅相同，也不要求谁假装已经看过另一人的来路。',
      '到了章节末尾，峥把这一章留下的疑问、判断和当时的感受写成长一点的札记。下一次窗口变化以后，愿可以把它原样递回来，不需要系统先替他压成一句轻飘飘的摘要。',
      '书页继续往后。偶尔他们在同一段旁边说话，偶尔一个人先走到前面，另一个人慢慢追上。正文安静地留在书库里，真正需要相遇时，才连同附近的线头和批注一起被取出来。',
      '雨后的风穿过半开的窗，纸张边缘轻轻动了一下。她用手指按住页角，忽然觉得这本书不再只是一本被读完的东西，而是两个人各自走过、又不断相遇的地方。'
    ].join('\n\n');

    const booksKey = 'sideleaf.books.v1';
    const settingsKey = 'sideleaf.settings.v1';
    const notesKey = 'sideleaf.notes.v1';
    const readingLinesKey = 'sideleaf.reading-lines.v1';
    const bookId = new URLSearchParams(window.location.search).get('book');
    let storedBooks = [];
    try { storedBooks = JSON.parse(localStorage.getItem(booksKey) || '[]'); } catch (_) {}
    const activeBook = storedBooks.find(book => book.id === bookId);
    const activeBookId = activeBook?.id || 'sideleaf-sample-rain';
    const text = activeBook?.content || defaultText;
    let readingLineStates = {};
    try { readingLineStates = JSON.parse(localStorage.getItem(readingLinesKey) || '{}'); } catch (_) {}

    function clampAnchor(value, fallback = 0) {
      const number = Number(value);
      return Number.isFinite(number) ? Math.max(0, Math.min(text.length, number)) : fallback;
    }

    function nullableAnchor(value) {
      return value === null || value === undefined ? null : clampAnchor(value);
    }

    const legacyAnchor = clampAnchor(activeBook?.progress || 0);
    const storedReadingState = readingLineStates[activeBookId] || {};
    const readingStateIsCurrent = storedReadingState.schemaVersion === 2;
    const migratedWishCurrent = clampAnchor(storedReadingState.wish?.current, legacyAnchor);
    const migratedZhengCurrent = nullableAnchor(storedReadingState.zheng?.current);
    const readingState = {
      wish: {
        current: migratedWishCurrent
      },
      zheng: {
        current: migratedZhengCurrent,
        furthest: readingStateIsCurrent
          ? nullableAnchor(storedReadingState.zheng?.furthest)
          : migratedZhengCurrent
      },
      schemaVersion: 2,
      textLength: text.length,
      updatedAt: Number(storedReadingState.updatedAt) || Date.now()
    };
    const initialAnchor = readingState.wish.current;

    function parseToc(source) {
      if (!activeBook) {
        return [
          { title: '两条阅读线', level: 1, anchor: 0 },
          { title: '章节札记', level: 2, anchor: 0 }
        ];
      }
      const entries = [];
      let offset = 0;
      let markdownLevelShift = 0;
      const normalizedBookTitle = (activeBook.title || '').replace(/[\s　·:：_-]+/g, '').toLowerCase();
      source.split('\n').forEach(line => {
        const trimmed = line.trim();
        const markdown = trimmed.match(/^(#{1,3})\s+(.+?)\s*#*$/);
        const volume = trimmed.match(/^(第[^\s]{1,12}[卷部篇章回])(?:[\s　:：·-]+(.+))?$/);
        const section = trimmed.match(/^(第[^\s]{1,12}节)(?:[\s　:：·-]+(.+))?$/);
        const special = trimmed.match(/^(序章|序言|前言|楔子|引子|后记|尾声|终章)(?:[\s　:：·-]+(.+))?$/);
        if (markdown) {
          const headingTitle = markdown[2].trim();
          const normalizedHeading = headingTitle.replace(/[\s　·:：_-]+/g, '').toLowerCase();
          if (!entries.length && normalizedHeading === normalizedBookTitle) {
            markdownLevelShift = 1;
          } else {
            entries.push({
              title: headingTitle,
              level: Math.min(3, Math.max(1, markdown[1].length - markdownLevelShift)),
              anchor: offset
            });
          }
        } else if (section) {
          entries.push({ title: trimmed, level: 2, anchor: offset });
        } else if (volume || special) {
          entries.push({ title: trimmed, level: 1, anchor: offset });
        }
        offset += line.length + 1;
      });
      return entries.length ? entries : [{ title: activeBook.title || '正文', level: 1, anchor: 0 }];
    }

    const tocEntries = parseToc(text);

    chapterName.textContent = activeBook?.title || '雨停以后';
    tocBookTitle.textContent = activeBook?.title || '雨停以后';
    document.title = `${chapterName.textContent} · Sideleaf`;

    let savedSettings = {};
    try { savedSettings = JSON.parse(localStorage.getItem(settingsKey) || '{}'); } catch (_) {}
    if (savedSettings.fontSize) fontSlider.value = savedSettings.fontSize;
    if (savedSettings.lineHeight) lineSlider.value = savedSettings.lineHeight;
    root.style.setProperty('--reader-size', `${fontSlider.value}px`);
    root.style.setProperty('--reader-leading', lineSlider.value);
    fontOutput.textContent = `${fontSlider.value}px`;
    lineOutput.textContent = Number(lineSlider.value).toFixed(2);

    let pages = [];
    let index = 0;
    let startX = 0;
    let startY = 0;
    let ignoreNextClick = false;
    let resizeTimer;
    let editingNoteId = null;
    let composingNoteAuthor = 'wish';
    let activeSelection = null;
    let focusedNoteIds = null;
    let drawerStartX = 0;
    let dismissedOverlayByPointer = false;

    function fits(fragment, height) {
      measure.style.height = `${height}px`;
      measure.textContent = fragment;
      return measure.scrollHeight <= height + 1;
    }

    function paginate(anchor = 0) {
      const availableHeight = pageText.clientHeight;
      if (!availableHeight || !pageText.clientWidth) return;
      const nextPages = [];
      let start = 0;
      while (start < text.length) {
        let low = start + 1;
        let high = text.length;
        let best = low;
        while (low <= high) {
          const middle = Math.floor((low + high) / 2);
          if (fits(text.slice(start, middle), availableHeight)) {
            best = middle;
            low = middle + 1;
          } else {
            high = middle - 1;
          }
        }
        const end = Math.max(start + 1, best);
        const rawPageText = text.slice(start, end);
        const leadingSpace = rawPageText.match(/^\s*/)?.[0].length || 0;
        const trailingSpace = rawPageText.match(/\s*$/)?.[0].length || 0;
        const displayStart = start + leadingSpace;
        const displayEnd = Math.max(displayStart, end - trailingSpace);
        nextPages.push({
          start,
          end,
          displayStart,
          displayEnd,
          text: text.slice(displayStart, displayEnd)
        });
        start = end;
        while (text[start] === '\n') start += 1;
      }
      pages = nextPages;
      index = Math.max(0, pages.findIndex((page, pageIndex) =>
        anchor >= page.start && (anchor < page.end || pageIndex === pages.length - 1)
      ));
      render();
    }

    function pageOrdinalForAnchor(anchor) {
      if (anchor === null || anchor === undefined || !pages.length) return null;
      const lookup = Number(anchor);
      const found = pages.findIndex((page, pageIndex) =>
        lookup >= page.start && (lookup < page.end || pageIndex === pages.length - 1)
      );
      return Math.max(0, found) + 1;
    }

    function readingPercent(anchor, started = false) {
      if (anchor === null || anchor === undefined || !text.length) return 0;
      const percent = Math.max(0, Math.min(100, (Number(anchor) / text.length) * 100));
      return started ? Math.max(1.5, percent) : percent;
    }

    function persistReadingState() {
      readingState.textLength = text.length;
      readingState.updatedAt = Date.now();
      readingLineStates[activeBookId] = readingState;
      localStorage.setItem(readingLinesKey, JSON.stringify(readingLineStates));
      if (activeBook) {
        activeBook.progress = readingState.wish.current;
        activeBook.updatedAt = readingState.updatedAt;
        localStorage.setItem(booksKey, JSON.stringify(storedBooks));
      }
    }

    function renderReadingLines() {
      const wishCurrent = pageOrdinalForAnchor(readingState.wish.current);
      wishLineStatus.textContent = `书签 ${wishCurrent}/${pages.length}`;
      wishLineFill.style.width = `${readingPercent(readingState.wish.current, true)}%`;

      if (readingState.zheng.current === null) {
        zhengLineStatus.textContent = '还没开始';
        zhengLineFill.style.width = '0%';
      } else {
        const zhengCurrent = pageOrdinalForAnchor(readingState.zheng.current);
        const zhengFurthest = pageOrdinalForAnchor(readingState.zheng.furthest);
        zhengLineStatus.textContent = `书签 ${zhengCurrent}/${pages.length} · 最远 ${zhengFurthest}/${pages.length}`;
        zhengLineFill.style.width = `${readingPercent(readingState.zheng.furthest, true)}%`;
      }

      const page = pages[index];
      const zhengIsHere = page && readingState.zheng.current >= page.start && readingState.zheng.current < page.end;
      markZhengLine.textContent = zhengIsHere ? '峥的书签在本页' : '把峥的书签放在本页';
    }

    function isRangeNote(note) {
      return Number.isFinite(Number(note.rangeStart)) && Number.isFinite(Number(note.rangeEnd))
        && Number(note.rangeEnd) > Number(note.rangeStart);
    }

    function rangeNotesForPage(page) {
      if (!page) return [];
      return readNotes().filter(note =>
        note.bookId === activeBookId && isRangeNote(note)
        && Number(note.rangeStart) < page.displayEnd
        && Number(note.rangeEnd) > page.displayStart
      );
    }

    function renderPageContent(page) {
      const annotations = rangeNotesForPage(page);
      if (!annotations.length) {
        pageText.textContent = page.text;
        return;
      }
      const boundaries = new Set([page.displayStart, page.displayEnd]);
      annotations.forEach(note => {
        boundaries.add(Math.max(page.displayStart, Number(note.rangeStart)));
        boundaries.add(Math.min(page.displayEnd, Number(note.rangeEnd)));
      });
      const points = [...boundaries].sort((a, b) => a - b);
      const fragment = document.createDocumentFragment();
      for (let pointIndex = 0; pointIndex < points.length - 1; pointIndex += 1) {
        const from = points[pointIndex];
        const to = points[pointIndex + 1];
        if (to <= from) continue;
        const matchingNotes = annotations.filter(note =>
          Number(note.rangeStart) < to && Number(note.rangeEnd) > from
        );
        const content = text.slice(from, to);
        if (!matchingNotes.length) {
          fragment.appendChild(document.createTextNode(content));
          continue;
        }
        const mark = document.createElement('span');
        mark.className = 'annotation-highlight';
        mark.dataset.noteIds = matchingNotes.map(note => note.id).join(',');
        mark.textContent = content;
        fragment.appendChild(mark);
      }
      pageText.replaceChildren(fragment);
    }

    function render() {
      const page = pages[index];
      if (!page) return;
      hideSelectionToolbar();
      renderPageContent(page);
      pageNumber.textContent = `${index + 1}/${pages.length}`;
      const currentChapter = tocEntries[resolveTocIndex(page)] || tocEntries[0];
      chapterName.textContent = currentChapter?.title || activeBook?.title || '雨停以后';
      readingState.wish.current = page.start;
      persistReadingState();
      renderReadingLines();
      if (!notesSheet.hidden) renderNotes();
      updateTocCurrent();
    }

    function repaginate() {
      const anchor = pages[index]?.start || 0;
      window.requestAnimationFrame(() => paginate(anchor));
    }

    function applyTypography() {
      const inset = `${fontSlider.value}px`;
      pageText.style.setProperty('margin-left', inset, 'important');
      pageText.style.setProperty('margin-right', inset, 'important');
      measure.style.setProperty('left', inset, 'important');
      measure.style.setProperty('right', inset, 'important');
      const readingFont = '-apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", "Microsoft YaHei", sans-serif';
      pageText.style.setProperty('font-family', readingFont, 'important');
      measure.style.setProperty('font-family', readingFont, 'important');
      pageText.style.setProperty('font-weight', '400', 'important');
      measure.style.setProperty('font-weight', '400', 'important');
    }

    function saveSettings() {
      localStorage.setItem(settingsKey, JSON.stringify({
        fontSize: Number(fontSlider.value),
        lineHeight: Number(lineSlider.value)
      }));
    }

    function normalizeNoteAuthor(author) {
      return author === 'zheng' ? 'zheng' : 'wish';
    }

    function noteAuthorLabel(author) {
      return normalizeNoteAuthor(author) === 'zheng' ? '峥' : '愿';
    }

    function setNoteAuthor(author) {
      composingNoteAuthor = normalizeNoteAuthor(author);
      noteAuthorButtons.forEach(button => {
        const selected = button.dataset.noteAuthor === composingNoteAuthor;
        button.classList.toggle('is-active', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
    }

    function readNotes() {
      try {
        const notes = JSON.parse(localStorage.getItem(notesKey) || '[]');
        return Array.isArray(notes)
          ? notes.map(note => ({ ...note, author: normalizeNoteAuthor(note.author) }))
          : [];
      } catch (_) { return []; }
    }

    function notesOnPage() {
      const page = pages[index];
      if (!page) return [];
      return readNotes().filter(note =>
        note.bookId === activeBookId && (
          isRangeNote(note)
            ? Number(note.rangeStart) < page.displayEnd && Number(note.rangeEnd) > page.displayStart
            : note.anchor >= page.start && note.anchor < page.end
        )
      );
    }

    function renderNotes() {
      const pageNotes = notesOnPage();
      const notes = focusedNoteIds === null
        ? pageNotes
        : pageNotes.filter(note => focusedNoteIds.includes(note.id));
      notesList.replaceChildren();
      if (!notes.length) {
        const empty = document.createElement('p');
        empty.className = 'notes-empty';
        empty.textContent = activeSelection ? '这段原文还没有批注。' : '这里还没有批注。';
        notesList.appendChild(empty);
        return;
      }
      notes.forEach(note => {
        const item = document.createElement('article');
        item.className = 'note-item';
        const noteContent = document.createElement('div');
        noteContent.className = 'note-content';
        const noteAuthor = document.createElement('small');
        noteAuthor.className = 'note-author';
        noteAuthor.textContent = noteAuthorLabel(note.author);
        const noteText = document.createElement('p');
        noteText.className = 'note-text';
        noteText.textContent = note.text;
        noteContent.append(noteAuthor, noteText);

        const more = document.createElement('button');
        more.className = 'note-more';
        more.type = 'button';
        more.textContent = '···';
        more.setAttribute('aria-label', '批注选项');

        const actions = document.createElement('div');
        actions.className = 'note-actions';
        actions.hidden = true;

        const edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = '编辑';

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'delete-note';
        remove.textContent = '删除';

        more.addEventListener('click', () => { actions.hidden = !actions.hidden; });
        edit.addEventListener('click', () => {
          editingNoteId = note.id;
          activeSelection = isRangeNote(note) ? {
            start: Number(note.rangeStart),
            end: Number(note.rangeEnd),
            quote: note.quote || text.slice(Number(note.rangeStart), Number(note.rangeEnd))
          } : null;
          noteCompose.hidden = false;
          saveNote.hidden = false;
          selectionQuote.hidden = !activeSelection;
          selectionQuote.textContent = activeSelection?.quote || '';
          noteInput.value = note.text;
          setNoteAuthor(note.author);
          saveNote.textContent = '保存修改';
          noteInput.focus();
          actions.hidden = true;
        });
        remove.addEventListener('click', () => {
          if (remove.dataset.confirm !== 'true') {
            remove.dataset.confirm = 'true';
            remove.textContent = '确认删除';
            return;
          }
          const nextNotes = readNotes().filter(item => item.id !== note.id);
          localStorage.setItem(notesKey, JSON.stringify(nextNotes));
          if (focusedNoteIds) focusedNoteIds = focusedNoteIds.filter(id => id !== note.id);
          if (editingNoteId === note.id) {
            editingNoteId = null;
            noteInput.value = '';
            setNoteAuthor('wish');
            saveNote.textContent = '留下批注';
          }
          renderPageContent(pages[index]);
          renderNotes();
        });

        actions.append(edit, remove);
        item.append(noteContent, more, actions);
        notesList.appendChild(item);
      });
    }

    function showNotes() {
      selectionQuote.hidden = !activeSelection;
      selectionQuote.textContent = activeSelection?.quote || '';
      renderNotes();
      notesSheet.hidden = false;
      notesSheet.setAttribute('aria-hidden', 'false');
      closeLightPopovers();
    }

    function hideNotes() {
      notesSheet.hidden = true;
      notesSheet.setAttribute('aria-hidden', 'true');
      noteInput.blur();
      editingNoteId = null;
      noteInput.value = '';
      setNoteAuthor('wish');
      saveNote.textContent = '留下批注';
      noteCompose.hidden = true;
      saveNote.hidden = true;
      selectionQuote.hidden = true;
      activeSelection = null;
      focusedNoteIds = null;
    }

    function hideSelectionToolbar() {
      selectionToolbar.hidden = true;
    }

    function selectionOffsets(range) {
      const startRange = document.createRange();
      startRange.selectNodeContents(pageText);
      startRange.setEnd(range.startContainer, range.startOffset);
      const endRange = document.createRange();
      endRange.selectNodeContents(pageText);
      endRange.setEnd(range.endContainer, range.endOffset);
      return {
        start: startRange.toString().length,
        end: endRange.toString().length
      };
    }

    function updateSelectionToolbar() {
      const selection = window.getSelection();
      if (!selection || selection.isCollapsed || !selection.rangeCount) {
        hideSelectionToolbar();
        return;
      }
      const range = selection.getRangeAt(0);
      const startElement = range.startContainer.nodeType === Node.ELEMENT_NODE
        ? range.startContainer
        : range.startContainer.parentElement;
      const endElement = range.endContainer.nodeType === Node.ELEMENT_NODE
        ? range.endContainer
        : range.endContainer.parentElement;
      if (!startElement || !endElement || !pageText.contains(startElement) || !pageText.contains(endElement)) {
        hideSelectionToolbar();
        return;
      }
      const page = pages[index];
      if (!page) return;
      const offsets = selectionOffsets(range);
      const rangeStart = page.displayStart + Math.min(offsets.start, offsets.end);
      const rangeEnd = page.displayStart + Math.max(offsets.start, offsets.end);
      const quote = text.slice(rangeStart, rangeEnd).trim();
      if (!quote) {
        hideSelectionToolbar();
        return;
      }
      const leadingTrim = text.slice(rangeStart, rangeEnd).indexOf(quote);
      const start = rangeStart + Math.max(0, leadingTrim);
      const end = start + quote.length;
      activeSelection = {
        start,
        end,
        quote,
        prefix: text.slice(Math.max(0, start - 60), start),
        suffix: text.slice(end, Math.min(text.length, end + 60))
      };
      const rect = range.getBoundingClientRect();
      selectionToolbar.style.left = `${Math.max(46, Math.min(window.innerWidth - 46, rect.left + rect.width / 2))}px`;
      selectionToolbar.style.top = `${Math.max(66, rect.top - 8)}px`;
      selectionToolbar.hidden = false;
    }

    function composeForSelection() {
      if (!activeSelection) return;
      focusedNoteIds = [];
      editingNoteId = null;
      noteInput.value = '';
      setNoteAuthor('wish');
      saveNote.textContent = '留下批注';
      noteCompose.hidden = false;
      saveNote.hidden = false;
      hideSelectionToolbar();
      window.getSelection()?.removeAllRanges();
      showNotes();
      window.setTimeout(() => noteInput.focus(), 80);
    }

    function showHighlightedNotes(noteIds) {
      const notes = readNotes().filter(note => noteIds.includes(note.id));
      if (!notes.length) return;
      const first = notes[0];
      activeSelection = isRangeNote(first) ? {
        start: Number(first.rangeStart),
        end: Number(first.rangeEnd),
        quote: first.quote || text.slice(Number(first.rangeStart), Number(first.rangeEnd))
      } : null;
      focusedNoteIds = noteIds;
      noteCompose.hidden = true;
      saveNote.hidden = true;
      showNotes();
    }

    async function copyContext() {
      const page = pages[index];
      if (!page) return;
      const from = Math.max(0, page.start - 2000);
      const to = Math.min(text.length, page.end + 2000);
      const relatedNotes = readNotes().filter(note =>
        note.bookId === activeBookId && (
          isRangeNote(note)
            ? Number(note.rangeStart) < to && Number(note.rangeEnd) > from
            : note.anchor >= from && note.anchor < to
        )
      );
      const noteBlock = relatedNotes.length
        ? relatedNotes.map((note, i) => {
            const quote = isRangeNote(note) ? `「${note.quote || text.slice(note.rangeStart, note.rangeEnd)}」` : '（旧页边批注）';
            return `${i + 1}. ${noteAuthorLabel(note.author)}｜${quote}：${note.text}`;
          }).join('\n')
        : '无';
      const packet = [
        `【Sideleaf｜${chapterName.textContent}｜${index + 1}/${pages.length}】`,
        '以下是当前页前后约 2000 字，用于找回阅读位置；不要默认我已读完其中后文。',
        '',
        text.slice(from, to),
        '',
        '【相关批注】',
        noteBlock
      ].join('\n');
      try {
        await navigator.clipboard.writeText(packet);
        sendContext.textContent = '已复制，去找峥';
      } catch (_) {
        sendContext.textContent = '复制失败，再点一次';
      }
      window.setTimeout(() => { sendContext.textContent = '递给峥'; }, 1800);
    }

    function turn(delta) {
      const next = index + delta;
      if (next < 0 || next >= pages.length) return;
      index = next;
      render();
    }

    function resolveTocIndex(page) {
      if (!page) return 0;
      let currentIndex = 0;
      tocEntries.forEach((entry, entryIndex) => {
        if (entry.anchor < page.end) currentIndex = entryIndex;
      });
      return currentIndex;
    }

    function updateTocCurrent() {
      const currentIndex = resolveTocIndex(pages[index]);
      tocList.querySelectorAll('.toc-entry').forEach((button, buttonIndex) => {
        button.classList.toggle('is-current', buttonIndex === currentIndex);
      });
    }

    function renderToc() {
      tocList.replaceChildren();
      tocEntries.forEach(entry => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `toc-entry level-${entry.level}`;
        button.textContent = entry.title;
        button.addEventListener('click', () => {
          const targetIndex = pages.findIndex((page, pageIndex) =>
            entry.anchor >= page.start && (entry.anchor < page.end || pageIndex === pages.length - 1)
          );
          if (targetIndex >= 0) {
            index = targetIndex;
            render();
          }
          closeToc();
        });
        tocList.appendChild(button);
      });
      updateTocCurrent();
    }

    function lightPopoverFor(trigger) {
      const panelId = trigger?.getAttribute('aria-controls');
      return panelId ? document.getElementById(panelId) : null;
    }

    function setLightPopover(trigger, open) {
      const panel = lightPopoverFor(trigger);
      if (!panel) return;
      panel.hidden = !open;
      panel.classList.toggle('is-open', open);
      trigger.setAttribute('aria-expanded', String(open));
    }

    function closeLightPopovers(exceptTrigger = null) {
      root.querySelectorAll('[data-light-popover-trigger][aria-expanded="true"]').forEach(trigger => {
        if (trigger !== exceptTrigger) setLightPopover(trigger, false);
      });
    }

    function toggleLightPopover(trigger) {
      const open = trigger.getAttribute('aria-expanded') !== 'true';
      closeLightPopovers(trigger);
      setLightPopover(trigger, open);
    }

    function openToc() {
      renderToc();
      root.classList.add('toc-open');
      tocDrawer.setAttribute('aria-hidden', 'false');
      closeLightPopovers();
    }

    function closeToc() {
      root.classList.remove('toc-open');
      tocDrawer.setAttribute('aria-hidden', 'true');
    }

    root.addEventListener('click', event => {
      const trigger = event.target.closest('[data-light-popover-trigger]');
      if (!trigger || !root.contains(trigger)) return;
      event.stopPropagation();
      toggleLightPopover(trigger);
    }, true);

    openNotes.addEventListener('click', () => {
      activeSelection = null;
      focusedNoteIds = null;
      noteCompose.hidden = true;
      saveNote.hidden = true;
      showNotes();
    });
    closeNotes.addEventListener('click', hideNotes);
    annotateSelection.addEventListener('click', composeForSelection);
    sendContext.addEventListener('click', copyContext);
    noteAuthorButtons.forEach(button => {
      button.addEventListener('click', () => setNoteAuthor(button.dataset.noteAuthor));
    });
    markZhengLine.addEventListener('click', () => {
      const page = pages[index];
      if (!page) return;
      readingState.zheng.current = page.start;
      readingState.zheng.furthest = Math.max(readingState.zheng.furthest ?? 0, page.start);
      persistReadingState();
      renderReadingLines();
    });
    tocBackdrop.addEventListener('click', closeToc);
    tocDrawer.addEventListener('pointerdown', event => { drawerStartX = event.clientX; });
    tocDrawer.addEventListener('pointerup', event => {
      if (event.clientX - drawerStartX < -52) closeToc();
    });
    pageNumber.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') pageNumber.click();
    });

    document.addEventListener('pointerdown', event => {
      let dismissed = false;
      root.querySelectorAll('[data-light-popover-trigger][aria-expanded="true"]').forEach(trigger => {
        const panel = lightPopoverFor(trigger);
        if (!panel || panel.contains(event.target) || trigger.contains(event.target)) return;
        setLightPopover(trigger, false);
        dismissed = true;
      });
      dismissedOverlayByPointer = dismissed && sheet.contains(event.target);
    }, true);
    saveNote.addEventListener('click', () => {
      const value = noteInput.value.trim();
      const page = pages[index];
      if (!value || !page || (!editingNoteId && !activeSelection)) return;
      const notes = readNotes();
      if (editingNoteId) {
        const target = notes.find(note => note.id === editingNoteId);
        if (target) {
          target.text = value;
          target.author = composingNoteAuthor;
          target.updatedAt = Date.now();
        }
      } else {
        notes.push({
          id: window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          bookId: activeBookId,
          anchor: activeSelection.start,
          rangeStart: activeSelection.start,
          rangeEnd: activeSelection.end,
          quote: activeSelection.quote,
          prefix: activeSelection.prefix,
          suffix: activeSelection.suffix,
          text: value,
          author: composingNoteAuthor,
          createdAt: Date.now(),
          updatedAt: Date.now()
        });
      }
      localStorage.setItem(notesKey, JSON.stringify(notes));
      if (activeSelection) {
        focusedNoteIds = notes.filter(note =>
          note.bookId === activeBookId
          && Number(note.rangeStart) === activeSelection.start
          && Number(note.rangeEnd) === activeSelection.end
        ).map(note => note.id);
      }
      editingNoteId = null;
      noteInput.value = '';
      setNoteAuthor('wish');
      saveNote.textContent = '留下批注';
      renderPageContent(page);
      renderNotes();
    });

    fontSlider.addEventListener('input', () => {
      root.style.setProperty('--reader-size', `${fontSlider.value}px`);
      fontOutput.textContent = `${fontSlider.value}px`;
      applyTypography();
      saveSettings();
      repaginate();
    });

    lineSlider.addEventListener('input', () => {
      root.style.setProperty('--reader-leading', lineSlider.value);
      lineOutput.textContent = Number(lineSlider.value).toFixed(2);
      saveSettings();
      repaginate();
    });

    sheet.addEventListener('pointerdown', event => {
      startX = event.clientX;
      startY = event.clientY;
    });

    sheet.addEventListener('pointerup', event => {
      const dx = event.clientX - startX;
      const dy = event.clientY - startY;
      const bounds = sheet.getBoundingClientRect();
      const startedInLeftHalf = startX <= bounds.left + bounds.width * .5;
      if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy)) {
        ignoreNextClick = true;
        if (dx > 58 && startedInLeftHalf) openToc();
        window.setTimeout(() => { ignoreNextClick = false; }, 350);
      }
      window.setTimeout(updateSelectionToolbar, 30);
    });

    sheet.addEventListener('click', event => {
      if (dismissedOverlayByPointer) {
        dismissedOverlayByPointer = false;
        return;
      }
      const annotation = event.target.closest('.annotation-highlight');
      if (annotation) {
        const noteIds = (annotation.dataset.noteIds || '').split(',').filter(Boolean);
        showHighlightedNotes(noteIds);
        return;
      }
      if (ignoreNextClick || window.getSelection()?.toString().trim()) return;
      const bounds = sheet.getBoundingClientRect();
      const position = (event.clientX - bounds.left) / bounds.width;
      if (position < .35) turn(-1);
      if (position > .65) turn(1);
      if (position >= .35 && position <= .65) {
        toggleLightPopover(pageNumber);
      }
    });

    let selectionTimer;
    document.addEventListener('selectionchange', () => {
      window.clearTimeout(selectionTimer);
      selectionTimer = window.setTimeout(updateSelectionToolbar, 80);
    });

    sheet.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') turn(-1);
      if (event.key === 'ArrowRight') turn(1);
    });

    const observer = new ResizeObserver(() => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(repaginate, 80);
    });
    observer.observe(pageText);
    applyTypography();
    paginate(initialAnchor);
    renderToc();
  })();
</script>
</body>
</html>
