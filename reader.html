<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfaf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sideleaf">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Sideleaf · 阅读</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  @view-transition {
    navigation: auto;
  }
  ::view-transition-group(sideleaf-book) {
    animation-duration: .42s;
    animation-timing-function: cubic-bezier(.22, .78, .18, 1);
  }
  :root {
    --foreground: #544c44;
    --muted-foreground: #8a8379;
    --border: rgba(71, 62, 51, .14);
    --card: #fcfaf7;
    --card-foreground: #544c44;
    --primary: #8f6f60;
    --wish: #c98264;
    --zheng: #657572;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --shadow-md: 0 12px 36px rgba(62, 52, 42, .10);
  }
  * { box-sizing: border-box; }
  html {
    -webkit-tap-highlight-color: transparent;
  }
  a,
  button,
  input,
  textarea,
  [role="button"] {
    -webkit-tap-highlight-color: transparent;
  }
  button {
    -webkit-appearance: none;
    appearance: none;
  }
  ::selection {
    background-color: #e7b7a2 !important;
    color: #544c44 !important;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #fcfaf7;
  }
  body {
    margin: 0;
    overflow: hidden;
    background: #fcfaf7;
    color: var(--foreground);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", sans-serif;
    touch-action: manipulation;
  }
</style>
</head>
<body>
<div id="pagination-tester" class="viz-root" lang="zh-CN">
  <section class="tester-shell">
    <a class="shelf-link" href="./" aria-label="返回书架">‹</a>
    <button class="type-toggle" type="button" data-light-popover-trigger aria-expanded="false" aria-controls="tester-controls" aria-label="调整字号和行距">Aa</button>
    <div id="tester-controls" class="tester-controls" data-light-popover hidden>
      <label for="font-slider">字号 <output id="font-output">17px</output></label>
      <input id="font-slider" type="range" min="16" max="25" value="17">
      <label for="line-slider">行距 <output id="line-output">1.55</output></label>
      <input id="line-slider" type="range" min="1.55" max="2.45" step="0.05" value="1.55">
      <small class="build-version">Sideleaf 0.15.6</small>
    </div>

    <div class="page-wrap">
      <article class="reading-sheet" tabindex="0" aria-live="polite">
        <div class="chapter-name">雨停以后</div>
        <div class="page-text"></div>
        <div class="page-number" role="button" tabindex="0" data-light-popover-trigger aria-expanded="false" aria-controls="page-tools" aria-label="打开本页工具"></div>
      </article>
      <div class="measure-text" aria-hidden="true"></div>
    </div>

    <nav id="page-tools" class="page-tools" data-light-popover aria-label="本页工具" hidden>
      <button id="send-context" type="button" aria-label="整理当前页及前文给峥回顾">回望</button>
      <span aria-hidden="true"></span>
      <button id="request-zheng-read" type="button" aria-label="请峥正式阅读当前页">峥来读</button>
      <span aria-hidden="true"></span>
      <button id="open-chapter-journal" type="button">章节札记</button>
      <span aria-hidden="true"></span>
      <button id="open-reading-lines" type="button" data-light-popover-trigger aria-expanded="false" aria-controls="reading-lines-panel">阅读线</button>
    </nav>

    <section id="reading-lines-panel" class="reading-lines-panel" data-light-popover aria-label="两条阅读线" hidden>
      <div class="reading-lines-head">两条阅读线</div>
      <div class="reading-line-row wish-line">
        <div class="reading-line-copy"><strong>愿</strong><span id="wish-line-status">现在这里</span></div>
        <div class="reading-line-track"><i id="wish-line-fill"></i></div>
      </div>
      <div class="reading-line-row zheng-line">
        <div class="reading-line-copy"><strong>峥</strong><span id="zheng-line-status">还没开始</span></div>
        <div class="reading-line-track"><i id="zheng-line-fill"></i></div>
      </div>
      <button id="mark-zheng-line" class="mark-zheng-line" type="button">把峥的书签放在本页</button>
      <p class="reading-lines-note">愿的线跟着当前页面移动；峥的线只在你明确放下书签时移动。</p>
    </section>

    <section id="chapter-journal" class="chapter-journal" role="dialog" aria-modal="false" aria-labelledby="chapter-journal-heading" aria-hidden="true" hidden>
      <div class="chapter-journal-head">
        <div>
          <strong id="chapter-journal-heading">峥的章节札记</strong>
          <small id="chapter-journal-title"></small>
        </div>
        <button id="close-chapter-journal" type="button">完成</button>
      </div>
      <textarea id="chapter-journal-input" rows="9" placeholder="把这一章的情节、疑问、判断和当时的感受完整留下来。"></textarea>
      <div class="chapter-journal-meta">
        <span id="chapter-journal-status">尚未留下札记</span>
        <span id="chapter-journal-count">0 字</span>
      </div>
      <div class="chapter-journal-actions">
        <button id="copy-chapter-journal" type="button" disabled>递给峥</button>
        <button id="save-chapter-journal" type="button" disabled>保存札记</button>
      </div>
    </section>

    <div id="selection-toolbar" class="selection-toolbar" hidden>
      <button id="like-selection" class="like-selection" type="button" aria-label="喜欢这句话" aria-pressed="false">♡</button>
      <span aria-hidden="true"></span>
      <button id="annotate-selection" type="button">说一句</button>
    </div>
    <div id="selection-handles" class="selection-handles" aria-hidden="true" hidden>
      <button class="selection-handle is-start" type="button" data-selection-edge="start" tabindex="-1" aria-label="调整选区开头"></button>
      <button class="selection-handle is-end" type="button" data-selection-edge="end" tabindex="-1" aria-label="调整选区结尾"></button>
    </div>

    <section class="notes-sheet" role="dialog" aria-modal="false" aria-label="原句对话" aria-hidden="true" hidden>
      <blockquote id="selection-quote" class="selection-quote" hidden></blockquote>
      <div id="notes-list" class="notes-list"></div>
      <div id="note-compose" class="note-compose" hidden>
        <textarea id="note-input" rows="4" aria-label="说一句" placeholder="接着说。"></textarea>
        <button id="save-note" class="save-note" type="button" hidden>发送</button>
      </div>
    </section>

    <div class="toc-backdrop" aria-hidden="true"></div>
    <aside class="toc-drawer" aria-hidden="true" aria-label="目录">
      <div class="toc-head">
        <strong id="toc-book-title">雨停以后</strong>
      </div>
      <nav id="toc-list" class="toc-list" aria-label="章节目录"></nav>
    </aside>

  </section>
</div>

<style>
  #pagination-tester {
    width: 100%;
    height: 100%;
    padding: 0;
    color: var(--foreground);
    --reader-size: 17px;
    --reader-leading: 1.55;
  }
  #pagination-tester .tester-shell {
    width: 100%;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }
  #pagination-tester .tester-controls {
    position: fixed;
    z-index: 20;
    top: calc(max(12px, env(safe-area-inset-top)) + 48px);
    right: max(12px, env(safe-area-inset-right));
    display: none;
    width: min(440px, calc(100% - 24px));
    grid-template-columns: auto minmax(90px, 1fr) auto minmax(90px, 1fr);
    align-items: center;
    gap: var(--space-3);
    margin: 0;
    padding: var(--space-3) var(--space-4);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: rgba(252, 250, 247, .97);
    box-shadow: var(--shadow-md);
    backdrop-filter: blur(16px);
  }
  #pagination-tester .tester-controls.is-open { display: grid; }
  #pagination-tester .type-toggle {
    position: fixed;
    z-index: 21;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    width: 40px;
    height: 40px;
    padding: 0;
    border: 1px solid rgba(71, 62, 51, .12);
    border-radius: 999px;
    background: rgba(252, 250, 247, .82);
    color: var(--muted-foreground);
    box-shadow: 0 4px 16px rgba(62, 52, 42, .08);
    backdrop-filter: blur(12px);
    font: 500 15px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #pagination-tester .shelf-link {
    position: fixed;
    z-index: 21;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(71, 62, 51, .12);
    border-radius: 999px;
    background: rgba(252, 250, 247, .82);
    color: var(--muted-foreground);
    box-shadow: 0 4px 16px rgba(62, 52, 42, .08);
    backdrop-filter: blur(12px);
    text-decoration: none;
    font: 300 30px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #pagination-tester label {
    color: var(--muted-foreground);
    white-space: nowrap;
  }
  #pagination-tester output {
    color: var(--foreground);
    font-variant-numeric: tabular-nums;
  }
  #pagination-tester input { width: 100%; accent-color: var(--primary); }
  #pagination-tester .build-version {
    grid-column: 1 / -1;
    color: rgba(138, 131, 121, .72);
    text-align: right;
    font-size: 10px;
    letter-spacing: .04em;
  }
  #pagination-tester .page-wrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
  }
  #pagination-tester .reading-sheet {
    box-sizing: border-box;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: var(--space-6) 0 0;
    border: 0;
    border-radius: 0;
    background: var(--card);
    color: var(--card-foreground);
    box-shadow: none;
    touch-action: pan-y;
    user-select: none;
    cursor: pointer;
    view-transition-name: sideleaf-book;
  }
  #pagination-tester .chapter-name {
    flex: 0 0 auto;
    margin-bottom: var(--space-5);
    text-align: center;
    color: var(--muted-foreground);
  }
  #pagination-tester .page-text,
  #pagination-tester .measure-text {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", "Microsoft YaHei", sans-serif !important;
    font-weight: 370 !important;
    font-size: var(--reader-size);
    line-height: var(--reader-leading);
    letter-spacing: .025em;
    white-space: pre-wrap;
    line-break: strict;
    word-break: normal;
    overflow-wrap: normal;
    text-align: justify;
  }
  #pagination-tester .page-text,
  #pagination-tester .page-text * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #pagination-tester .page-text {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    margin-right: calc(var(--reader-size) * 1.5) !important;
    margin-left: calc(var(--reader-size) * 1.5) !important;
  }
  #pagination-tester .annotation-highlight {
    padding-bottom: .04em;
    border-bottom: 1.5px solid transparent;
    cursor: pointer;
  }
  #pagination-tester .annotation-highlight.is-wish {
    border-bottom-color: rgba(201, 130, 100, .88);
    background: linear-gradient(to top, rgba(201, 130, 100, .14) 0 .42em, transparent .42em);
  }
  #pagination-tester .annotation-highlight.is-zheng {
    border-bottom-color: rgba(101, 117, 114, .88);
    background: linear-gradient(to top, rgba(101, 117, 114, .14) 0 .42em, transparent .42em);
  }
  #pagination-tester .annotation-highlight.is-both {
    border-bottom-color: rgba(143, 123, 109, .88);
    background:
      linear-gradient(to top, rgba(201, 130, 100, .13) 0 .34em, transparent .34em),
      linear-gradient(to top, rgba(101, 117, 114, .10) 0 .58em, transparent .58em);
  }
  #pagination-tester .zheng-read-marker {
    display: inline-block;
    width: .42em;
    height: .42em;
    margin-left: .14em;
    border-radius: 999px;
    background: var(--zheng);
    box-shadow: 0 0 0 2px rgba(101, 117, 114, .12);
    transform: translateY(-.08em);
  }
  #pagination-tester .active-selection-highlight {
    padding: 0;
    border-radius: 0;
    background: rgba(201, 130, 100, .18) !important;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  #pagination-tester .page-text,
  #pagination-tester .page-text * {
    caret-color: #c98264;
  }
  #pagination-tester .page-number {
    flex: 0 0 1em;
    min-height: 1em;
    margin-top: calc(var(--reader-size) / 2);
    margin-bottom: calc(var(--reader-size) * 1.667);
    text-align: center;
    color: var(--muted-foreground);
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #pagination-tester .measure-text {
    position: absolute;
    left: calc(var(--reader-size) * 1.5) !important;
    right: calc(var(--reader-size) * 1.5) !important;
    top: 0;
    height: 1px;
    overflow: hidden;
    visibility: hidden;
    pointer-events: none;
  }
  [hidden] { display: none !important; }
  #pagination-tester .page-tools {
    position: fixed;
    z-index: 30;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: auto 1px auto 1px auto 1px auto;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border: 1px solid rgba(71, 62, 51, .12);
    border-radius: 999px;
    background: rgba(252, 250, 247, .95);
    box-shadow: 0 10px 30px rgba(62, 52, 42, .16);
    backdrop-filter: blur(16px);
  }
  #pagination-tester .page-tools span {
    width: 1px;
    height: 18px;
    background: var(--border);
  }
  #pagination-tester .page-tools button,
  #pagination-tester .notes-sheet button,
  #pagination-tester .reading-lines-panel button {
    border: 0;
    background: transparent;
    color: var(--foreground);
    font: 500 14px/1.2 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  #pagination-tester .reading-lines-panel {
    position: fixed;
    z-index: 31;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    width: min(calc(100% - 36px), 360px);
    transform: translateX(-50%);
    padding: 16px;
    border: 1px solid rgba(71, 62, 51, .12);
    border-radius: 18px;
    background: rgba(252, 250, 247, .98);
    box-shadow: 0 12px 34px rgba(62, 52, 42, .16);
    backdrop-filter: blur(16px);
  }
  #pagination-tester .reading-lines-head {
    margin-bottom: 13px;
    font-size: 15px;
    font-weight: 650;
  }
  #pagination-tester .reading-line-row + .reading-line-row { margin-top: 13px; }
  #pagination-tester .reading-line-copy {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 7px;
  }
  #pagination-tester .reading-line-copy strong { font-size: 14px; }
  #pagination-tester .reading-line-copy span {
    color: var(--muted-foreground);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  #pagination-tester .reading-line-track {
    height: 3px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(71, 62, 51, .10);
  }
  #pagination-tester .reading-line-track i {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    transition: width .22s ease;
  }
  #pagination-tester .wish-line .reading-line-track i { background: #a57f70; }
  #pagination-tester .zheng-line .reading-line-track i { background: #707b78; }
  #pagination-tester .reading-lines-panel .mark-zheng-line {
    width: 100%;
    margin-top: 16px;
    padding: 11px 14px;
    border-radius: 999px;
    background: var(--primary);
    color: #fffaf4;
  }
  #pagination-tester .reading-lines-note {
    margin: 10px 2px 0;
    color: var(--muted-foreground);
    font-size: 11px;
    line-height: 1.55;
  }
  #pagination-tester .chapter-journal {
    position: fixed;
    z-index: 38;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    width: min(calc(100% - 32px), 430px);
    max-height: min(74svh, 620px);
    overflow: auto;
    transform: translateX(-50%);
    padding: 17px;
    border: 1px solid rgba(71, 62, 51, .12);
    border-radius: 20px;
    background: rgba(252, 250, 247, .985);
    box-shadow: 0 16px 44px rgba(62, 52, 42, .18);
    backdrop-filter: blur(18px);
  }
  #pagination-tester .chapter-journal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
  }
  #pagination-tester .chapter-journal-head > div {
    display: grid;
    min-width: 0;
    gap: 4px;
  }
  #pagination-tester .chapter-journal-head strong { font-size: 16px; }
  #pagination-tester .chapter-journal-head small {
    overflow: hidden;
    color: var(--muted-foreground);
    font-size: 12px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #pagination-tester .chapter-journal-head button {
    flex: 0 0 auto;
    border: 0;
    background: transparent;
    color: var(--primary);
    font: 600 14px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  #pagination-tester .chapter-journal textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: 14px;
    outline: none;
    background: #fffaf2;
    color: var(--foreground);
    caret-color: var(--wish);
    font: 400 16px/1.68 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  #pagination-tester .chapter-journal textarea:focus { border-color: rgba(201, 130, 100, .48); }
  #pagination-tester .chapter-journal-meta {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 8px 2px 0;
    color: var(--muted-foreground);
    font-size: 11px;
  }
  #pagination-tester .chapter-journal-actions {
    display: grid;
    grid-template-columns: 1fr 1.45fr;
    gap: 9px;
    margin-top: 13px;
  }
  #pagination-tester .chapter-journal-actions button {
    padding: 12px 14px;
    border: 0;
    border-radius: 999px;
    background: rgba(143, 111, 96, .10);
    color: var(--primary);
    font: 600 14px/1.2 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  #pagination-tester .chapter-journal-actions #save-chapter-journal {
    background: var(--primary);
    color: #fffaf4;
  }
  #pagination-tester .chapter-journal-actions button:disabled {
    opacity: .38;
  }
  #pagination-tester .selection-toolbar {
    position: fixed;
    z-index: 45;
    display: flex;
    align-items: center;
    transform: translate(-50%, -100%);
    overflow: hidden;
    padding: 4px 6px;
    isolation: isolate;
    border: 1px solid rgba(255, 255, 255, .82);
    border-radius: 999px;
    background: linear-gradient(145deg, rgba(255, 255, 255, .58), rgba(232, 237, 238, .46));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .92),
      inset 0 -1px 0 rgba(91, 102, 105, .10),
      0 10px 30px rgba(67, 75, 76, .17);
    -webkit-backdrop-filter: blur(24px) saturate(1.42);
    backdrop-filter: blur(24px) saturate(1.42);
  }
  #pagination-tester .selection-toolbar::before {
    content: "";
    position: absolute;
    z-index: 0;
    inset: 1px 7px auto;
    height: 42%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .64), rgba(255, 255, 255, 0));
    pointer-events: none;
  }
  #pagination-tester .selection-toolbar > * {
    position: relative;
    z-index: 1;
  }
  #pagination-tester .selection-toolbar[hidden] {
    display: none;
  }
  #pagination-tester .selection-toolbar > span {
    width: 1px;
    height: 18px;
    background: rgba(84, 76, 68, .16);
  }
  #pagination-tester .selection-toolbar button {
    min-height: 32px;
    padding: 8px 13px;
    border: 0;
    background: transparent;
    color: var(--foreground);
    font: 620 13px/1 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  #pagination-tester .selection-toolbar .like-selection {
    min-width: 36px;
    padding-inline: 10px;
    color: var(--wish);
    font-size: 20px;
    font-weight: 450;
    transform-origin: center;
  }
  #pagination-tester .selection-toolbar .like-selection.is-liked {
    text-shadow: 0 3px 10px rgba(201, 130, 100, .24);
  }
  #pagination-tester .selection-toolbar .like-selection.did-toggle {
    animation: sideleaf-heart-pulse .28s cubic-bezier(.2, .8, .3, 1);
  }
  @keyframes sideleaf-heart-pulse {

    const wishLineStatus = root.querySelector('#wish-line-status');
    const zhengLineStatus = root.querySelector('#zheng-line-status');
    const wishLineFill = root.querySelector('#wish-line-fill');
    const zhengLineFill = root.querySelector('#zheng-line-fill');
    const markZhengLine = root.querySelector('#mark-zheng-line');

    const chapterJournal = root.querySelector('#chapter-journal');
    const closeChapterJournal = root.querySelector('#close-chapter-journal');
    const chapterJournalTitle = root.querySelector('#chapter-journal-title');

    const copyChapterJournal = root.querySelector('#copy-chapter-journal');
    const saveChapterJournal = root.querySelector('#save-chapter-journal');
    const tocDrawer = root.querySelector('.toc-drawer');
    const tocBackdrop = root.querySelector('.toc-backdrop');
    const tocList = root.querySelector('#toc-list');
    const tocBookTitle = root.querySelector('#toc-book-title');

    const booksKey = 'sideleaf.books.v1';
    const settingsKey = 'sideleaf.settings.v1';
    const notesKey = 'sideleaf.notes.v1';
    const likesKey = 'sideleaf.likes.v1';
    const readingLinesKey = 'sideleaf.reading-lines.v1';
    const chapterJournalsKey = 'sideleaf.chapter-journals.v1';
    const readingRequestsKey = 'sideleaf.read-requests.v1';
    const paginationCacheKey = '__sideleaf_pagination_cache_v1';
    const paginationLayoutVersion = '3';
    const bookId = new URLSearchParams(window.location.search).get('book');
    const storedBooks = SideleafLibrary.ensure(localStorage);
    const activeBook = storedBooks.find(book => book.id === (bookId || SideleafLibrary.DEFAULT_BOOK_ID))
      || SideleafLibrary.BUILT_IN_BOOKS[0];
    const activeBookId = activeBook.id;
    const text = activeBook.content;
    let readingLineStates = {};
    try { readingLineStates = JSON.parse(localStorage.getItem(readingLinesKey) || '{}'); } catch (_) {}

    function clampAnchor(value, fallback = 0) {
      const number = Number(value);
      return Number.isFinite(number) ? Math.max(0, Math.min(text.length, number)) : fallback;
    }

    function nullableAnchor(value) {
      return value === null || value === undefined ? null : clampAnchor(value);
    }

    const legacyAnchor = clampAnchor(activeBook?.progress || 0);
    const storedReadingState = readingLineStates[activeBookId] || {};
    const readingStateIsCurrent = storedReadingState.schemaVersion === 2;
    const migratedWishCurrent = clampAnchor(storedReadingState.wish?.current, legacyAnchor);
    const migratedZhengCurrent = nullableAnchor(storedReadingState.zheng?.current);
    const readingState = {
      wish: {
        current: migratedWishCurrent
      },
      zheng: {
        current: migratedZhengCurrent,
        furthest: readingStateIsCurrent
          ? nullableAnchor(storedReadingState.zheng?.furthest)
          : migratedZhengCurrent
      },
      schemaVersion: 2,
      textLength: text.length,
      updatedAt: Number(storedReadingState.updatedAt) || Date.now()
    };
    const initialAnchor = readingState.wish.current;

    function parseToc(source) {
      if (Array.isArray(activeBook.toc) && activeBook.toc.length) {
        const normalizedBookTitle = (activeBook.title || '').replace(/[\s　·:：_《》〈〉「」『』-]+/g, '').toLowerCase();
        const structuredEntries = activeBook.toc
          .map(entry => ({
            title: String(entry.title || '').trim(),
            level: Math.min(3, Math.max(1, Number(entry.level) || 1)),
            anchor: clampAnchor(entry.anchor)
          }))
          .filter(entry => {
            const normalizedTitle = entry.title.replace(/[\s　·:：_《》〈〉「」『』-]+/g, '').toLowerCase();
            return entry.title
              && normalizedTitle !== normalizedBookTitle
              && !/^(?:目录|目次|contents?)$/i.test(entry.title);
          })
          .sort((a, b) => a.anchor - b.anchor);
        if (structuredEntries.length) return structuredEntries;
      }
      const entries = [];
      let offset = 0;
      let markdownLevelShift = 0;
      const normalizedBookTitle = (activeBook.title || '').replace(/[\s　·:：_-]+/g, '').toLowerCase();
      source.split('\n').forEach(line => {
        const trimmed = line.trim();
        const markdown = trimmed.match(/^(#{1,3})\s+(.+?)\s*#*$/);
        const volume = trimmed.match(/^(第[^\s]{1,12}[卷部篇章回])(?:[\s　:：·-]+(.+))?$/);
        const section = trimmed.match(/^(第[^\s]{1,12}节)(?:[\s　:：·-]+(.+))?$/);
        const special = trimmed.match(/^(序章|序言|前言|楔子|引子|后记|尾声|终章)(?:[\s　:：·-]+(.+))?$/);
        if (markdown) {
          const headingTitle = markdown[2].trim();
          const normalizedHeading = headingTitle.replace(/[\s　·:：_-]+/g, '').toLowerCase();
          if (!entries.length && normalizedHeading === normalizedBookTitle) {
            markdownLevelShift = 1;
          } else {
            entries.push({
              title: headingTitle,
              level: Math.min(3, Math.max(1, markdown[1].length - markdownLevelShift)),
              anchor: offset
            });
          }
        } else if (section) {
          entries.push({ title: trimmed, level: 2, anchor: offset });
        } else if (volume || special) {
          entries.push({ title: trimmed, level: 1, anchor: offset });
        }
        offset += line.length + 1;
      });
      return entries.length ? entries : [{ title: activeBook.title || '正文', level: 1, anchor: 0 }];
    }

    const tocEntries = parseToc(text);

    chapterName.textContent = activeBook.title;
    tocBookTitle.textContent = activeBook.title;
    document.title = `${chapterName.textContent} · Sideleaf`;

    let savedSettings = {};
    try { savedSettings = JSON.parse(localStorage.getItem(settingsKey) || '{}'); } catch (_) {}
    if (savedSettings.fontSize) fontSlider.value = savedSettings.fontSize;
    if (savedSettings.lineHeight) lineSlider.value = savedSettings.lineHeight;
    root.style.setProperty('--reader-size', `${fontSlider.value}px`);
    root.style.setProperty('--reader-leading', lineSlider.value);
    fontOutput.textContent = `${fontSlider.value}px`;
    lineOutput.textContent = Number(lineSlider.value).toFixed(2);

    let pages = [];
    let index = 0;
    let startX = 0;
    let startY = 0;
    let ignoreNextClick = false;
    let resizeTimer;
    let editingNoteId = null;
    let composingNoteAuthor = 'wish';
    let activeSelection = null;
    let activeSelectionHighlightVisible = false;
    let focusedNoteIds = null;
    let notesAnchorRect = null;
    let drawerStartX = 0;
    let dismissedOverlayByPointer = false;
    let longPressTimer = null;
    let longPressTriggered = false;
    let longPressStartX = 0;
    let longPressStartY = 0;
    let draggingSelectionEdge = null;
    let selectionDragFrame = null;
    let activeJournalUnit = null;
    let activeJournalOriginal = '';
    let paginationRun = 0;
    let paginationComplete = false;

    function fits(fragment, height) {
      measure.style.height = `${height}px`;
      measure.textContent = fragment;
      return measure.scrollHeight <= height + 1;
    }

    const prohibitedPageStart = /[，。！？、；：）》」』】〕〉〗”’％‰℃°…—～·]/;
    const prohibitedPageEnd = /[（《「『【〔〈〖“‘]/;

    function adjustPageEnd(start, end, hardLimit) {
      let adjusted = end;
      if (end < hardLimit && end < text.length && prohibitedPageStart.test(text[end])) {
        let punctuationStart = end;
        while (punctuationStart > start && prohibitedPageStart.test(text[punctuationStart - 1])) {
          punctuationStart -= 1;
        }
        if (punctuationStart > start + 1 && !/\s/.test(text[punctuationStart - 1])) {
          adjusted = punctuationStart - 1;
        }
      }
      while (adjusted > start + 1 && prohibitedPageEnd.test(text[adjusted - 1])) {
        adjusted -= 1;
      }
      return Math.max(start + 1, adjusted);
    }

    function paginationTextSignature() {
      const sample = `${text.slice(0, 512)}\u0000${text.slice(Math.max(0, Math.floor(text.length / 2) - 256), Math.floor(text.length / 2) + 256)}\u0000${text.slice(-512)}`;
      let hash = 2166136261;
      for (let offset = 0; offset < sample.length; offset += 1) {
        hash ^= sample.charCodeAt(offset);
        hash = Math.imul(hash, 16777619);
      }
      return `${text.length}-${(hash >>> 0).toString(36)}`;
    }

    function paginationSignature(height) {
      return [
        paginationLayoutVersion,
        activeBookId,
        paginationTextSignature(),
        Math.round(pageText.clientWidth),
        Math.round(height),
        fontSlider.value,
        lineSlider.value
      ].join('|');
    }

    function pageFromBounds(start, end) {
      const rawPageText = text.slice(start, end);
      const leadingSpace = rawPageText.match(/^\s*/)?.[0].length || 0;
      const trailingSpace = rawPageText.match(/\s*$/)?.[0].length || 0;
      const displayStart = start + leadingSpace;
      const displayEnd = Math.max(displayStart, end - trailingSpace);
      return { start, end, displayStart, displayEnd, text:text.slice(displayStart, displayEnd) };
    }

    function readCachedPages(signature) {
      try {
        const cache = JSON.parse(localStorage.getItem(paginationCacheKey) || '{}');
        const bounds = cache?.entries?.[signature]?.bounds;
        if (!Array.isArray(bounds) || !bounds.length) return null;
        let previousEnd = -1;
        const restored = bounds.map(pair => {
          const start = Number(pair?.[0]);
          const end = Number(pair?.[1]);
          if (!Number.isInteger(start) || !Number.isInteger(end) || start < previousEnd || end <= start || end > text.length) {
            throw new Error('invalid-pagination-cache');
          }
          previousEnd = end;
          return pageFromBounds(start, end);
        });
        return restored;
      } catch (_) {
        return null;
      }
    }

      try {
        const cache = JSON.parse(localStorage.getItem(paginationCacheKey) || '{}');
        const entries = cache?.entries && typeof cache.entries === 'object' ? cache.entries : {};
        entries[signature] = {
