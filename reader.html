          bounds:nextPages.map(page => [page.start, page.end])
        };
        const recent = Object.entries(entries)
          .sort((left, right) => Number(right[1]?.savedAt || 0) - Number(left[1]?.savedAt || 0))
          .slice(0, 6);
        localStorage.setItem(paginationCacheKey, JSON.stringify({ entries:Object.fromEntries(recent) }));
      } catch (_) {}
    }

    function indexForAnchor(anchor, candidates = pages) {
      const found = candidates.findIndex((page, pageIndex) =>
        anchor >= page.start && (anchor < page.end || pageIndex === candidates.length - 1)
      );
      if (found >= 0) return found;
      for (let pageIndex = candidates.length - 1; pageIndex >= 0; pageIndex -= 1) {
        if (anchor >= candidates[pageIndex].start) return pageIndex;
      }
      return 0;
    }

    async function paginate(anchor = 0) {
      const availableHeight = pageText.clientHeight;
      if (!availableHeight || !pageText.clientWidth) return;
      const run = paginationRun += 1;
      const signature = paginationSignature(availableHeight);
      const cachedPages = readCachedPages(signature);
      if (cachedPages) {
        pages = cachedPages;
        paginationComplete = true;
        index = indexForAnchor(anchor);
        render();
        return;
      }
      paginationComplete = false;
      const nextPages = [];
      const pageBreakAnchors = [...new Set(tocEntries
        .map(entry => Number(entry.anchor))
        .filter(entryAnchor => Number.isFinite(entryAnchor) && entryAnchor > 0 && entryAnchor < text.length))]
        .sort((a, b) => a - b);
      let pageBreakIndex = 0;
      let start = 0;
      let renderedAnchor = false;
      let frameStartedAt = performance.now();
      while (start < text.length) {
        while (pageBreakAnchors[pageBreakIndex] <= start) pageBreakIndex += 1;
        const nextPageBreak = pageBreakAnchors[pageBreakIndex] || text.length;
        let low = start + 1;
        let high = Math.min(text.length, nextPageBreak, start + 6000);
        let best = low;
        while (low <= high) {
          const middle = Math.floor((low + high) / 2);
          if (fits(text.slice(start, middle), availableHeight)) {
            best = middle;
            low = middle + 1;
          } else {
            high = middle - 1;
          }
        }
        const end = adjustPageEnd(start, Math.max(start + 1, best), nextPageBreak);
        const page = pageFromBounds(start, end);
        nextPages.push(page);
        start = end;
        while (text[start] === '\n') start += 1;
        if (!renderedAnchor && anchor >= page.start && (anchor < start || start >= text.length)) {
          pages = nextPages;
          index = nextPages.length - 1;
          renderedAnchor = true;
          render(false);
        }
        if (performance.now() - frameStartedAt >= 8) {
          await new Promise(resolve => window.requestAnimationFrame(resolve));
          if (run !== paginationRun) return;
          frameStartedAt = performance.now();
        }
      }
      pages = nextPages;
      if (!renderedAnchor) index = indexForAnchor(anchor);
      paginationComplete = true;
      saveCachedPages(signature, pages);
      render();
    }

    function pageOrdinalForAnchor(anchor) {
      if (anchor === null || anchor === undefined || !pages.length) return null;
      const lookup = Number(anchor);
      const found = pages.findIndex((page, pageIndex) =>
        lookup >= page.start && (lookup < page.end || (paginationComplete && pageIndex === pages.length - 1))
      );
      return found >= 0 ? found + 1 : null;
    }

    function readingPercent(anchor, started = false) {
      if (anchor === null || anchor === undefined || !text.length) return 0;
      const percent = Math.max(0, Math.min(100, (Number(anchor) / text.length) * 100));
      return started ? Math.max(1.5, percent) : percent;
    }

    function persistReadingState() {
      readingState.textLength = text.length;
      readingState.updatedAt = Date.now();
      readingLineStates[activeBookId] = readingState;
      localStorage.setItem(readingLinesKey, JSON.stringify(readingLineStates));
      if (activeBook) {
        activeBook.progress = readingState.wish.current;
        activeBook.updatedAt = readingState.updatedAt;
        localStorage.setItem(booksKey, JSON.stringify(storedBooks));
      }
      SideleafSync.markDirty(localStorage, [readingLinesKey, booksKey]);
    }

    function renderReadingLines() {
      const wishCurrent = pageOrdinalForAnchor(readingState.wish.current);
      const total = paginationComplete ? pages.length : '…';
      wishLineStatus.textContent = `书签 ${wishCurrent || '…'}/${total}`;
      wishLineFill.style.width = `${readingPercent(readingState.wish.current, true)}%`;

      if (readingState.zheng.current === null) {
        zhengLineStatus.textContent = '还没开始';
        zhengLineFill.style.width = '0%';
      } else {
        const zhengCurrent = pageOrdinalForAnchor(readingState.zheng.current);
        const zhengFurthest = pageOrdinalForAnchor(readingState.zheng.furthest);
        zhengLineStatus.textContent = `书签 ${zhengCurrent || '…'}/${total} · 最远 ${zhengFurthest || '…'}/${total}`;
        zhengLineFill.style.width = `${readingPercent(readingState.zheng.furthest, true)}%`;
      }

      const page = pages[index];
      const zhengIsHere = page && readingState.zheng.current >= page.start && readingState.zheng.current < page.end;
      markZhengLine.textContent = zhengIsHere ? '峥的书签在本页' : '把峥的书签放在本页';
    }

    function isRangeNote(note) {
      return Number.isFinite(Number(note.rangeStart)) && Number.isFinite(Number(note.rangeEnd))
        && Number(note.rangeEnd) > Number(note.rangeStart);
    }

    function rangeNotesForPage(page) {
      if (!page) return [];
      return readNotes().filter(note =>
        note.bookId === activeBookId && isRangeNote(note)
        && Number(note.rangeStart) < page.displayEnd
        && Number(note.rangeEnd) > page.displayStart
      );
    }

    function renderPageContent(page) {
      const annotations = rangeNotesForPage(page);
      const zhengMarkerOffset = readingState.zheng.current > page.displayStart
        && readingState.zheng.current <= page.displayEnd
        ? Number(readingState.zheng.current)
        : null;
      const selection = activeSelectionHighlightVisible && activeSelection
        && activeSelection.start < page.displayEnd
        && activeSelection.end > page.displayStart
        ? activeSelection
        : null;
      if (!annotations.length && !selection && zhengMarkerOffset === null) {
        pageText.textContent = page.text;
        return;
      }
      const boundaries = new Set([page.displayStart, page.displayEnd]);
      if (zhengMarkerOffset !== null) boundaries.add(zhengMarkerOffset);
      annotations.forEach(note => {
        boundaries.add(Math.max(page.displayStart, Number(note.rangeStart)));
        boundaries.add(Math.min(page.displayEnd, Number(note.rangeEnd)));
      });
      if (selection) {
        boundaries.add(Math.max(page.displayStart, selection.start));
        boundaries.add(Math.min(page.displayEnd, selection.end));
      }
      const points = [...boundaries].sort((a, b) => a - b);
      const fragment = document.createDocumentFragment();
      for (let pointIndex = 0; pointIndex < points.length - 1; pointIndex += 1) {
        const from = points[pointIndex];
        const to = points[pointIndex + 1];
        if (to <= from) continue;
        const matchingNotes = annotations.filter(note =>
          Number(note.rangeStart) < to && Number(note.rangeEnd) > from
        );
        const selected = selection && selection.start < to && selection.end > from;
        const content = text.slice(from, to);
        if (!matchingNotes.length && !selected) {
          fragment.appendChild(document.createTextNode(content));
        } else {
          const mark = document.createElement('span');
          if (matchingNotes.length) {
            mark.classList.add('annotation-highlight');
            const authors = new Set(matchingNotes.map(note => normalizeNoteAuthor(note.author)));
            mark.classList.add(authors.size > 1 ? 'is-both' : authors.has('zheng') ? 'is-zheng' : 'is-wish');
            mark.dataset.noteIds = matchingNotes.map(note => note.id).join(',');
          }
          if (selected) mark.classList.add('active-selection-highlight');
          mark.textContent = content;
          fragment.appendChild(mark);
        }
        if (zhengMarkerOffset === to) {
          const marker = document.createElement('span');
          marker.className = 'zheng-read-marker';
          marker.setAttribute('role', 'img');
          marker.setAttribute('aria-label', '峥读到这里');
          marker.title = '峥读到这里';
          fragment.appendChild(marker);
        }
      }
      pageText.replaceChildren(fragment);
    }

    function render(shouldPersist = true) {
      const page = pages[index];
      if (!page) return;
      hideSelectionToolbar();
      renderPageContent(page);
      pageNumber.textContent = `${index + 1}/${paginationComplete ? pages.length : '…'}`;
      const currentChapter = tocEntries[resolveTocIndex(page)] || tocEntries[0];
      chapterName.textContent = currentChapter?.title || activeBook?.title || '雨停以后';
      readingState.wish.current = page.start;
      if (shouldPersist) persistReadingState();
      renderReadingLines();
      if (!notesSheet.hidden) renderNotes();
      updateTocCurrent();
    }

    function repaginate() {
      const anchor = pages[index]?.start || 0;
      window.requestAnimationFrame(() => { void paginate(anchor); });
    }

    function applyTypography() {
      const inset = `${Number(fontSlider.value) * 1.5}px`;
      pageText.style.setProperty('margin-left', inset, 'important');
      pageText.style.setProperty('margin-right', inset, 'important');
      measure.style.setProperty('left', inset, 'important');
      measure.style.setProperty('right', inset, 'important');
      const readingFont = '-apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", "Microsoft YaHei", sans-serif';
      pageText.style.setProperty('font-family', readingFont, 'important');
      measure.style.setProperty('font-family', readingFont, 'important');
      pageText.style.setProperty('font-weight', '370', 'important');
      measure.style.setProperty('font-weight', '370', 'important');
    }

    function saveSettings() {
      localStorage.setItem(settingsKey, JSON.stringify({
        fontSize: Number(fontSlider.value),
        lineHeight: Number(lineSlider.value)
      }));
      SideleafSync.markDirty(localStorage, [settingsKey]);
    }

    function normalizeNoteAuthor(author) {
      return author === 'zheng' ? 'zheng' : 'wish';
    }

    function noteAuthorLabel(author) {
      return normalizeNoteAuthor(author) === 'zheng' ? '峥' : '愿';
    }

    function setNoteAuthor(author) {
      composingNoteAuthor = normalizeNoteAuthor(author);
      noteCompose.dataset.author = composingNoteAuthor;
    }

    function resizeNoteInput() {
      noteInput.style.height = 'auto';
      const viewportHeight = window.visualViewport?.height || window.innerHeight;
      const maxHeight = Math.max(112, Math.min(220, viewportHeight * .28));
      const nextHeight = Math.max(112, Math.min(noteInput.scrollHeight, maxHeight));
      noteInput.style.height = `${nextHeight}px`;
      noteInput.style.overflowY = noteInput.scrollHeight > maxHeight ? 'auto' : 'hidden';
      if (!notesSheet.hidden) window.requestAnimationFrame(() => positionNotes());
    }

    function readNotes() {
      try {
        const notes = JSON.parse(localStorage.getItem(notesKey) || '[]');
        return Array.isArray(notes)
          ? notes.map(note => ({ ...note, author: normalizeNoteAuthor(note.author) }))
          : [];
      } catch (_) { return []; }
    }

    function readReadingRequests() {
      try {
        const requests = JSON.parse(localStorage.getItem(readingRequestsKey) || '[]');
        return Array.isArray(requests) ? requests : [];
      } catch (_) { return []; }
    }

    function notesOnPage() {
      const page = pages[index];
      if (!page) return [];
      return readNotes().filter(note =>
        note.bookId === activeBookId && (
          isRangeNote(note)
            ? Number(note.rangeStart) < page.displayEnd && Number(note.rangeEnd) > page.displayStart
            : note.anchor >= page.start && note.anchor < page.end
        )
      );
    }

    function formatNoteTime(timestamp) {
      const value = Number(timestamp);
      if (!Number.isFinite(value) || value <= 0) return '';
      const date = new Date(value);
      const pad = part => String(part).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function renderNotes() {
      const pageNotes = notesOnPage();
      const notes = (focusedNoteIds === null
        ? pageNotes
        : pageNotes.filter(note => focusedNoteIds.includes(note.id)))
        .sort((a, b) => Number(a.createdAt || a.updatedAt || 0) - Number(b.createdAt || b.updatedAt || 0));
      notesList.replaceChildren();
      if (!notes.length) {
        const empty = document.createElement('p');
        empty.className = 'notes-empty';
        empty.textContent = activeSelection ? '这句话旁边还没有人开口。' : '这里还没有对话。';
        notesList.appendChild(empty);
        if (!notesSheet.hidden) window.requestAnimationFrame(() => positionNotes());
        return;
      }
      notes.forEach(note => {
        const item = document.createElement('article');
        item.className = 'note-item';
        item.classList.add(note.author === 'zheng' ? 'is-zheng' : 'is-wish');
        const noteContent = document.createElement('div');
        noteContent.className = 'note-content';
        const noteTime = document.createElement('time');
        noteTime.className = 'note-time';
        const noteTimestamp = Number(note.createdAt || note.updatedAt || 0);
        if (Number.isFinite(noteTimestamp) && noteTimestamp > 0) {
          noteTime.dateTime = new Date(noteTimestamp).toISOString();
          noteTime.textContent = formatNoteTime(noteTimestamp);
        }
        const noteMeta = document.createElement('div');
        noteMeta.className = 'note-meta';
        noteMeta.hidden = !noteTime.textContent;
        noteMeta.append(noteTime);
        const noteText = document.createElement('p');
        noteText.className = 'note-text';
        noteText.textContent = note.text;
        noteContent.append(noteMeta, noteText);

        const more = document.createElement('button');
        more.className = 'note-more';
        more.type = 'button';
        more.textContent = '···';
        more.setAttribute('aria-label', '批注选项');

        const actions = document.createElement('div');
        actions.className = 'note-actions';
        actions.hidden = true;

        const edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = '编辑';

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'delete-note';
        remove.textContent = '删除';

        more.addEventListener('click', () => { actions.hidden = !actions.hidden; });
        edit.addEventListener('click', () => {
          editingNoteId = note.id;
          activeSelection = isRangeNote(note) ? {
            start: Number(note.rangeStart),
            end: Number(note.rangeEnd),
            quote: note.quote || text.slice(Number(note.rangeStart), Number(note.rangeEnd))
          } : null;
          noteCompose.hidden = false;
          saveNote.hidden = false;
          selectionQuote.hidden = !activeSelection;
          selectionQuote.textContent = activeSelection?.quote || '';
          noteInput.value = note.text;
          setNoteAuthor(note.author);
          saveNote.textContent = '保存修改';
          resizeNoteInput();
          noteInput.focus();
          actions.hidden = true;
        });
        remove.addEventListener('click', () => {
          if (remove.dataset.confirm !== 'true') {
            remove.dataset.confirm = 'true';
            remove.textContent = '确认删除';
            return;
          }
          const nextNotes = readNotes().filter(item => item.id !== note.id);
          localStorage.setItem(notesKey, JSON.stringify(nextNotes));
          SideleafSync.markDirty(localStorage, [notesKey]);
          SideleafSync.queueDeletion(localStorage, { entity:'annotation-message', id:note.id });
          if (focusedNoteIds) focusedNoteIds = focusedNoteIds.filter(id => id !== note.id);
          if (editingNoteId === note.id) {
            editingNoteId = null;
            noteInput.value = '';
            setNoteAuthor('wish');
            saveNote.textContent = '发送';
          }
          renderPageContent(pages[index]);
          renderNotes();
        });

        actions.append(edit, remove);
        item.append(noteContent);
        if (normalizeNoteAuthor(note.author) === 'wish') item.append(more, actions);
        notesList.appendChild(item);
      });
      if (!notesSheet.hidden) window.requestAnimationFrame(() => positionNotes());
    }

    function rememberRect(rect) {
      if (!rect) return null;
      return {
        left: rect.left,
        right: rect.right,
        top: rect.top,
        bottom: rect.bottom,
        width: rect.width,
        height: rect.height
      };
    }

    function positionNotes(rect = notesAnchorRect) {
      if (!rect || notesSheet.hidden) return;
      const viewport = window.visualViewport;
      const viewportLeft = viewport?.offsetLeft || 0;
      const viewportTop = viewport?.offsetTop || 0;
      const viewportWidth = viewport?.width || window.innerWidth;
      const viewportHeight = viewport?.height || window.innerHeight;
      const margin = 14;
      const gap = 10;
      notesSheet.style.maxHeight = `${Math.max(180, Math.min(500, viewportHeight - margin * 2))}px`;
      const panelWidth = notesSheet.offsetWidth;
      const panelHeight = notesSheet.offsetHeight;
      const center = rect.left + rect.width / 2;
      const left = Math.max(
        viewportLeft + margin,
        Math.min(viewportLeft + viewportWidth - panelWidth - margin, center - panelWidth / 2)
      );
      const below = rect.bottom + gap;
      const above = rect.top - panelHeight - gap;
      const preferredTop = below + panelHeight <= viewportTop + viewportHeight - margin
        ? below
        : above;
      const minTop = Math.max(0, viewportTop) + margin;
      const maxTop = Math.max(minTop, Math.max(0, viewportTop) + viewportHeight - panelHeight - margin);
      const top = Math.max(minTop, Math.min(maxTop, preferredTop));
      notesSheet.style.left = `${left}px`;
      notesSheet.style.top = `${top}px`;
    }

    function stabilizeNotesForKeyboard() {
      if (notesSheet.hidden) return;
      window.requestAnimationFrame(() => {
        positionNotes();
        window.requestAnimationFrame(() => positionNotes());
      });
    }

    function showNotes(anchorRect = activeSelection?.anchorRect) {
      notesAnchorRect = rememberRect(anchorRect) || notesAnchorRect;
      selectionQuote.hidden = !activeSelection;
      selectionQuote.textContent = activeSelection?.quote || '';
      renderNotes();
      notesSheet.hidden = false;
      notesSheet.setAttribute('aria-hidden', 'false');
      closeLightPopovers();
      window.requestAnimationFrame(() => positionNotes());
    }

    function hideNotes() {
      notesSheet.hidden = true;
      notesSheet.setAttribute('aria-hidden', 'true');
      noteInput.blur();
      editingNoteId = null;
      noteInput.value = '';
      noteInput.style.height = '';
      setNoteAuthor('wish');
      saveNote.textContent = '发送';
      noteCompose.hidden = true;
      saveNote.hidden = true;
      selectionQuote.hidden = true;
      activeSelection = null;
      activeSelectionHighlightVisible = false;
      hideSelectionHandles();
      focusedNoteIds = null;
      notesAnchorRect = null;
      const page = pages[index];
      if (page) renderPageContent(page);
    }

    function hideSelectionToolbar() {
      selectionToolbar.hidden = true;
    }

    function hideSelectionHandles() {
      selectionHandles.hidden = true;
      selectionHandles.classList.remove('is-dragging');
      selectionHandleStart.classList.remove('is-dragging');
      selectionHandleEnd.classList.remove('is-dragging');
      draggingSelectionEdge = null;
    }

    function clearLongPress() {
      window.clearTimeout(longPressTimer);
      longPressTimer = null;
    }

    function pageAnchorFromPoint(clientX, clientY) {
      let node = null;
      let offset = 0;
      if (document.caretPositionFromPoint) {
        const caret = document.caretPositionFromPoint(clientX, clientY);
        node = caret?.offsetNode || null;
        offset = caret?.offset || 0;
      } else if (document.caretRangeFromPoint) {
        const caret = document.caretRangeFromPoint(clientX, clientY);
        node = caret?.startContainer || null;
        offset = caret?.startOffset || 0;
      }
      if (!node || !pageText.contains(node)) return null;
      const probe = document.createRange();
      probe.selectNodeContents(pageText);
      probe.setEnd(node, offset);
      const page = pages[index];
      return page ? page.displayStart + probe.toString().length : null;
    }

    function sentenceAt(anchor) {
      const stop = character => /[。！？!?；;\n]/.test(character || '');
      const closers = /[”’」』）》】]/;
      let start = Math.max(0, Math.min(text.length - 1, anchor));
      let end = start;
      while (start > 0 && !stop(text[start - 1])) start -= 1;
      while (start < text.length && /\s/.test(text[start])) start += 1;
      while (end < text.length && !stop(text[end])) end += 1;
      if (end < text.length) end += 1;
      while (end < text.length && closers.test(text[end])) end += 1;
      while (end > start && /\s/.test(text[end - 1])) end -= 1;
      return end > start ? { start, end } : null;
    }

    function positionSelectionToolbar(rect) {
      if (!rect) return;
      syncLikeSelectionButton();
      selectionToolbar.hidden = false;
      const halfWidth = Math.max(46, selectionToolbar.offsetWidth / 2);
      selectionToolbar.style.left = `${Math.max(halfWidth + 8, Math.min(window.innerWidth - halfWidth - 8, rect.left + rect.width / 2))}px`;
      selectionToolbar.style.top = `${Math.max(66, rect.top - 8)}px`;
    }

    function readLikes() {
      try {
        const likes = JSON.parse(localStorage.getItem(likesKey) || '[]');
        return Array.isArray(likes) ? likes : [];
      } catch (_) {
        return [];
      }
    }

    function activeLikeIndex(likes = readLikes()) {
      if (!activeSelection) return -1;
      return likes.findIndex(like =>
        like.bookId === activeBookId
        && Number(like.rangeStart) === activeSelection.start
        && Number(like.rangeEnd) === activeSelection.end
      );
    }

    function syncLikeSelectionButton() {
      const liked = activeLikeIndex() >= 0;
      likeSelection.textContent = liked ? '♥' : '♡';
      likeSelection.classList.toggle('is-liked', liked);
      likeSelection.setAttribute('aria-pressed', String(liked));
      likeSelection.setAttribute('aria-label', liked ? '取消喜欢这句话' : '喜欢这句话');
    }

    function toggleSelectionLike() {
      if (!activeSelection) return;
      const likes = readLikes();
      const index = activeLikeIndex(likes);
      if (index >= 0) {
        likes.splice(index, 1);
      } else {
        const now = Date.now();
        likes.push({
          id: window.crypto?.randomUUID?.() || `${now}-${Math.random().toString(16).slice(2)}`,
          bookId: activeBookId,
          rangeStart: activeSelection.start,
          rangeEnd: activeSelection.end,
          quote: activeSelection.quote,
          prefix: activeSelection.prefix,
          suffix: activeSelection.suffix,
          createdAt: now,
          updatedAt: now
        });
      }
      localStorage.setItem(likesKey, JSON.stringify(likes));
      SideleafSync.markDirty(localStorage, [likesKey]);
      syncLikeSelectionButton();
      likeSelection.classList.remove('did-toggle');
      void likeSelection.offsetWidth;
      likeSelection.classList.add('did-toggle');
    }

    function selectionRects() {
      return [...pageText.querySelectorAll('.active-selection-highlight')]
        .flatMap(highlight => [...highlight.getClientRects()])
        .filter(rect => rect.width > 0 && rect.height > 0);
    }

    function positionSelectionHandles(rects = selectionRects()) {
      if (!rects.length || !activeSelection) {
        hideSelectionHandles();
        return;
      }
      const first = rects[0];
      const last = rects[rects.length - 1];
      selectionHandleStart.style.left = `${first.left}px`;
      selectionHandleStart.style.top = `${first.top - 12}px`;
      selectionHandleStart.style.setProperty('--selection-line-height', `${first.height}px`);
      selectionHandleEnd.style.left = `${last.right}px`;
      selectionHandleEnd.style.top = `${last.top}px`;
      selectionHandleEnd.style.setProperty('--selection-line-height', `${last.height}px`);
      selectionHandles.hidden = false;
    }

    function updateActiveSelection(start, end) {
      if (!activeSelection || end <= start) return false;
      activeSelectionHighlightVisible = true;
      activeSelection.start = start;
      activeSelection.end = end;
      activeSelection.quote = text.slice(start, end);
      activeSelection.prefix = text.slice(Math.max(0, start - 60), start);
      activeSelection.suffix = text.slice(end, Math.min(text.length, end + 60));
      renderPageContent(pages[index]);
      const rects = selectionRects();
      if (!rects.length) return false;
      const last = rects[rects.length - 1];
      activeSelection.anchorRect = rememberRect(last);
      positionSelectionHandles(rects);
      if (!draggingSelectionEdge) positionSelectionToolbar(last);
      return true;
    }

    function selectSentenceAt(clientX, clientY) {
      const anchor = pageAnchorFromPoint(clientX, clientY);
      if (anchor === null) return false;
      const sentence = sentenceAt(anchor);
      if (!sentence) return false;
      activeSelection = {
        ...sentence,
        quote: text.slice(sentence.start, sentence.end),
        prefix: text.slice(Math.max(0, sentence.start - 60), sentence.start),
        suffix: text.slice(sentence.end, Math.min(text.length, sentence.end + 60))
      };
      activeSelectionHighlightVisible = true;
      focusedNoteIds = null;
      renderPageContent(pages[index]);
      window.requestAnimationFrame(() => {
        const rects = selectionRects();
        if (!rects.length) return;
        const rect = rects[rects.length - 1];
        activeSelection.anchorRect = rememberRect(rect);
        positionSelectionHandles(rects);
        positionSelectionToolbar(rect);
      });
      return true;
    }

    function startSelectionDrag(event) {
      if (!activeSelection) return;
      event.preventDefault();
      event.stopPropagation();
      draggingSelectionEdge = event.currentTarget.dataset.selectionEdge;
      selectionHandles.classList.add('is-dragging');
      event.currentTarget.classList.add('is-dragging');
      hideSelectionToolbar();
      try { event.currentTarget.setPointerCapture(event.pointerId); } catch (_) {}
    }

    function moveSelectionDrag(event) {
      if (!draggingSelectionEdge || !activeSelection) return;
      event.preventDefault();
      const clientX = event.clientX;
      const clientY = event.clientY;
      const handle = event.currentTarget;
      window.cancelAnimationFrame(selectionDragFrame);
      selectionDragFrame = window.requestAnimationFrame(() => {
        const page = pages[index];
        handle.style.pointerEvents = 'none';
        const anchor = pageAnchorFromPoint(clientX, clientY);
        handle.style.pointerEvents = '';
        if (!page || anchor === null) return;
        if (draggingSelectionEdge === 'start') {
          const start = Math.max(page.displayStart, Math.min(anchor, activeSelection.end - 1));
          updateActiveSelection(start, activeSelection.end);
        } else {
          const end = Math.min(page.displayEnd, Math.max(anchor, activeSelection.start + 1));
          updateActiveSelection(activeSelection.start, end);
        }
      });
    }

    function endSelectionDrag(event) {
      if (!draggingSelectionEdge) return;
      event.preventDefault();
      event.stopPropagation();
      window.cancelAnimationFrame(selectionDragFrame);
      const page = pages[index];
      event.currentTarget.style.pointerEvents = 'none';
      const anchor = pageAnchorFromPoint(event.clientX, event.clientY);
      event.currentTarget.style.pointerEvents = '';
      if (page && anchor !== null && activeSelection) {
        if (draggingSelectionEdge === 'start') {
          updateActiveSelection(
            Math.max(page.displayStart, Math.min(anchor, activeSelection.end - 1)),
            activeSelection.end
          );
        } else {
          updateActiveSelection(
            activeSelection.start,
            Math.min(page.displayEnd, Math.max(anchor, activeSelection.start + 1))
          );
        }
      }
      draggingSelectionEdge = null;
      selectionHandles.classList.remove('is-dragging');
      selectionHandleStart.classList.remove('is-dragging');
      selectionHandleEnd.classList.remove('is-dragging');
      const rects = selectionRects();
      const last = rects[rects.length - 1];
      if (last) {
        activeSelection.anchorRect = rememberRect(last);
        positionSelectionHandles(rects);
        positionSelectionToolbar(last);
      }
    }

    function selectionOffsets(range) {
      const startRange = document.createRange();
      startRange.selectNodeContents(pageText);
      startRange.setEnd(range.startContainer, range.startOffset);
      const endRange = document.createRange();
      endRange.selectNodeContents(pageText);
      endRange.setEnd(range.endContainer, range.endOffset);
      return {
        start: startRange.toString().length,
        end: endRange.toString().length
      };
    }

    function updateSelectionToolbar() {
      const selection = window.getSelection();
      if (!selection || selection.isCollapsed || !selection.rangeCount) {
        hideSelectionToolbar();
        return;
      }
      const range = selection.getRangeAt(0);
      const startElement = range.startContainer.nodeType === Node.ELEMENT_NODE
        ? range.startContainer
        : range.startContainer.parentElement;
      const endElement = range.endContainer.nodeType === Node.ELEMENT_NODE
        ? range.endContainer
        : range.endContainer.parentElement;
      if (!startElement || !endElement || !pageText.contains(startElement) || !pageText.contains(endElement)) {
        hideSelectionToolbar();
        return;
      }
      const page = pages[index];
      if (!page) return;
      const offsets = selectionOffsets(range);
      const rangeStart = page.displayStart + Math.min(offsets.start, offsets.end);
      const rangeEnd = page.displayStart + Math.max(offsets.start, offsets.end);
      const quote = text.slice(rangeStart, rangeEnd).trim();
      if (!quote) {
        hideSelectionToolbar();
        return;
      }
      const leadingTrim = text.slice(rangeStart, rangeEnd).indexOf(quote);
      const start = rangeStart + Math.max(0, leadingTrim);
      const end = start + quote.length;
      activeSelection = {
        start,
        end,
        quote,
        prefix: text.slice(Math.max(0, start - 60), start),
        suffix: text.slice(end, Math.min(text.length, end + 60))
      };
      activeSelectionHighlightVisible = true;
      const rangeRects = Array.from(range.getClientRects());
      const rect = rangeRects[rangeRects.length - 1] || range.getBoundingClientRect();
      activeSelection.anchorRect = rememberRect(rect);
      positionSelectionToolbar(rect);
    }

    function composeForSelection() {
      if (!activeSelection) return;
      activeSelectionHighlightVisible = true;
      focusedNoteIds = [];
      editingNoteId = null;
      noteInput.value = '';
      setNoteAuthor('wish');
      saveNote.textContent = '发送';
      noteCompose.hidden = false;
      saveNote.hidden = false;
      hideSelectionToolbar();
      hideSelectionHandles();
      window.getSelection()?.removeAllRanges();
      renderPageContent(pages[index]);
      showNotes(activeSelection.anchorRect);
      window.requestAnimationFrame(resizeNoteInput);
      window.setTimeout(() => noteInput.focus(), 80);
    }

    function showHighlightedNotes(noteIds, anchorRect) {
      const notes = readNotes().filter(note => noteIds.includes(note.id));
      if (!notes.length) return;
      const first = notes[0];
      activeSelection = isRangeNote(first) ? {
        start: Number(first.rangeStart),
        end: Number(first.rangeEnd),
        quote: first.quote || text.slice(Number(first.rangeStart), Number(first.rangeEnd)),
        prefix: first.prefix || text.slice(Math.max(0, Number(first.rangeStart) - 60), Number(first.rangeStart)),
        suffix: first.suffix || text.slice(Number(first.rangeEnd), Math.min(text.length, Number(first.rangeEnd) + 60))
      } : null;
      activeSelectionHighlightVisible = false;
      focusedNoteIds = noteIds;
      editingNoteId = null;
      noteInput.value = '';
      setNoteAuthor('wish');
      saveNote.textContent = '发送';
      noteCompose.hidden = false;
      saveNote.hidden = false;
      renderPageContent(pages[index]);
      showNotes(anchorRect);
      window.requestAnimationFrame(resizeNoteInput);
    }

    function readChapterJournals() {
      try {
        const journals = JSON.parse(localStorage.getItem(chapterJournalsKey) || '[]');
        return Array.isArray(journals) ? journals : [];
      } catch (_) { return []; }
    }

    function chapterUnitForTocIndex(tocIndex) {
      const safeIndex = Math.max(0, Math.min(tocEntries.length - 1, tocIndex));
      const ancestors = [];
      let expectedLevel = tocEntries[safeIndex]?.level || 1;
      for (let entryIndex = safeIndex; entryIndex >= 0 && expectedLevel > 0; entryIndex -= 1) {
        const item = tocEntries[entryIndex];
        if (item.level === expectedLevel) {
          ancestors.unshift(entryIndex);
          expectedLevel -= 1;
        }
      }
      const explicitChapter = [...ancestors].reverse().find(entryIndex =>
        /^(?:第.{1,12}[章回]|chapter\s*[\divxlcdm-]*)/i.test(tocEntries[entryIndex].title.trim())
      );
      const topEntry = tocEntries[ancestors[0]];
      const topIsContainer = topEntry && /^(?:第.{1,12}[卷部篇]|part\s*[\divxlcdm-]*|volume\s*[\divxlcdm-]*)/i.test(topEntry.title.trim());
      const chapterIndex = explicitChapter ?? (topIsContainer && ancestors.length > 1 ? ancestors[1] : ancestors[0]) ?? safeIndex;
      const entry = tocEntries[chapterIndex];
      if (!entry) return null;
      let end = text.length;
      for (let nextIndex = chapterIndex + 1; nextIndex < tocEntries.length; nextIndex += 1) {
        const next = tocEntries[nextIndex];
        if (next.level <= entry.level) {
          end = next.anchor;
          break;
        }
      }
      const path = [];
      for (let entryIndex = 0; entryIndex <= chapterIndex; entryIndex += 1) {
        const item = tocEntries[entryIndex];
        path[item.level - 1] = item.title;
        path.length = item.level;
      }
      return {
        key: `${entry.level}:${entry.anchor}:${entry.title}`,
        tocIndex: chapterIndex,
        title: entry.title,
        path: path.filter(Boolean),
        level: entry.level,
        anchor: entry.anchor,
        end
      };
    }

    function currentChapterUnit() {
      return chapterUnitForTocIndex(resolveTocIndex(pages[index]));
    }

    function chapterJournalForUnit(unit, journals = readChapterJournals()) {
      if (!unit) return null;
      const exact = journals.find(journal =>
        journal.bookId === activeBookId && journal.chapterKey === unit.key
      );
      if (exact) return exact;
      const legacy = journals.filter(journal =>
        journal.bookId === activeBookId
        && Number(journal.chapterAnchor) >= unit.anchor
        && Number(journal.chapterAnchor) < unit.end
      );
      return legacy.length === 1 ? legacy[0] : null;
    }

    function chapterJournalStateText() {
      const value = chapterJournalInput.value.trim();
      if (!value) return '尚未留下札记';
      if (value !== activeJournalOriginal) return '有尚未保存的修改';
      const saved = chapterJournalForUnit(activeJournalUnit);
      return saved ? '札记已保存' : '尚未留下札记';
    }

    function syncChapterJournalControls() {
      const value = chapterJournalInput.value.trim();
      chapterJournalCount.textContent = `${[...value].length} 字`;
      chapterJournalStatus.textContent = chapterJournalStateText();
      saveChapterJournal.disabled = !value || value === activeJournalOriginal;
      copyChapterJournal.disabled = !value;
    }

    function openCurrentChapterJournal() {
      const unit = currentChapterUnit();
      if (!unit) return;
      const saved = chapterJournalForUnit(unit);
      activeJournalUnit = unit;
      activeJournalOriginal = saved?.text || '';
      chapterJournalTitle.textContent = unit.path.join(' · ');
      chapterJournalInput.value = activeJournalOriginal;
      chapterJournal.hidden = false;
      chapterJournal.setAttribute('aria-hidden', 'false');
      closeLightPopovers();
      closeToc();
      if (!notesSheet.hidden) hideNotes();
      syncChapterJournalControls();
    }

    function closeCurrentChapterJournal() {
      chapterJournal.hidden = true;
      chapterJournal.setAttribute('aria-hidden', 'true');
      chapterJournalInput.blur();
      activeJournalUnit = null;
      activeJournalOriginal = '';
    }

    function saveCurrentChapterJournal() {
      const value = chapterJournalInput.value.trim();
      if (!activeJournalUnit || !value) return;
      const journals = readChapterJournals();
      const existing = chapterJournalForUnit(activeJournalUnit, journals);
      if (existing) {
        existing.text = value;
        existing.chapterKey = activeJournalUnit.key;
        existing.chapterTitle = activeJournalUnit.title;
        existing.chapterPath = activeJournalUnit.path;
        existing.chapterLevel = activeJournalUnit.level;
        existing.chapterAnchor = activeJournalUnit.anchor;
        existing.chapterEnd = activeJournalUnit.end;
        existing.updatedAt = Date.now();
      } else {
        journals.push({
          id: window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          bookId: activeBookId,
          bookTitle: activeBook?.title || '雨停以后',
          chapterKey: activeJournalUnit.key,
          chapterTitle: activeJournalUnit.title,
          chapterPath: activeJournalUnit.path,
          chapterLevel: activeJournalUnit.level,
          chapterAnchor: activeJournalUnit.anchor,
          chapterEnd: activeJournalUnit.end,
          text: value,
          createdAt: Date.now(),
          updatedAt: Date.now()
        });
      }
      localStorage.setItem(chapterJournalsKey, JSON.stringify(journals));
      SideleafSync.markDirty(localStorage, [chapterJournalsKey]);
      activeJournalOriginal = value;
      chapterJournalInput.value = value;
      syncChapterJournalControls();
      renderToc();
    }

    async function copyCurrentChapterJournal() {
      const value = chapterJournalInput.value.trim();
      if (!activeJournalUnit || !value) return;
      const packet = [
        '【Sideleaf｜峥的章节札记】',
        `书名：${activeBook?.title || '雨停以后'}`,
        `章节：${activeJournalUnit.path.join(' · ')}`,
        '',
        '以下是峥此前为这一章节留下的完整札记，请原样阅读，不要先替它压成一层短摘要。',
        '',
        value
      ].join('\n');
      try {
        await navigator.clipboard.writeText(packet);
        chapterJournalStatus.textContent = '已复制，去找峥';
      } catch (_) {
        chapterJournalStatus.textContent = '复制失败，再点一次';
      }
      window.setTimeout(() => {
        if (!chapterJournal.hidden) syncChapterJournalControls();
      }, 1800);
    }

    async function copyContext() {
      const page = pages[index];
      if (!page) return;
      const from = Math.max(0, page.start - 2000);
      const to = page.end;
      const zhengPage = pageOrdinalForAnchor(readingState.zheng.current);
      const relatedNotes = readNotes().filter(note =>
        note.bookId === activeBookId && (
          isRangeNote(note)
            ? Number(note.rangeStart) < to && Number(note.rangeEnd) > from
            : note.anchor >= from && note.anchor < to
        )
      );
      const noteBlock = relatedNotes.length
        ? relatedNotes.map((note, i) => {
            const quote = isRangeNote(note) ? `「${note.quote || text.slice(note.rangeStart, note.rangeEnd)}」` : '（旧页边批注）';
            return `${i + 1}. ${noteAuthorLabel(note.author)}｜${quote}：${note.text}`;
          }).join('\n')
        : '无';
      const packet = [
        '【Sideleaf｜回望】',
        `书名：${activeBook?.title || '雨停以后'}`,
        `章节：${chapterName.textContent}`,
        `愿所在页：${index + 1}/${pages.length}`,
        `峥的阅读线：${zhengPage ? `${zhengPage}/${pages.length}` : '尚未开始'}`,
        '',
        '以下内容由当前页全文及当前页之前约 2000 字组成，只用于帮峥找回走到这里以前的阅读现场。',
        '这不是正式阅读请求；不要据此把后文视为已读，也不要移动峥的阅读线。',
        '',
        text.slice(from, to),
        '',
        '【相关批注】',
        noteBlock
      ].join('\n');
      try {
        await navigator.clipboard.writeText(packet);
        sendContext.textContent = '前文已整理';
      } catch (_) {
        sendContext.textContent = '复制失败，再点一次';
      }
      window.setTimeout(() => { sendContext.textContent = '回望'; }, 1800);
    }

    async function requestCurrentPageReading() {
      const page = pages[index];
      if (!page) return;
      const readingRange = SideleafLibrary.expandReadingRange(text, page.displayStart, page.displayEnd);
      const from = readingRange.start;
      const to = readingRange.end;
      const now = Date.now();
      const requests = readReadingRequests();
      const existing = requests.find(request =>
        request.bookId === activeBookId
        && request.rangeStart === from
        && request.rangeEnd === to
        && request.status === 'pending'
      );
      const unit = currentChapterUnit();
      const request = existing || {
        id: window.crypto?.randomUUID?.() || `${now}-${Math.random().toString(16).slice(2)}`,
        bookId: activeBookId,
        createdAt: now
      };
      Object.assign(request, {
        bookTitle: activeBook?.title || '雨停以后',
        chapterTitle: unit?.title || chapterName.textContent,
        chapterPath: unit?.path || [chapterName.textContent],
        rangeStart: from,
        rangeEnd: to,
        pageNumber: index + 1,
        totalPages: pages.length,
        status: 'pending',
        requestedAt: now
      });
      if (!existing) requests.push(request);
      localStorage.setItem(readingRequestsKey, JSON.stringify(requests.slice(-100)));
      SideleafSync.markDirty(localStorage, [readingRequestsKey]);
      await SideleafSync.syncNow(localStorage);

      const relatedNotes = readNotes().filter(note =>
        note.bookId === activeBookId && (
          isRangeNote(note)
            ? Number(note.rangeStart) < to && Number(note.rangeEnd) > from
            : note.anchor >= from && note.anchor < to
        )
      );
      const noteBlock = relatedNotes.length
        ? relatedNotes.map((note, i) => {
            const quote = isRangeNote(note) ? `「${note.quote || text.slice(note.rangeStart, note.rangeEnd)}」` : '（旧页边批注）';
            return `${i + 1}. ${noteAuthorLabel(note.author)}｜${quote}：${note.text}`;
          }).join('\n')
        : '无';
      const packet = [
        '【Sideleaf｜峥来读】',
        `书名：${request.bookTitle}`,
        `章节：${request.chapterPath.join(' · ')}`,
        `页码：${request.pageNumber}/${request.totalPages}`,
        `阅读请求：${request.id}`,
        '',
        '以下是愿明确请峥正式阅读的当前页内容，并已补齐到完整段落；超长段落按完整句补齐。请实际读完后，再更新峥的阅读线或留下批注。',
        '这条请求本身不代表峥已经读过，也不会自动移动峥的阅读线。',
        '',
        '【正文】',
        text.slice(from, to),
        '',
        '【本页原句对话】',
        noteBlock
      ].join('\n');
      try {
        await navigator.clipboard.writeText(packet);
        requestZhengRead.textContent = existing ? '已再叫峥' : '已叫峥';
      } catch (_) {
        requestZhengRead.textContent = '已登记';
      }
      window.setTimeout(() => { requestZhengRead.textContent = '峥来读'; }, 1800);
    }

    function syncZhengActivity() {
      return SideleafSync.syncNow(localStorage);
    }

    function turn(delta) {
      const next = index + delta;
      if (next < 0 || next >= pages.length) return;
      if (!chapterJournal.hidden) closeCurrentChapterJournal();
      hideNotes();
      index = next;
      render();
      void syncZhengActivity();
    }

    function resolveTocIndex(page) {
      if (!page) return 0;
      let currentIndex = 0;
      tocEntries.forEach((entry, entryIndex) => {
        if (entry.anchor < page.end) currentIndex = entryIndex;
      });
      return currentIndex;
    }

    function updateTocCurrent() {
      const currentIndex = resolveTocIndex(pages[index]);
      tocList.querySelectorAll('.toc-entry').forEach((button, buttonIndex) => {
        button.classList.toggle('is-current', buttonIndex === currentIndex);
      });
    }

    function renderToc() {
      tocList.replaceChildren();
      const journals = readChapterJournals();
      tocEntries.forEach((entry, entryIndex) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `toc-entry level-${entry.level}`;
        const title = document.createElement('span');
        title.className = 'toc-entry-title';
        title.textContent = entry.title;
        button.appendChild(title);
        const unit = chapterUnitForTocIndex(entryIndex);
        if (entryIndex === unit?.tocIndex && chapterJournalForUnit(unit, journals)) {
          const mark = document.createElement('i');
          mark.className = 'toc-journal-mark';
          mark.setAttribute('aria-label', '已有章节札记');
          button.appendChild(mark);
        }
        button.addEventListener('click', () => {
          const targetIndex = pages.findIndex((page, pageIndex) =>
            entry.anchor >= page.start && (entry.anchor < page.end || (paginationComplete && pageIndex === pages.length - 1))
          );
          if (targetIndex >= 0) {
            index = targetIndex;
            render();
            void syncZhengActivity();
          }
          closeToc();
        });
        tocList.appendChild(button);
      });
      updateTocCurrent();
    }

    function lightPopoverFor(trigger) {
      const panelId = trigger?.getAttribute('aria-controls');
      return panelId ? document.getElementById(panelId) : null;
    }

    function setLightPopover(trigger, open) {
      const panel = lightPopoverFor(trigger);
      if (!panel) return;
      panel.hidden = !open;
      panel.classList.toggle('is-open', open);
      trigger.setAttribute('aria-expanded', String(open));
    }

    function closeLightPopovers(exceptTrigger = null) {
      root.querySelectorAll('[data-light-popover-trigger][aria-expanded="true"]').forEach(trigger => {
        if (trigger !== exceptTrigger) setLightPopover(trigger, false);
      });
    }

    function toggleLightPopover(trigger) {
      const open = trigger.getAttribute('aria-expanded') !== 'true';
      closeLightPopovers(trigger);
      setLightPopover(trigger, open);
    }

    function openToc() {
      if (!chapterJournal.hidden) closeCurrentChapterJournal();
      renderToc();
      root.classList.add('toc-open');
      tocDrawer.setAttribute('aria-hidden', 'false');
      closeLightPopovers();
    }

    function closeToc() {
      root.classList.remove('toc-open');
      tocDrawer.setAttribute('aria-hidden', 'true');
    }

    root.addEventListener('click', event => {
      const trigger = event.target.closest('[data-light-popover-trigger]');
      if (!trigger || !root.contains(trigger)) return;
      event.stopPropagation();
      toggleLightPopover(trigger);
    }, true);

    annotateSelection.addEventListener('pointerdown', event => {
      event.preventDefault();
      event.stopPropagation();
      composeForSelection();
    });
    annotateSelection.addEventListener('click', event => {
      if (event.detail === 0) composeForSelection();
    });
    likeSelection.addEventListener('pointerdown', event => {
      event.preventDefault();
      event.stopPropagation();
      toggleSelectionLike();
    });
    likeSelection.addEventListener('click', event => {
      if (event.detail === 0) toggleSelectionLike();
    });
    [selectionHandleStart, selectionHandleEnd].forEach(handle => {
      handle.addEventListener('pointerdown', startSelectionDrag);
      handle.addEventListener('pointermove', moveSelectionDrag);
      handle.addEventListener('pointerup', endSelectionDrag);
      handle.addEventListener('pointercancel', endSelectionDrag);
    });
    sendContext.addEventListener('click', copyContext);
    requestZhengRead.addEventListener('click', requestCurrentPageReading);
    openChapterJournal.addEventListener('click', openCurrentChapterJournal);
    closeChapterJournal.addEventListener('click', closeCurrentChapterJournal);
    chapterJournalInput.addEventListener('input', syncChapterJournalControls);
    saveChapterJournal.addEventListener('click', saveCurrentChapterJournal);
    copyChapterJournal.addEventListener('click', copyCurrentChapterJournal);
    noteInput.addEventListener('input', resizeNoteInput);
    markZhengLine.addEventListener('click', () => {
      const page = pages[index];
      if (!page) return;
      readingState.zheng.current = page.start;
      readingState.zheng.furthest = Math.max(readingState.zheng.furthest ?? 0, page.start);
      persistReadingState();
      renderReadingLines();
    });
    tocBackdrop.addEventListener('click', closeToc);
    tocDrawer.addEventListener('pointerdown', event => { drawerStartX = event.clientX; });
    tocDrawer.addEventListener('pointerup', event => {
      if (event.clientX - drawerStartX < -52) closeToc();
    });
    pageNumber.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') pageNumber.click();
    });

    document.addEventListener('pointerdown', event => {
      let dismissed = false;
      const annotationTarget = event.target.closest('.annotation-highlight');
      const customSelectionTarget = event.target.closest('.active-selection-highlight');
      const selectionHandleTarget = event.target.closest('.selection-handle');
      if (!chapterJournal.hidden && !chapterJournal.contains(event.target) && !openChapterJournal.contains(event.target)) {
        closeCurrentChapterJournal();
        dismissed = true;
      }
      if (!notesSheet.hidden && !notesSheet.contains(event.target) && !annotationTarget && !selectionToolbar.contains(event.target)) {
        hideNotes();
        dismissed = true;
      }
      if (!activeSelection || !notesSheet.hidden || selectionToolbar.contains(event.target) || selectionHandleTarget || customSelectionTarget || annotationTarget) {
        // Keep the current sentence selected while interacting with its own controls.
      } else {
        activeSelection = null;
        activeSelectionHighlightVisible = false;
        hideSelectionToolbar();
        hideSelectionHandles();
        renderPageContent(pages[index]);
        dismissed = true;
      }
      root.querySelectorAll('[data-light-popover-trigger][aria-expanded="true"]').forEach(trigger => {
        const panel = lightPopoverFor(trigger);
        if (!panel || panel.contains(event.target) || trigger.contains(event.target)) return;
        setLightPopover(trigger, false);
        dismissed = true;
      });
      dismissedOverlayByPointer = dismissed && sheet.contains(event.target);
    }, true);
    saveNote.addEventListener('click', () => {
      const value = noteInput.value.trim();
      const page = pages[index];
      if (!value || !page || (!editingNoteId && !activeSelection)) return;
      const notes = readNotes();
      if (editingNoteId) {
        const target = notes.find(note => note.id === editingNoteId);
        if (target) {
          target.text = value;
          target.author = composingNoteAuthor;
          target.updatedAt = Date.now();
        }
      } else {
        notes.push({
          id: window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          bookId: activeBookId,
          anchor: activeSelection.start,
          rangeStart: activeSelection.start,
          rangeEnd: activeSelection.end,
          quote: activeSelection.quote,
          prefix: activeSelection.prefix,
          suffix: activeSelection.suffix,
          text: value,
          author: composingNoteAuthor,
          createdAt: Date.now(),
          updatedAt: Date.now()
        });
      }
      localStorage.setItem(notesKey, JSON.stringify(notes));
      SideleafSync.markDirty(localStorage, [notesKey]);
      if (activeSelection) {
        focusedNoteIds = notes.filter(note =>
          note.bookId === activeBookId
          && Number(note.rangeStart) === activeSelection.start
          && Number(note.rangeEnd) === activeSelection.end
        ).map(note => note.id);
      }
      activeSelectionHighlightVisible = false;
      editingNoteId = null;
      noteInput.value = '';
      noteInput.style.height = '';
      setNoteAuthor('wish');
      saveNote.textContent = '发送';
      renderPageContent(page);
      renderNotes();
    });

    fontSlider.addEventListener('input', () => {
      root.style.setProperty('--reader-size', `${fontSlider.value}px`);
      fontOutput.textContent = `${fontSlider.value}px`;
      applyTypography();
      saveSettings();
      repaginate();
    });

    lineSlider.addEventListener('input', () => {
      root.style.setProperty('--reader-leading', lineSlider.value);
      lineOutput.textContent = Number(lineSlider.value).toFixed(2);
      saveSettings();
      repaginate();
    });

    sheet.addEventListener('pointerdown', event => {
      startX = event.clientX;
      startY = event.clientY;
      longPressStartX = event.clientX;
      longPressStartY = event.clientY;
      longPressTriggered = false;
      clearLongPress();
      if (pageText.contains(event.target)) {
        longPressTimer = window.setTimeout(() => {
          longPressTriggered = selectSentenceAt(longPressStartX, longPressStartY);
          if (longPressTriggered) ignoreNextClick = true;
        }, 430);
      }
    });

    sheet.addEventListener('pointermove', event => {
      if (Math.hypot(event.clientX - longPressStartX, event.clientY - longPressStartY) > 10) clearLongPress();
    });

    sheet.addEventListener('pointercancel', clearLongPress);

    pageText.addEventListener('contextmenu', event => event.preventDefault());

    sheet.addEventListener('pointerup', event => {
      clearLongPress();
      if (longPressTriggered) {
        window.setTimeout(() => { ignoreNextClick = false; }, 450);
        return;
      }
      const dx = event.clientX - startX;
      const dy = event.clientY - startY;
      const bounds = sheet.getBoundingClientRect();
      const startedInLeftHalf = startX <= bounds.left + bounds.width * .5;
      if (window.getSelection()?.toString().trim()) {
        window.setTimeout(updateSelectionToolbar, 30);
        return;
      }
      if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy)) {
        ignoreNextClick = true;
        if (dx > 58 && startedInLeftHalf) openToc();
        window.setTimeout(() => { ignoreNextClick = false; }, 350);
      }
      window.setTimeout(updateSelectionToolbar, 30);
    });

    sheet.addEventListener('click', event => {
      if (dismissedOverlayByPointer) {
        dismissedOverlayByPointer = false;
        return;
      }
      const annotation = event.target.closest('.annotation-highlight');
      if (annotation) {
        const noteIds = (annotation.dataset.noteIds || '').split(',').filter(Boolean);
        showHighlightedNotes(noteIds, annotation.getBoundingClientRect());
        return;
      }
      if (event.target.closest('.active-selection-highlight')) return;
      if (ignoreNextClick || window.getSelection()?.toString().trim()) return;
      const bounds = sheet.getBoundingClientRect();
      const position = (event.clientX - bounds.left) / bounds.width;
      if (position < .35) turn(-1);
      if (position > .65) turn(1);
      if (position >= .35 && position <= .65) {
        toggleLightPopover(pageNumber);
      }
    });

    let selectionTimer;
    document.addEventListener('selectionchange', () => {
      window.clearTimeout(selectionTimer);
      selectionTimer = window.setTimeout(updateSelectionToolbar, 80);
    });

    noteInput.addEventListener('focus', () => {
      stabilizeNotesForKeyboard();
      [80, 180, 320].forEach(delay => window.setTimeout(stabilizeNotesForKeyboard, delay));
    });
    window.visualViewport?.addEventListener('resize', stabilizeNotesForKeyboard);
    window.visualViewport?.addEventListener('scroll', stabilizeNotesForKeyboard);
    window.addEventListener('scroll', stabilizeNotesForKeyboard, { passive:true });

    sheet.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') turn(-1);
      if (event.key === 'ArrowRight') turn(1);
    });

    const observer = new ResizeObserver(() => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(repaginate, 80);
    });
    observer.observe(pageText);
    window.addEventListener('sideleaf:core-state', () => {
      try { readingLineStates = JSON.parse(localStorage.getItem(readingLinesKey) || '{}'); }
      catch (_) { readingLineStates = {}; }
      const incoming = readingLineStates[activeBookId]?.zheng;
      if (incoming) {
        readingState.zheng.current = nullableAnchor(incoming.current);
        readingState.zheng.furthest = nullableAnchor(incoming.furthest);
      }
      renderReadingLines();
      if (pages[index]) renderPageContent(pages[index]);
      if (!notesSheet.hidden) renderNotes();
    });
    SideleafSync.start(localStorage);
    applyTypography();
    void paginate(initialAnchor);
    renderToc();
  })();
</script>
</body>
</html>
