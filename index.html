<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sideleaf">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Sideleaf · 书架</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  @view-transition {
    navigation: auto;
  }
  ::view-transition-group(sideleaf-book) {
    animation-duration: .42s;
    animation-timing-function: cubic-bezier(.22, .78, .18, 1);
  }
  :root {
    --paper: #f5f1e8;
    --paper-deep: #ebe3d6;
    --ink: #292621;
    --muted: #8b8378;
    --line: rgba(73, 62, 49, .13);
    --accent: #8f6f60;
  }
  * { box-sizing: border-box; }
  html {
    -webkit-tap-highlight-color: transparent;
  }
  a,
  button,
  input,
  textarea,
  [role="button"] {
    -webkit-tap-highlight-color: transparent;
  }
  button {
    -webkit-appearance: none;
    appearance: none;
  }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", "Microsoft YaHei", sans-serif;
  }
  .shelf {
    width: min(100%, 760px);
    min-height: 100svh;
    margin: 0 auto;
    padding: max(34px, env(safe-area-inset-top)) 22px calc(110px + env(safe-area-inset-bottom));
  }
  header { margin: 14px 2px 34px; }
  h1 {
    margin: 0;
    font-size: 29px;
    line-height: 1.2;
    font-weight: 650;
    letter-spacing: -.02em;
  }
  header p {
    margin: 9px 0 0;
    color: var(--muted);
    font-size: 14px;
  }
  .book-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px 18px;
  }
  .book {
    min-width: 0;
    color: inherit;
    text-decoration: none;
  }
  .cover {
    position: relative;
    aspect-ratio: 3 / 4.15;
    overflow: hidden;
    padding: 20px 17px;
    border: 1px solid rgba(79, 66, 52, .12);
    border-radius: 5px 13px 13px 5px;
    background:
      linear-gradient(90deg, rgba(91, 72, 57, .12), transparent 9px),
      linear-gradient(145deg, #d8c6b8, #b79b8c);
    box-shadow: 0 9px 22px rgba(65, 52, 41, .12), inset 2px 0 rgba(255,255,255,.35);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .book:nth-child(3n + 2) .cover {
    background: linear-gradient(90deg, rgba(91, 72, 57, .10), transparent 9px), linear-gradient(145deg, #c5cdc5, #91a097);
  }
  .book:nth-child(3n) .cover {
    background: linear-gradient(90deg, rgba(91, 72, 57, .10), transparent 9px), linear-gradient(145deg, #d8cfb2, #b7a872);
  }
  .book:active .cover { transform: scale(.985); }
  .book.is-opening .cover { view-transition-name: sideleaf-book; }
  .cover-title {
    display: block;
    max-width: 9em;
    color: rgba(255,255,255,.94);
    font-size: 17px;
    font-weight: 600;
    line-height: 1.45;
    letter-spacing: .04em;
    text-shadow: 0 1px 6px rgba(50,39,31,.12);
  }
  .leaf-mark {
    position: absolute;
    right: 16px;
    bottom: 15px;
    color: rgba(255,255,255,.72);
    font-size: 13px;
    letter-spacing: .08em;
  }
  .book-info { padding: 10px 3px 0; }
  .book-name {
    overflow: hidden;
    margin: 0;
    font-size: 15px;
    font-weight: 560;
    line-height: 1.35;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .book-progress {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .book-reading-lines {
    display: grid;
    gap: 4px;
    margin-top: 8px;
  }
  .book-reading-line {
    display: grid;
    grid-template-columns: 12px minmax(0, 1fr);
    align-items: center;
    gap: 5px;
  }
  .book-reading-line > span {
    color: var(--muted);
    font-size: 9px;
    line-height: 1;
  }
  .book-reading-track {
    height: 2px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(73, 62, 49, .10);
  }
  .book-reading-track i {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    transition: width .22s ease;
  }
  .book-reading-line.wish .book-reading-track i { background: #a57f70; }
  .book-reading-line.zheng .book-reading-track i { background: #707b78; }
  .import-button {
    position: fixed;
    z-index: 10;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    min-width: 154px;
    padding: 13px 22px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px;
    background: var(--accent);
    color: #fffaf3;
    box-shadow: 0 10px 28px rgba(74, 55, 44, .22);
    font: 560 15px/1.2 inherit;
  }
  .import-button:active { transform: translateX(-50%) scale(.98); }
  .format-note {
    grid-column: 1 / -1;
    margin: 2px 0 0;
    padding: 14px 16px;
    border: 1px dashed var(--line);
    border-radius: 13px;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
  }
  @media (min-width: 620px) {
    .book-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .shelf { padding-right: 30px; padding-left: 30px; }
  }
</style>
</head>
<body>
  <main class="shelf">
    <header>
      <h1>Sideleaf</h1>
      <p>愿与峥的共读书架</p>
    </header>

    <section id="book-grid" class="book-grid" aria-label="书架">
      <a class="book" href="./read.html">
        <div class="cover">
          <span class="cover-title">雨停以后</span>
          <span class="leaf-mark">SIDELEAF</span>
        </div>
        <div class="book-info">
          <p class="book-name">雨停以后</p>
          <div class="book-progress">排版样章</div>
          <div class="book-reading-lines" data-book-lines="sideleaf-sample-rain" aria-label="愿与峥的阅读进度">
            <div class="book-reading-line wish"><span>愿</span><div class="book-reading-track"><i></i></div></div>
            <div class="book-reading-line zheng"><span>峥</span><div class="book-reading-track"><i></i></div></div>
          </div>
        </div>
      </a>
      <div id="format-note" class="format-note">先放一本小样章在这里。你也可以从“文件”里导入 TXT 或 Markdown。</div>
    </section>
  </main>

  <input id="book-file" type="file" accept=".txt,.md,.markdown,text/plain,text/markdown" hidden>
  <button id="import-button" class="import-button" type="button">＋ 导入一本书</button>

<script>
  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(registration => registration.update())
      .catch(() => {});
  }

  (() => {
    const booksKey = 'sideleaf.books.v1';
    const readingLinesKey = 'sideleaf.reading-lines.v1';
    const grid = document.getElementById('book-grid');
    const fileInput = document.getElementById('book-file');
    const importButton = document.getElementById('import-button');
    const formatNote = document.getElementById('format-note');

    function readBooks() {
      try { return JSON.parse(localStorage.getItem(booksKey) || '[]'); }
      catch (_) { return []; }
    }

    function readReadingLines() {
      try { return JSON.parse(localStorage.getItem(readingLinesKey) || '{}'); }
      catch (_) { return {}; }
    }

    function linePercent(anchor, totalLength) {
      const value = Number(anchor);
      const total = Number(totalLength);
      if (!Number.isFinite(value) || !total) return 0;
      return Math.max(0, Math.min(100, (value / total) * 100));
    }

    function updateBookLines(element, state, totalLength, legacyAnchor = 0) {
      if (!element) return;
      const wishAnchor = state?.wish?.furthest ?? legacyAnchor;
      const zhengAnchor = state?.zheng?.furthest;
      element.querySelector('.wish i').style.width = `${linePercent(wishAnchor, totalLength)}%`;
      element.querySelector('.zheng i').style.width = `${linePercent(zhengAnchor, totalLength)}%`;
    }

    function bookLinesMarkup(bookId) {
      return `<div class="book-reading-lines" data-book-lines="${escapeText(bookId)}" aria-label="愿与峥的阅读进度">
        <div class="book-reading-line wish"><span>愿</span><div class="book-reading-track"><i></i></div></div>
        <div class="book-reading-line zheng"><span>峥</span><div class="book-reading-track"><i></i></div></div>
      </div>`;
    }

    function escapeText(value) {
      const span = document.createElement('span');
      span.textContent = value;
      return span.innerHTML;
    }

    function renderBooks() {
      grid.querySelectorAll('[data-imported]').forEach(node => node.remove());
      const books = readBooks();
      const readingLines = readReadingLines();
      const sampleLines = grid.querySelector('[data-book-lines="sideleaf-sample-rain"]');
      const sampleState = readingLines['sideleaf-sample-rain'];
      updateBookLines(sampleLines, sampleState, sampleState?.textLength || 0);
      books.forEach(book => {
        const percent = book.content.length
          ? Math.min(100, Math.round((Number(book.progress || 0) / book.content.length) * 100))
          : 0;
        const link = document.createElement('a');
        link.className = 'book';
        link.dataset.imported = 'true';
        link.href = `./read.html?book=${encodeURIComponent(book.id)}`;
        link.innerHTML = `
          <div class="cover">
            <span class="cover-title">${escapeText(book.title)}</span>
            <span class="leaf-mark">SIDELEAF</span>
          </div>
          <div class="book-info">
            <p class="book-name">${escapeText(book.title)}</p>
            <div class="book-progress">${percent ? `继续阅读 · ${percent}%` : '尚未开始'}</div>
            ${bookLinesMarkup(book.id)}
          </div>`;
        grid.insertBefore(link, formatNote);
        updateBookLines(link.querySelector('.book-reading-lines'), readingLines[book.id], book.content.length, book.progress);
      });
      formatNote.hidden = books.length > 0;
    }

    grid.addEventListener('click', event => {
      const link = event.target.closest('a.book');
      if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      link.classList.add('is-opening');
    });

    window.addEventListener('pageshow', () => {
      grid.querySelectorAll('.book.is-opening').forEach(link => link.classList.remove('is-opening'));
      renderBooks();
    });

    importButton.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      try {
        const content = (await file.text()).replace(/\r\n/g, '\n').trim();
        if (!content) throw new Error('empty');
        const title = file.name.replace(/\.(txt|md|markdown)$/i, '') || '未命名';
        const books = readBooks();
        const id = window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        books.unshift({ id, title, content, progress: 0, createdAt: Date.now(), updatedAt: Date.now() });
        localStorage.setItem(booksKey, JSON.stringify(books));
        renderBooks();
      } catch (_) {
        window.alert('这本书暂时没有导入成功。请先试试 UTF-8 编码的 TXT 或 Markdown 文件。');
      } finally {
        fileInput.value = '';
      }
    });

    renderBooks();
  })();
</script>
</body>
</html>
