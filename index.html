<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfaf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sideleaf">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Sideleaf · 书架</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  @view-transition {
    navigation: auto;
  }
  ::view-transition-group(sideleaf-book) {
    animation-duration: .42s;
    animation-timing-function: cubic-bezier(.22, .78, .18, 1);
  }
  :root {
    --paper: #fcfaf7;
    --paper-deep: #f1ebe4;
    --ink: #544c44;
    --muted: #8b8378;
    --line: rgba(73, 62, 49, .13);
    --accent: #8f6f60;
  }
  * { box-sizing: border-box; }
  html {
    -webkit-tap-highlight-color: transparent;
  }
  a,
  button,
  input,
  textarea,
  [role="button"] {
    -webkit-tap-highlight-color: transparent;
  }
  button {
    -webkit-appearance: none;
    appearance: none;
  }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", "Microsoft YaHei", sans-serif;
  }
  .shelf {
    width: min(100%, 760px);
    min-height: 100svh;
    margin: 0 auto;
    padding: max(34px, env(safe-area-inset-top)) 22px calc(110px + env(safe-area-inset-bottom));
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    margin: 14px 2px 34px;
  }
  h1 {
    margin: 0;
    font-size: 29px;
    line-height: 1.2;
    font-weight: 650;
    letter-spacing: -.02em;
  }
  header p {
    margin: 9px 0 0;
    color: var(--muted);
    font-size: 14px;
  }
  .data-button {
    flex: 0 0 auto;
    margin-top: -4px;
    padding: 9px 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(252, 250, 247, .78);
    color: var(--muted);
    font: 560 13px/1.2 inherit;
  }
  .book-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px 18px;
  }
  .book {
    min-width: 0;
    color: inherit;
    text-decoration: none;
  }
  .cover {
    position: relative;
    aspect-ratio: 3 / 4.15;
    overflow: hidden;
    padding: 20px 17px;
    border: 1px solid rgba(79, 66, 52, .12);
    border-radius: 5px 13px 13px 5px;
    background:
      linear-gradient(90deg, rgba(91, 72, 57, .12), transparent 9px),
      linear-gradient(145deg, #d8c6b8, #b79b8c);
    box-shadow: 0 9px 22px rgba(65, 52, 41, .12), inset 2px 0 rgba(255,255,255,.35);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .book:nth-child(3n + 2) .cover {
    background: linear-gradient(90deg, rgba(91, 72, 57, .10), transparent 9px), linear-gradient(145deg, #c5cdc5, #91a097);
  }
  .book:nth-child(3n) .cover {
    background: linear-gradient(90deg, rgba(91, 72, 57, .10), transparent 9px), linear-gradient(145deg, #d8cfb2, #b7a872);
  }
  .book:active .cover { transform: scale(.985); }
  .book.is-opening .cover { view-transition-name: sideleaf-book; }
  .cover-title {
    display: block;
    max-width: 9em;
    color: rgba(255,255,255,.94);
    font-size: 17px;
    font-weight: 600;
    line-height: 1.45;
    letter-spacing: .04em;
    text-shadow: 0 1px 6px rgba(50,39,31,.12);
  }
  .leaf-mark {
    position: absolute;
    right: 16px;
    bottom: 15px;
    color: rgba(255,255,255,.72);
    font-size: 13px;
    letter-spacing: .08em;
  }
  .book-info { padding: 10px 3px 0; }
  .book-name {
    overflow: hidden;
    margin: 0;
    font-size: 15px;
    font-weight: 560;
    line-height: 1.35;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .book-progress {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .book-reading-lines {
    display: grid;
    gap: 4px;
    margin-top: 8px;
  }
  .book-reading-line {
    display: grid;
    grid-template-columns: 12px minmax(0, 1fr);
    align-items: center;
    gap: 5px;
  }
  .book-reading-line > span {
    color: var(--muted);
    font-size: 9px;
    line-height: 1;
  }
  .book-reading-track {
    height: 2px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(73, 62, 49, .10);
  }
  .book-reading-track i {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    transition: width .22s ease;
  }
  .book-reading-line.wish .book-reading-track i { background: #a57f70; }
  .book-reading-line.zheng .book-reading-track i { background: #707b78; }
  .import-button {
    position: fixed;
    z-index: 10;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    min-width: 154px;
    padding: 13px 22px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px;
    background: var(--accent);
    color: #fffaf3;
    box-shadow: 0 10px 28px rgba(74, 55, 44, .22);
    font: 560 15px/1.2 inherit;
  }
  .import-button:active { transform: translateX(-50%) scale(.98); }
  .import-button:disabled { opacity: .72; }
  .format-note {
    grid-column: 1 / -1;
    margin: 2px 0 0;
    padding: 14px 16px;
    border: 1px dashed var(--line);
    border-radius: 13px;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
  }
  .sheet-backdrop {
    position: fixed;
    z-index: 30;
    inset: 0;
    display: grid;
    align-items: end;
    background: rgba(38, 34, 29, .22);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .sheet-backdrop.is-open {
    opacity: 1;
    pointer-events: auto;
  }
  .data-sheet {
    width: min(100%, 760px);
    max-height: calc(100svh - max(42px, env(safe-area-inset-top)));
    margin: 0 auto;
    overflow: auto;
    padding: 22px 22px calc(22px + env(safe-area-inset-bottom));
    border: 1px solid var(--line);
    border-bottom: 0;
    border-radius: 24px 24px 0 0;
    background: var(--paper);
    box-shadow: 0 -18px 50px rgba(57, 47, 38, .16);
    transform: translateY(24px);
    transition: transform .24s cubic-bezier(.22, .78, .18, 1);
  }
  .sheet-backdrop.is-open .data-sheet { transform: translateY(0); }
  .sheet-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 18px;
  }
  .sheet-heading h2 {
    margin: 0;
    font-size: 20px;
  }
  .sheet-close {
    padding: 7px 0;
    border: 0;
    background: none;
    color: var(--accent);
    font: 560 15px/1.2 inherit;
  }
  .data-summary,
  .restore-preview {
    margin: 0 0 16px;
    padding: 14px 16px;
    border-radius: 15px;
    background: var(--paper-deep);
    color: var(--muted);
    font-size: 13px;
    line-height: 1.65;
  }
  .restore-preview strong {
    display: block;
    margin-bottom: 3px;
    color: var(--ink);
    font-size: 15px;
  }
  .data-actions {
    display: grid;
    gap: 10px;
  }
  .data-action {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fffdfa;
    color: var(--ink);
    text-align: left;
    font: 560 15px/1.3 inherit;
  }
  .data-action small {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 400;
  }
  .data-action.primary {
    border-color: transparent;
    background: var(--accent);
    color: #fffaf3;
    text-align: center;
  }
  .data-action.danger-confirm { background: #765548; }
  .data-action:disabled { opacity: .58; }
  .restore-panel[hidden],
  .connect-panel[hidden],
  .core-restore-panel[hidden] { display: none; }
  .snapshot-list {
    display: grid;
    gap: 9px;
    margin: 14px 0;
  }
  .snapshot-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    padding: 12px 13px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fffdfa;
  }
  .snapshot-copy strong,
  .snapshot-copy small { display: block; }
  .snapshot-copy strong { font-size: 13px; }
  .snapshot-copy small {
    margin-top: 3px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.45;
  }
  .snapshot-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .snapshot-actions button {
    padding: 6px 8px;
    border: 0;
    background: none;
    color: var(--accent);
    font: 560 12px/1.2 inherit;
  }
  .connect-field { margin-bottom: 14px; }
  .connect-field label {
    display: block;
    margin: 0 2px 7px;
    color: var(--muted);
    font-size: 12px;
  }
  .connect-field input {
    width: 100%;
    min-height: 48px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    outline: none;
    background: #fffdfa;
    color: var(--ink);
    caret-color: var(--accent);
    font: 15px/1.3 inherit;
  }
  .connect-field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(201,130,100,.13);
  }
  .restore-warning {
    margin: -5px 2px 14px;
    color: #805d50;
    font-size: 12px;
    line-height: 1.55;
  }
  .toast {
    position: fixed;
    z-index: 50;
    left: 50%;
    bottom: calc(25px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    gap: 14px;
    width: max-content;
    max-width: calc(100vw - 36px);
    padding: 12px 15px;
    border-radius: 999px;
    background: #3d3731;
    color: #fffaf3;
    box-shadow: 0 10px 30px rgba(44, 37, 31, .25);
    font-size: 13px;
  }
  .toast button {
    padding: 2px 0;
    border: 0;
    background: none;
    color: #e2b5a0;
    font: 600 13px/1.2 inherit;
  }
  .toast[hidden] { display: none; }
  @media (min-width: 620px) {
    .book-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .shelf { padding-right: 30px; padding-left: 30px; }
  }
</style>
</head>
<body>
  <main class="shelf">
    <header>
      <div>
        <h1>Sideleaf</h1>
        <p>愿与峥的共读书架</p>
      </div>
      <button id="data-button" class="data-button" type="button">备份</button>
    </header>

    <section id="book-grid" class="book-grid" aria-label="书架">
      <div id="format-note" class="format-note" hidden>先放一本小样章在这里。你也可以从“文件”里导入 EPUB、TXT 或 Markdown。</div>
    </section>
  </main>

  <input id="book-file" type="file" accept=".epub,.txt,.md,.markdown,application/epub+zip,text/plain,text/markdown" hidden>
  <input id="backup-file" type="file" accept=".json,.sideleaf.json,application/json" hidden>
  <button id="import-button" class="import-button" type="button">＋ 导入一本书</button>

  <div id="data-backdrop" class="sheet-backdrop" aria-hidden="true">
    <section class="data-sheet" role="dialog" aria-modal="true" aria-labelledby="data-title">
      <div class="sheet-heading">
        <h2 id="data-title">Sideleaf 备份</h2>
        <button id="data-close" class="sheet-close" type="button">完成</button>
      </div>
      <p id="current-data-summary" class="data-summary"></p>
      <p id="core-sync-status" class="data-summary"></p>
      <div id="data-actions" class="data-actions">
        <button id="export-backup" class="data-action" type="button">
          导出完整备份
          <small>把书、阅读线、批注对话、札记与设置收进一个文件</small>
        </button>
        <button id="choose-backup" class="data-action" type="button">
          从本地备份恢复
          <small>先检查文件与内容，确认后才会替换现有数据</small>
        </button>
        <button id="restore-core" class="data-action" type="button">
          从 Core 恢复
          <small>找回完整书架，或退回 Core 保存的旧版本</small>
        </button>
        <button id="connect-core" class="data-action" type="button">
          连接 Sideleaf Core
          <small>把 Core 生成的一次性配对码交给这份桌面书架</small>
        </button>
      </div>
      <div id="restore-panel" class="restore-panel" hidden>
        <div id="restore-preview" class="restore-preview"></div>
        <p id="restore-warning" class="restore-warning">恢复会以这份备份替换当前 Sideleaf 数据；若写入失败，会自动回滚。恢复成功后仍可立即撤销一次。</p>
        <div class="data-actions">
          <button id="cancel-restore" class="data-action" type="button">换一份备份</button>
          <button id="confirm-restore" class="data-action primary" type="button">恢复这份备份</button>
        </div>
      </div>
      <div id="core-restore-panel" class="core-restore-panel" hidden>
        <div id="core-restore-summary" class="restore-preview"></div>
        <div class="data-actions">
          <button id="restore-core-current" class="data-action primary" type="button">合并 Core 当前书架</button>
          <button id="save-core-snapshot" class="data-action" type="button">
            保存当前版本
            <small>长期保留，直到愿取消保留</small>
          </button>
        </div>
        <div id="core-snapshot-list" class="snapshot-list"></div>
        <button id="close-core-restore" class="data-action" type="button">返回</button>
      </div>
      <div id="connect-panel" class="connect-panel" hidden>
        <p class="restore-warning">请在真正装着书的桌面 Sideleaf 里完成这一步。配对后，会把这台设备现有的完整书架合并进 Core。</p>
        <div class="connect-field">
          <label for="core-url">Sideleaf Core 地址</label>
          <input id="core-url" type="url" inputmode="url" autocapitalize="off" spellcheck="false" value="https://sideleaf-core-production.up.railway.app">
        </div>
        <div class="connect-field">
          <label for="pairing-code">一次性配对码</label>
          <input id="pairing-code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="粘贴 Core 刚刚生成的配对码">
        </div>
        <div class="data-actions">
          <button id="cancel-connect" class="data-action" type="button">返回</button>
          <button id="confirm-connect" class="data-action primary" type="button">连接并同步这份书架</button>
        </div>
      </div>
    </section>
  </div>
  <div id="backup-toast" class="toast" role="status" hidden>
    <span id="toast-message"></span>
    <button id="undo-restore" type="button" hidden>撤销恢复</button>
  </div>

<script src="./vendor/jszip.min.js"></script>
<script src="./sideleaf-library.js"></script>
<script src="./sideleaf-backup.js"></script>
<script src="./sideleaf-sync.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(registration => registration.update())
      .catch(() => {});
  }

  (() => {
    const appVersion = '0.15.22';
    const booksKey = 'sideleaf.books.v1';
    const readingLinesKey = 'sideleaf.reading-lines.v1';
    const grid = document.getElementById('book-grid');
    const fileInput = document.getElementById('book-file');
    const importButton = document.getElementById('import-button');
    const formatNote = document.getElementById('format-note');
    const dataButton = document.getElementById('data-button');
    const dataBackdrop = document.getElementById('data-backdrop');
    const dataClose = document.getElementById('data-close');
    const currentDataSummary = document.getElementById('current-data-summary');
    const coreSyncStatus = document.getElementById('core-sync-status');
    const dataActions = document.getElementById('data-actions');
    const exportBackup = document.getElementById('export-backup');
    const chooseBackup = document.getElementById('choose-backup');
    const restoreCore = document.getElementById('restore-core');
    const connectCore = document.getElementById('connect-core');
    const backupFile = document.getElementById('backup-file');
    const restorePanel = document.getElementById('restore-panel');
    const restorePreview = document.getElementById('restore-preview');
    const restoreWarning = document.getElementById('restore-warning');
    const cancelRestore = document.getElementById('cancel-restore');
    const confirmRestore = document.getElementById('confirm-restore');
    const connectPanel = document.getElementById('connect-panel');
    const coreUrl = document.getElementById('core-url');
    const pairingCode = document.getElementById('pairing-code');
    const cancelConnect = document.getElementById('cancel-connect');
    const confirmConnect = document.getElementById('confirm-connect');
    const coreRestorePanel = document.getElementById('core-restore-panel');
    const coreRestoreSummary = document.getElementById('core-restore-summary');
    const restoreCoreCurrent = document.getElementById('restore-core-current');
    const saveCoreSnapshot = document.getElementById('save-core-snapshot');
    const coreSnapshotList = document.getElementById('core-snapshot-list');
    const closeCoreRestore = document.getElementById('close-core-restore');
    const backupToast = document.getElementById('backup-toast');
    const toastMessage = document.getElementById('toast-message');
    const undoRestore = document.getElementById('undo-restore');
    let pendingBackup = null;
    let pendingBackupSource = 'file';
    let pendingCoreSnapshotId = null;
    let coreRecovery = null;
    let undoRestoreAction = null;
    let toastTimer = 0;

    SideleafLibrary.ensure(localStorage);

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    function summaryText(summary) {
      const parts = [`${summary.books} 本书`, `${summary.notes} 条批注对话`];
      if (Number.isFinite(summary.likes)) parts.push(`${summary.likes} 处喜欢`);
      parts.push(`${summary.journals} 篇章节札记`, `${summary.requests} 个阅读请求`, formatBytes(summary.bytes));
      return parts.join(' · ');
    }

    function refreshDataSummary() {
      const summary = SideleafBackup.summarize(SideleafBackup.collect(localStorage));
      currentDataSummary.textContent = `当前：${summaryText(summary)}`;
      refreshCoreSyncStatus();
    }

    function refreshCoreSyncStatus(override = '') {
      const sync = SideleafSync.status(localStorage);
      if (override) coreSyncStatus.textContent = override;
      else if (!sync.connected) coreSyncStatus.textContent = 'Core：尚未连接';
      else if (sync.pending) coreSyncStatus.textContent = `Core：已连接 · ${sync.pending} 类变化等待同步`;
      else coreSyncStatus.textContent = 'Core：已连接 · 本机变化已同步';
    }

    function openDataSheet() {
      refreshDataSummary();
      dataBackdrop.classList.add('is-open');
      dataBackdrop.setAttribute('aria-hidden', 'false');
    }

    function closeDataSheet() {
      dataBackdrop.classList.remove('is-open');
      dataBackdrop.setAttribute('aria-hidden', 'true');
      resetRestorePanel();
      resetConnectPanel();
      resetCoreRestorePanel();
    }

    function resetRestorePanel() {
      pendingBackup = null;
      pendingBackupSource = 'file';
      pendingCoreSnapshotId = null;
      backupFile.value = '';
      restorePanel.hidden = true;
      dataActions.hidden = false;
      confirmRestore.classList.remove('danger-confirm');
      confirmRestore.textContent = '恢复这份备份';
      confirmRestore.dataset.armed = '';
      cancelRestore.textContent = '换一份备份';
      restoreWarning.textContent = '恢复会以这份备份替换当前 Sideleaf 数据；若写入失败，会自动回滚。恢复成功后仍可立即撤销一次。';
    }

    function resetConnectPanel() {
      connectPanel.hidden = true;
      dataActions.hidden = false;
      pairingCode.value = '';
      confirmConnect.disabled = false;
      confirmConnect.textContent = '连接并同步这份书架';
    }

    function resetCoreRestorePanel() {
      coreRestorePanel.hidden = true;
      coreRecovery = null;
      coreSnapshotList.replaceChildren();
      dataActions.hidden = false;
    }

    function openConnectPanel() {
      resetRestorePanel();
      resetCoreRestorePanel();
      dataActions.hidden = true;
      connectPanel.hidden = false;
      window.setTimeout(() => pairingCode.focus(), 50);
    }

    async function connectThisShelf() {
      confirmConnect.disabled = true;
      confirmConnect.textContent = '正在连接并同步…';
      try {
        await SideleafSync.pairWithCode(localStorage, {
          baseUrl:coreUrl.value,
          code:pairingCode.value
        });
        resetConnectPanel();
        refreshCoreSyncStatus();
        showToast('这份桌面书架已经连接到 Core。');
      } catch (error) {
        confirmConnect.disabled = false;
        confirmConnect.textContent = '连接并同步这份书架';
        window.alert(error?.message || '这次没有连接成功，请重新生成配对码。');
      }
    }

    function recoveryDate(value) {
      if (!value) return '时间未知';
      return new Intl.DateTimeFormat('zh-CN', {
        month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'
      }).format(new Date(value));
    }

    function snapshotKindLabel(snapshot) {
      if (snapshot.pinned) return '长期保留';
      if (snapshot.kind === 'protected') return '保护快照';
      return '自动快照';
    }

    function renderCoreRecovery() {
      if (!coreRecovery) return;
      const current = coreRecovery.current || { summary:{} };
      coreRestoreSummary.innerHTML = `<strong>Core 当前保存：${summaryText(current.summary || {})}</strong>${escapeText(recoveryDate(current.updatedAt))} 最近更新`;
      restoreCoreCurrent.disabled = !Number(current.summary?.keys || 0);
      coreSnapshotList.replaceChildren();
      const snapshots = Array.isArray(coreRecovery.snapshots) ? coreRecovery.snapshots : [];
      if (!snapshots.length) {
        const empty = document.createElement('p');
        empty.className = 'data-summary';
        empty.textContent = '还没有旧版本。发生实际变化后，Core 会按保留规则自动留下。';
        coreSnapshotList.appendChild(empty);
        return;
      }
      snapshots.forEach(snapshot => {
        const item = document.createElement('div');
        item.className = 'snapshot-item';
        const copy = document.createElement('div');
        copy.className = 'snapshot-copy';
        const title = document.createElement('strong');
        title.textContent = `${snapshotKindLabel(snapshot)} · ${recoveryDate(snapshot.createdAt)}`;
        const detail = document.createElement('small');
        detail.textContent = `${summaryText(snapshot.summary || {})} · ${snapshot.reason || '版本快照'}`;
        copy.append(title, detail);
        const actions = document.createElement('div');
        actions.className = 'snapshot-actions';
        const pin = document.createElement('button');
        pin.type = 'button';
        pin.textContent = snapshot.pinned ? '取消保留' : '长期保留';
        pin.addEventListener('click', async () => {
          pin.disabled = true;
          try {
            await SideleafSync.pinRecoverySnapshot(localStorage, snapshot.id, !snapshot.pinned);
            await loadCoreRecovery();
          } catch (error) {
            window.alert(error?.message || '快照保留状态没有改成功。');
          }
        });
        const restore = document.createElement('button');
        restore.type = 'button';
        restore.textContent = '恢复';
        restore.addEventListener('click', () => prepareCoreRestore('core-snapshot', snapshot.id));
        actions.append(pin, restore);
        item.append(copy, actions);
        coreSnapshotList.appendChild(item);
      });
    }

    async function loadCoreRecovery() {
      if (!SideleafSync.status(localStorage).connected) {
        window.alert('请先连接 Sideleaf Core，再从 Core 恢复。');
        return;
      }
      resetRestorePanel();
      resetConnectPanel();
      dataActions.hidden = true;
      coreRestorePanel.hidden = false;
      coreRestoreSummary.innerHTML = '<strong>正在读取 Core…</strong>';
      coreSnapshotList.replaceChildren();
      try {
        coreRecovery = await SideleafSync.recoveryOverview(localStorage);
        renderCoreRecovery();
      } catch (error) {
        resetCoreRestorePanel();
        window.alert(error?.message || '暂时没有从 Core 读到恢复信息。');
      }
    }

    async function prepareCoreRestore(source, snapshotId = null) {
      restoreCoreCurrent.disabled = true;
      try {
        const backup = await SideleafSync.fetchRecoveryBackup(localStorage, snapshotId);
        pendingBackup = await SideleafBackup.parse(JSON.stringify(backup));
        pendingBackup.storage = SideleafLibrary.ensureSnapshot(pendingBackup.storage);
        pendingBackupSource = source;
        pendingCoreSnapshotId = snapshotId;
        const incoming = SideleafBackup.summarize(pendingBackup.storage);
        const current = SideleafBackup.summarize(SideleafBackup.collect(localStorage));
        const exact = source === 'core-snapshot';
        restorePreview.innerHTML = `<strong>${exact ? '退回旧版本' : '合并 Core 当前书架'}：${summaryText(incoming)}</strong>本机当前：${summaryText(current)} · Core 版本：${escapeText(recoveryDate(pendingBackup.exportedAt))}`;
        restoreWarning.textContent = exact
          ? '旧版本恢复会让 Core 与本机一起退回这一刻；操作前会自动保存当前版本，恢复后仍可立即撤销。'
          : '会保留本机与 Core 两边独有的内容；同一条数据以 Core 当前版本为准。写入失败会自动回滚。';
        cancelRestore.textContent = '返回版本列表';
        confirmRestore.textContent = exact ? '恢复这个旧版本' : '合并并恢复';
        confirmRestore.dataset.armed = '';
        coreRestorePanel.hidden = true;
        restorePanel.hidden = false;
      } catch (error) {
        window.alert(error?.message || '这份 Core 数据没有通过检查。');
      } finally {
        restoreCoreCurrent.disabled = false;
      }
    }

    async function savePinnedCoreSnapshot() {
      saveCoreSnapshot.disabled = true;
      try {
        await SideleafSync.createRecoverySnapshot(localStorage, '愿手动保存');
        await loadCoreRecovery();
        showToast('Core 已长期保留当前版本。');
      } catch (error) {
        window.alert(error?.message || '当前版本没有保存成功。');
      } finally {
        saveCoreSnapshot.disabled = false;
      }
    }

    function showToast(message, undoAction = null) {
      window.clearTimeout(toastTimer);
      toastMessage.textContent = message;
      undoRestoreAction = undoAction;
      undoRestore.hidden = !undoAction;
      backupToast.hidden = false;
      toastTimer = window.setTimeout(() => {
        backupToast.hidden = true;
        undoRestoreAction = null;
      }, undoAction ? 9000 : 3500);
    }

    function backupFilename(date = new Date()) {
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().replace(/[:T]/g, '-').slice(0, 16);
      return `Sideleaf_完整备份_${local}.sideleaf.json`;
    }

    async function deliverBackupFile(file) {
      if (navigator.canShare?.({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'Sideleaf 完整备份' });
          return true;
        } catch (error) {
          if (error?.name === 'AbortError') return false;
        }
      }
      const url = URL.createObjectURL(file);
      const link = document.createElement('a');
      link.href = url;
      link.download = file.name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      return true;
    }

    async function exportCompleteBackup() {
      exportBackup.disabled = true;
      exportBackup.firstChild.textContent = '正在整理备份…\n          ';
      try {
        const backup = await SideleafBackup.create(localStorage, { appVersion });
        const json = `${JSON.stringify(backup, null, 2)}\n`;
        const file = new File([json], backupFilename(), { type: 'application/json' });
        const delivered = await deliverBackupFile(file);
        if (delivered) showToast('完整备份已经交给你保存。');
      } catch (error) {
        window.alert(error?.message || '备份没有导出成功，请再试一次。');
      } finally {
        exportBackup.disabled = false;
        exportBackup.firstChild.textContent = '导出完整备份\n          ';
      }
    }

    async function inspectBackupFile() {
      const file = backupFile.files?.[0];
      if (!file) return;
      if (file.size > 50 * 1024 * 1024) {
        window.alert('这份文件异常大，Sideleaf 没有继续读取。');
        backupFile.value = '';
        return;
      }
      chooseBackup.disabled = true;
      try {
        pendingBackup = await SideleafBackup.parse(await file.text());
        pendingBackup.storage = SideleafLibrary.ensureSnapshot(pendingBackup.storage);
        pendingBackupSource = 'file';
        pendingCoreSnapshotId = null;
        const summary = SideleafBackup.summarize(pendingBackup.storage);
        const exportedAt = new Intl.DateTimeFormat('zh-CN', {
          year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
        }).format(new Date(pendingBackup.exportedAt));
        restorePreview.innerHTML = `<strong>${summaryText(summary)}</strong>${exportedAt} 导出 · Sideleaf ${escapeText(pendingBackup.appVersion || '未知版本')}`;
        dataActions.hidden = true;
        restorePanel.hidden = false;
      } catch (error) {
        window.alert(error?.message || '这份备份没有通过检查。');
        backupFile.value = '';
      } finally {
        chooseBackup.disabled = false;
      }
    }

    async function restorePendingBackup() {
      if (!pendingBackup) return;
      if (confirmRestore.dataset.armed !== 'true') {
        confirmRestore.dataset.armed = 'true';
        confirmRestore.classList.add('danger-confirm');
        confirmRestore.textContent = pendingBackupSource === 'core-current'
          ? '再点一次，确认合并并恢复'
          : '再点一次，确认退回并恢复';
        return;
      }
      confirmRestore.disabled = true;
      const source = pendingBackupSource;
      let rollbackSnapshotId = null;
      try {
        let nextStorage = pendingBackup.storage;
        if (source === 'core-current') {
          nextStorage = SideleafBackup.merge(SideleafBackup.collect(localStorage), nextStorage);
        } else if (source === 'core-snapshot') {
          const result = await SideleafSync.restoreRecoverySnapshot(localStorage, pendingCoreSnapshotId);
          rollbackSnapshotId = result.rollbackSnapshotId;
          const restored = await SideleafBackup.parse(JSON.stringify(result.backup));
          nextStorage = SideleafLibrary.ensureSnapshot(restored.storage);
        }
        const undoLocal = SideleafBackup.replace(localStorage, nextStorage);
        if (source !== 'core-snapshot') SideleafSync.markDirty(localStorage);
        const undo = source === 'core-snapshot'
          ? async () => {
              const result = await SideleafSync.restoreRecoverySnapshot(localStorage, rollbackSnapshotId);
              const restored = await SideleafBackup.parse(JSON.stringify(result.backup));
              SideleafBackup.replace(localStorage, SideleafLibrary.ensureSnapshot(restored.storage));
            }
          : () => {
              undoLocal();
              SideleafSync.markDirty(localStorage);
            };
        resetRestorePanel();
        closeDataSheet();
        renderBooks();
        showToast(source === 'core-current' ? 'Core 当前书架已合并回来。' : 'Sideleaf 已恢复到选定版本。', undo);
      } catch (error) {
        if (rollbackSnapshotId) {
          try { await SideleafSync.restoreRecoverySnapshot(localStorage, rollbackSnapshotId); } catch (_) {}
        }
        confirmRestore.dataset.armed = '';
        confirmRestore.classList.remove('danger-confirm');
        confirmRestore.textContent = source === 'core-current' ? '合并并恢复' : source === 'core-snapshot' ? '恢复这个旧版本' : '恢复这份备份';
        window.alert(`恢复没有完成，原数据已经保留。\n${error?.message || ''}`.trim());
      } finally {
        confirmRestore.disabled = false;
      }
    }

    function readBooks() {
      return SideleafLibrary.ensure(localStorage);
    }

    function readReadingLines() {
      try { return JSON.parse(localStorage.getItem(readingLinesKey) || '{}'); }
      catch (_) { return {}; }
    }

    function linePercent(anchor, totalLength, started = false) {
      const value = Number(anchor);
      const total = Number(totalLength);
      if (!Number.isFinite(value) || !total) return 0;
      const percent = Math.max(0, Math.min(100, (value / total) * 100));
      return started ? Math.max(1.5, percent) : percent;
    }

    function updateBookLines(element, state, totalLength, legacyAnchor = 0) {
      if (!element) return;
      const wishAnchor = state?.wish?.current ?? legacyAnchor;
      const zhengAnchor = state?.zheng?.furthest;
      const wishStarted = Boolean(state) || Number(legacyAnchor) > 0;
      const zhengStarted = state?.zheng?.current !== null && state?.zheng?.current !== undefined;
      element.querySelector('.wish i').style.width = `${linePercent(wishAnchor, totalLength, wishStarted)}%`;
      element.querySelector('.zheng i').style.width = `${linePercent(zhengAnchor, totalLength, zhengStarted)}%`;
    }

    function bookLinesMarkup(bookId) {
      return `<div class="book-reading-lines" data-book-lines="${escapeText(bookId)}" aria-label="愿与峥的阅读进度">
        <div class="book-reading-line wish"><span>愿</span><div class="book-reading-track"><i></i></div></div>
        <div class="book-reading-line zheng"><span>峥</span><div class="book-reading-track"><i></i></div></div>
      </div>`;
    }

    function escapeText(value) {
      const span = document.createElement('span');
      span.textContent = value;
      return span.innerHTML;
    }

    function localNameOf(element) {
      return (element?.localName || element?.nodeName || '').replace(/^.*:/, '').toLowerCase();
    }

    function elementsByLocalName(root, name) {
      const target = name.toLowerCase();
      return [...root.getElementsByTagName('*')].filter(element => localNameOf(element) === target);
    }

    function parseXml(source, label) {
      const documentNode = new DOMParser().parseFromString(source, 'application/xml');
      if (documentNode.querySelector('parsererror')) throw new Error(`invalid-${label}`);
      return documentNode;
    }

    function resolveArchivePath(basePath, relativePath) {
      const cleanRelative = String(relativePath || '').split('#')[0];
      if (!cleanRelative) return basePath;
      const slash = basePath.lastIndexOf('/');
      const directory = slash >= 0 ? basePath.slice(0, slash + 1) : '';
      const resolved = new URL(cleanRelative, `https://sideleaf.invalid/${directory}`).pathname.slice(1);
      try { return decodeURIComponent(resolved); }
      catch (_) { return resolved; }
    }

    function normalizeBookText(value) {
      return value
        .replace(/\u00a0/g, ' ')
        .replace(/[ \t]+\n/g, '\n')
        .replace(/\n[ \t]+/g, '\n')
        .replace(/[ \t]{2,}/g, ' ')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    function extractEpubDocument(source, navigation = []) {
      const documentNode = new DOMParser().parseFromString(source, 'text/html');
      documentNode.querySelectorAll('script, style, noscript, svg, nav').forEach(node => node.remove());
      const rootNode = documentNode.body || documentNode.documentElement;
      let output = '';
      const toc = [];
      const usedNavigation = new Set();
      const blockNames = new Set(['address', 'article', 'aside', 'blockquote', 'div', 'figcaption', 'figure', 'footer', 'header', 'li', 'main', 'ol', 'p', 'pre', 'section', 'table', 'tr', 'ul']);

      function addToc(title, level, anchor = output.length) {
        const normalizedTitle = normalizeBookText(title || '');
        if (!normalizedTitle) return;
        if (toc.some(entry => entry.anchor === anchor && entry.title === normalizedTitle)) return;
        toc.push({ title: normalizedTitle, level: Math.min(3, Math.max(1, Number(level) || 1)), anchor });
      }

      function ensureBreak(count = 2) {
        if (!output) return;
        output = output.replace(/[ \t]+$/g, '');
        const trailing = output.match(/\n*$/)?.[0].length || 0;
        if (trailing < count) output += '\n'.repeat(count - trailing);
      }

      function recordNavigation(node) {
        const id = node.getAttribute?.('id') || node.getAttribute?.('xml:id');
        if (!id) return;
        navigation.forEach((entry, entryIndex) => {
          if (entry.fragment !== id || usedNavigation.has(entryIndex)) return;
          addToc(entry.title, entry.level);
          usedNavigation.add(entryIndex);
        });
      }

      navigation.forEach((entry, entryIndex) => {
        if (entry.fragment) return;
        addToc(entry.title, entry.level, 0);
        usedNavigation.add(entryIndex);
      });

      function walk(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          const value = (node.nodeValue || '').replace(/\s+/g, ' ');
          if (!value.trim()) return;
          output += !output || output.endsWith('\n') ? value.trimStart() : value;
          return;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        recordNavigation(node);
        const name = localNameOf(node);
        if (name === 'br') {
          ensureBreak(1);
          return;
        }
        const heading = name.match(/^h([1-6])$/);
        if (heading) {
          const title = normalizeBookText(node.textContent || '');
          const headingId = node.getAttribute('id') || node.getAttribute('xml:id');
          const matchedNavigation = navigation.some((entry, entryIndex) =>
            usedNavigation.has(entryIndex) && entry.fragment === headingId
          );
          if (title && !matchedNavigation) addToc(title, Math.min(3, Number(heading[1])));
          return;
        }
        const isBlock = blockNames.has(name);
        if (isBlock) ensureBreak(2);
        [...node.childNodes].forEach(walk);
        if (isBlock) ensureBreak(2);
      }

      walk(rootNode);
      return { text: normalizeBookText(output), toc };
    }

    async function readEpubNavigation(archive, packagePath, packageDocument, manifest) {
      const entriesByPath = new Map();
      const addEntry = (basePath, href, title, level) => {
        const [relativePath, rawFragment = ''] = String(href || '').split('#');
        const path = resolveArchivePath(basePath, relativePath);
        if (!path || !title) return;
        const entries = entriesByPath.get(path) || [];
        let fragment = rawFragment;
        try { fragment = decodeURIComponent(rawFragment); } catch (_) {}
        entries.push({ title: normalizeBookText(title), level: Math.min(3, Math.max(1, level)), fragment });
        entriesByPath.set(path, entries);
      };
      const manifestItems = [...manifest.values()];
      const navItem = manifestItems.find(item => item.properties.split(/\s+/).includes('nav'));
      if (navItem) {
        const navEntry = archive.file(navItem.path);
        if (navEntry) {
          const navigationDocument = parseXml(await navEntry.async('string'), 'navigation');
          const navigationRoots = elementsByLocalName(navigationDocument, 'nav');
          const tocRoot = navigationRoots.find(node =>
            [...node.attributes].some(attribute => localNameOf(attribute) === 'type' && attribute.value.split(/\s+/).includes('toc'))
          ) || navigationRoots[0];
          elementsByLocalName(tocRoot || navigationDocument, 'a').forEach(link => {
            const href = link.getAttribute('href');
            if (!href) return;
            let level = 0;
            for (let node = link.parentElement; node && node !== tocRoot; node = node.parentElement) {
              if (localNameOf(node) === 'li') level += 1;
            }
            addEntry(navItem.path, href, link.textContent || '', level || 1);
          });
        }
      }

      if (!entriesByPath.size) {
        const spine = elementsByLocalName(packageDocument, 'spine')[0];
        const ncxItem = manifest.get(spine?.getAttribute('toc'))
          || manifestItems.find(item => /ncx/i.test(item.mediaType));
        const ncxEntry = ncxItem && archive.file(ncxItem.path);
        if (ncxEntry) {
          const ncxDocument = parseXml(await ncxEntry.async('string'), 'ncx');
          elementsByLocalName(ncxDocument, 'navpoint').forEach(point => {
            const contentNode = elementsByLocalName(point, 'content')[0];
            const labelNode = elementsByLocalName(point, 'navlabel')[0];
            const source = contentNode?.getAttribute('src');
            let level = 1;
            for (let node = point.parentElement; node; node = node.parentElement) {
              if (localNameOf(node) === 'navpoint') level += 1;
            }
            if (source) addEntry(ncxItem.path, source, labelNode?.textContent || '', level);
          });
        }
      }
      return entriesByPath;
    }

    async function parseEpub(file) {
      if (!window.JSZip) throw new Error('epub-engine-unavailable');
      const archive = await window.JSZip.loadAsync(await file.arrayBuffer());
      const containerEntry = archive.file('META-INF/container.xml');
      if (!containerEntry) throw new Error('missing-container');
      const container = parseXml(await containerEntry.async('string'), 'container');
      const rootfile = elementsByLocalName(container, 'rootfile')[0];
      const packagePath = rootfile?.getAttribute('full-path');
      if (!packagePath) throw new Error('missing-package');

      const packageEntry = archive.file(packagePath);
      if (!packageEntry) throw new Error('missing-package-file');
      const packageDocument = parseXml(await packageEntry.async('string'), 'package');
      const metadataTitle = elementsByLocalName(packageDocument, 'title')
        .map(element => normalizeBookText(element.textContent || ''))
        .find(Boolean);
      const manifest = new Map();
      elementsByLocalName(packageDocument, 'item').forEach(item => {
        const id = item.getAttribute('id');
        const href = item.getAttribute('href');
        if (!id || !href) return;
        manifest.set(id, {
          path: resolveArchivePath(packagePath, href),
          mediaType: item.getAttribute('media-type') || '',
          properties: item.getAttribute('properties') || ''
        });
      });

      const spineItems = elementsByLocalName(packageDocument, 'itemref')
        .filter(item => (item.getAttribute('linear') || '').toLowerCase() !== 'no')
        .map(item => manifest.get(item.getAttribute('idref')))
        .filter(item => item && /(?:xhtml|html)/i.test(item.mediaType));
      if (!spineItems.length) throw new Error('empty-spine');
      const navigationEntries = await readEpubNavigation(archive, packagePath, packageDocument, manifest);

      let content = '';
      const toc = [];
      for (const item of spineItems) {
        const entry = archive.file(item.path);
        if (!entry) continue;
        const extracted = extractEpubDocument(
          await entry.async('string'),
          navigationEntries.get(item.path) || []
        );
        if (!extracted.text) continue;
        if (content) content += '\n\n';
        const sectionStart = content.length;
        extracted.toc.forEach(tocEntry => toc.push({ ...tocEntry, anchor: sectionStart + tocEntry.anchor }));
        content += extracted.text;
      }
      content = normalizeBookText(content);
      if (!content) throw new Error('empty-epub');
      return {
        title: metadataTitle || file.name.replace(/\.epub$/i, '') || '未命名',
        content,
        format: 'epub',
        importSchemaVersion: 2,
        toc: toc
          .filter((entry, entryIndex, entries) => !entries.slice(0, entryIndex).some(previous =>
            previous.anchor === entry.anchor && previous.title === entry.title
          ))
          .sort((a, b) => a.anchor - b.anchor)
      };
    }

    async function parseBookFile(file) {
      if (/\.epub$/i.test(file.name) || file.type === 'application/epub+zip') return parseEpub(file);
      const content = normalizeBookText((await file.text()).replace(/\r\n/g, '\n'));
      if (!content) throw new Error('empty-text');
      return {
        title: file.name.replace(/\.(txt|md|markdown)$/i, '') || '未命名',
        content,
        format: /\.md|\.markdown$/i.test(file.name) ? 'markdown' : 'text'
      };
    }

    function renderBooks() {
      grid.querySelectorAll('[data-book-card]').forEach(node => node.remove());
      const books = readBooks();
      const readingLines = readReadingLines();
      books.forEach(book => {
        const percent = book.content.length
          ? Math.min(100, Math.round((Number(book.progress || 0) / book.content.length) * 100))
          : 0;
        const link = document.createElement('a');
        link.className = 'book';
        link.dataset.bookCard = 'true';
        link.href = `./read.html?book=${encodeURIComponent(book.id)}`;
        link.innerHTML = `
          <div class="cover">
            <span class="cover-title">${escapeText(book.title)}</span>
            <span class="leaf-mark">SIDELEAF</span>
          </div>
          <div class="book-info">
            <p class="book-name">${escapeText(book.title)}</p>
            <div class="book-progress">${percent ? `继续阅读 · ${percent}%` : book.builtIn ? '排版样章' : '尚未开始'}</div>
            ${bookLinesMarkup(book.id)}
          </div>`;
        grid.insertBefore(link, formatNote);
        updateBookLines(link.querySelector('.book-reading-lines'), readingLines[book.id], book.content.length, book.progress);
      });
      formatNote.hidden = books.length > 0;
    }

    grid.addEventListener('click', event => {
      const link = event.target.closest('a.book');
      if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      link.classList.add('is-opening');
    });

    window.addEventListener('pageshow', () => {
      grid.querySelectorAll('.book.is-opening').forEach(link => link.classList.remove('is-opening'));
      renderBooks();
    });

    dataButton.addEventListener('click', openDataSheet);
    dataClose.addEventListener('click', closeDataSheet);
    dataBackdrop.addEventListener('click', event => {
      if (event.target === dataBackdrop) closeDataSheet();
    });
    window.addEventListener('keydown', event => {
      if (event.key === 'Escape' && dataBackdrop.classList.contains('is-open')) closeDataSheet();
    });
    exportBackup.addEventListener('click', exportCompleteBackup);
    chooseBackup.addEventListener('click', () => backupFile.click());
    restoreCore.addEventListener('click', loadCoreRecovery);
    connectCore.addEventListener('click', openConnectPanel);
    backupFile.addEventListener('change', inspectBackupFile);
    restoreCoreCurrent.addEventListener('click', () => prepareCoreRestore('core-current'));
    saveCoreSnapshot.addEventListener('click', savePinnedCoreSnapshot);
    closeCoreRestore.addEventListener('click', resetCoreRestorePanel);
    cancelRestore.addEventListener('click', async () => {
      const returnToCore = pendingBackupSource.startsWith('core-');
      resetRestorePanel();
      if (returnToCore) await loadCoreRecovery();
      else backupFile.click();
    });
    confirmRestore.addEventListener('click', restorePendingBackup);
    cancelConnect.addEventListener('click', resetConnectPanel);
    confirmConnect.addEventListener('click', connectThisShelf);
    undoRestore.addEventListener('click', async () => {
      if (!undoRestoreAction) return;
      const action = undoRestoreAction;
      undoRestoreAction = null;
      undoRestore.disabled = true;
      try {
        await action();
        renderBooks();
        showToast('刚才的恢复已经撤销。');
      } catch (_) {
        window.alert('撤销没有成功，请用先前保存的备份恢复。');
      } finally {
        undoRestore.disabled = false;
      }
    });

    importButton.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      const originalLabel = importButton.textContent;
      importButton.disabled = true;
      importButton.textContent = '正在导入…';
      try {
        const parsed = await parseBookFile(file);
        const books = readBooks();
        const legacyIndex = parsed.format === 'epub'
          ? books.findIndex(book =>
              book.title === parsed.title
              && book.format === 'epub'
              && Number(book.importSchemaVersion || 1) < 2
            )
          : -1;
        const previous = legacyIndex >= 0 ? books[legacyIndex] : null;
        const imported = {
          id: previous?.id || window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          title: parsed.title,
          content: parsed.content,
          format: parsed.format,
          importSchemaVersion: parsed.importSchemaVersion,
          toc: parsed.toc,
          progress: previous?.progress || 0,
          createdAt: previous?.createdAt || Date.now(),
          updatedAt: Date.now()
        };
        if (legacyIndex >= 0) books.splice(legacyIndex, 1);
        const nextBooks = SideleafLibrary.insertImported(books, imported);
        localStorage.setItem(booksKey, JSON.stringify(nextBooks));
        SideleafSync.markDirty(localStorage, [booksKey]);
        renderBooks();
      } catch (_) {
        window.alert('这本书暂时没有导入成功。Sideleaf 目前支持未加密的 EPUB，以及 UTF-8 编码的 TXT 或 Markdown。');
      } finally {
        fileInput.value = '';
        importButton.disabled = false;
        importButton.textContent = originalLabel;
      }
    });

    SideleafSync.start(localStorage, {
      onStatus(event) {
        if (event.state === 'connected') showToast('这台 Sideleaf 已连接到 Core。');
        if (event.state === 'syncing') refreshCoreSyncStatus('Core：正在同步本机变化…');
        else if (event.state === 'offline') refreshCoreSyncStatus('Core：变化已留在本机，联网后补送');
        else refreshCoreSyncStatus();
      }
    });
    window.addEventListener('sideleaf:core-state', renderBooks);
    renderBooks();
  })();
</script>
</body>
</html>
