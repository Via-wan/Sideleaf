        '【本页原句对话】',
        noteBlock
      ].join('\n');
      try {
        await navigator.clipboard.writeText(packet);
      } catch (_) {}
      requestZhengRead.textContent = existing ? '已再叫峥' : '已叫峥';
      window.setTimeout(() => { requestZhengRead.textContent = '峥来读'; }, 1800);
    }

    function syncZhengActivity() {
      return SideleafSync.syncNow(localStorage, { queueIfBusy:true });
    }

    function turn(delta) {
      const next = index + delta;
      if (next < 0 || next >= pages.length) return;
      if (!chapterJournal.hidden) closeCurrentChapterJournal();
      hideNotes();
      index = next;
      render();
      void syncZhengActivity();
    }

    function resolveTocIndex(page) {
      if (!page) return 0;
      let currentIndex = 0;
      tocEntries.forEach((entry, entryIndex) => {
        if (entry.anchor < page.end) currentIndex = entryIndex;
      });
      return currentIndex;
    }

    function updateTocCurrent() {
      const currentIndex = resolveTocIndex(pages[index]);
      tocList.querySelectorAll('.toc-entry').forEach((button, buttonIndex) => {
        button.classList.toggle('is-current', buttonIndex === currentIndex);
      });
    }

    function renderToc() {
      tocList.replaceChildren();
      const journals = readChapterJournals();
      tocEntries.forEach((entry, entryIndex) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `toc-entry level-${entry.level}`;
        const title = document.createElement('span');
        title.className = 'toc-entry-title';
        title.textContent = entry.title;
        button.appendChild(title);
        const unit = chapterUnitForTocIndex(entryIndex);
        if (entryIndex === unit?.tocIndex && chapterJournalForUnit(unit, journals)) {
          const mark = document.createElement('i');
          mark.className = 'toc-journal-mark';
          mark.setAttribute('aria-label', '已有章节札记');
          button.appendChild(mark);
        }
        button.addEventListener('click', () => {
          const targetIndex = pages.findIndex((page, pageIndex) =>
            entry.anchor >= page.start && (entry.anchor < page.end || (paginationComplete && pageIndex === pages.length - 1))
          );
          if (targetIndex >= 0) {
            index = targetIndex;
            render();
            void syncZhengActivity();
          }
          closeToc();
        });
        tocList.appendChild(button);
      });
      updateTocCurrent();
    }

    function lightPopoverFor(trigger) {
      const panelId = trigger?.getAttribute('aria-controls');
      return panelId ? document.getElementById(panelId) : null;
    }

    function setLightPopover(trigger, open) {
      const panel = lightPopoverFor(trigger);
      if (!panel) return;
      panel.hidden = !open;
      panel.classList.toggle('is-open', open);
      trigger.setAttribute('aria-expanded', String(open));
    }

    function closeLightPopovers(exceptTrigger = null) {
      root.querySelectorAll('[data-light-popover-trigger][aria-expanded="true"]').forEach(trigger => {
        if (trigger !== exceptTrigger) setLightPopover(trigger, false);
      });
    }

    function toggleLightPopover(trigger) {
      const open = trigger.getAttribute('aria-expanded') !== 'true';
      closeLightPopovers(trigger);
      setLightPopover(trigger, open);
    }

    function openToc() {
      if (!chapterJournal.hidden) closeCurrentChapterJournal();
      renderToc();
      root.classList.add('toc-open');
      tocDrawer.setAttribute('aria-hidden', 'false');
      closeLightPopovers();
    }

    function closeToc() {
      root.classList.remove('toc-open');
      tocDrawer.setAttribute('aria-hidden', 'true');
    }

    root.addEventListener('click', event => {
      const trigger = event.target.closest('[data-light-popover-trigger]');
      if (!trigger || !root.contains(trigger)) return;
      event.stopPropagation();
      toggleLightPopover(trigger);
    }, true);

    annotateSelection.addEventListener('pointerdown', event => {
      event.preventDefault();
      event.stopPropagation();
      pageTurnSuppressedUntil = Date.now() + 800;
    });
    annotateSelection.addEventListener('pointerup', event => {
      event.preventDefault();
      event.stopPropagation();
      ignoreNextClick = true;
      composeForSelection();
      window.setTimeout(() => { ignoreNextClick = false; }, 450);
    });
    annotateSelection.addEventListener('click', event => {
      event.preventDefault();
      event.stopPropagation();
      if (event.detail === 0) composeForSelection();
    });
    likeSelection.addEventListener('pointerdown', event => {
      event.preventDefault();
      event.stopPropagation();
      pageTurnSuppressedUntil = Date.now() + 800;
    });
    likeSelection.addEventListener('pointerup', event => {
      event.preventDefault();
      event.stopPropagation();
      ignoreNextClick = true;
      toggleSelectionLike();
      window.setTimeout(() => { ignoreNextClick = false; }, 450);
    });
    likeSelection.addEventListener('click', event => {
      event.preventDefault();
      event.stopPropagation();
      if (event.detail === 0) toggleSelectionLike();
    });
    [selectionHandleStart, selectionHandleEnd].forEach(handle => {
      handle.addEventListener('pointerdown', startSelectionDrag);
      handle.addEventListener('pointermove', moveSelectionDrag);
      handle.addEventListener('pointerup', endSelectionDrag);
      handle.addEventListener('pointercancel', endSelectionDrag);
    });
    sendContext.addEventListener('click', copyContext);
    requestZhengRead.addEventListener('click', requestCurrentPageReading);
    openChapterJournal.addEventListener('click', openCurrentChapterJournal);
    copyChapterJournal.addEventListener('click', copyCurrentChapterJournal);
    noteInput.addEventListener('input', resizeNoteInput);
    markZhengLine.addEventListener('click', () => {
      const page = pages[index];
      if (!page) return;
      readingState.zheng.current = page.start;
      readingState.zheng.furthest = Math.max(readingState.zheng.furthest ?? 0, page.start);
      persistReadingState();
      renderReadingLines();
    });
    tocBackdrop.addEventListener('click', closeToc);
    tocDrawer.addEventListener('pointerdown', event => { drawerStartX = event.clientX; });
    tocDrawer.addEventListener('pointerup', event => {
      if (event.clientX - drawerStartX < -52) closeToc();
    });
    pageNumber.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') pageNumber.click();
    });

    document.addEventListener('pointerdown', event => {
      let dismissed = false;
      const annotationTarget = event.target.closest('.annotation-highlight');
      const customSelectionTarget = event.target.closest('.active-selection-highlight');
      const selectionHandleTarget = event.target.closest('.selection-handle');
      if (!event.target.closest('.note-more') && !event.target.closest('.note-actions')) closeNoteActions();
      if (!chapterJournal.hidden && !chapterJournal.contains(event.target) && !openChapterJournal.contains(event.target)) {
        closeCurrentChapterJournal();
        dismissed = true;
      }
      if (!notesSheet.hidden && !notesSheet.contains(event.target) && !annotationTarget && !selectionToolbar.contains(event.target)) {
        hideNotes();
        dismissed = true;
      }
      if (!activeSelection || !notesSheet.hidden || selectionToolbar.contains(event.target) || selectionHandleTarget || customSelectionTarget || annotationTarget) {
        // Keep the current sentence selected while interacting with its own controls.
      } else {
        activeSelection = null;
        activeSelectionHighlightVisible = false;
        hideSelectionToolbar();
        hideSelectionHandles();
        renderPageContent(pages[index]);
        dismissed = true;
      }
      root.querySelectorAll('[data-light-popover-trigger][aria-expanded="true"]').forEach(trigger => {
        const panel = lightPopoverFor(trigger);
        if (!panel || panel.contains(event.target) || trigger.contains(event.target)) return;
        setLightPopover(trigger, false);
        dismissed = true;
      });
      dismissedOverlayByPointer = dismissed && sheet.contains(event.target);
    }, true);
    saveNote.addEventListener('click', () => {
      const value = noteInput.value.trim();
      const page = pages[index];
      if (!value || !page || (!editingNoteId && !activeSelection)) return;
      const notes = readNotes();
      if (editingNoteId) {
        const target = notes.find(note => note.id === editingNoteId);
        if (target) {
          target.text = value;
          target.author = composingNoteAuthor;
          target.updatedAt = Date.now();
        }
      } else {
        notes.push({
          id: window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          bookId: activeBookId,
          anchor: activeSelection.start,
          rangeStart: activeSelection.start,
          rangeEnd: activeSelection.end,
          quote: activeSelection.quote,
          prefix: activeSelection.prefix,
          suffix: activeSelection.suffix,
          text: value,
          author: composingNoteAuthor,
          createdAt: Date.now(),
          updatedAt: Date.now()
        });
      }
      localStorage.setItem(notesKey, JSON.stringify(notes));
      SideleafSync.markDirty(localStorage, [notesKey]);
      if (activeSelection) {
        focusedNoteIds = notes.filter(note =>
          note.bookId === activeBookId
          && Number(note.rangeStart) === activeSelection.start
          && Number(note.rangeEnd) === activeSelection.end
        ).map(note => note.id);
      }
      activeSelectionHighlightVisible = false;
      editingNoteId = null;
      noteInput.value = '';
      noteInput.style.height = '';
      setNoteAuthor('wish');
      saveNote.textContent = '发送';
      renderPageContent(page);
      renderNotes();
    });

    fontSlider.addEventListener('input', () => {
      root.style.setProperty('--reader-size', `${fontSlider.value}px`);
      fontOutput.textContent = `${fontSlider.value}px`;
      applyTypography();
      saveSettings();
      repaginate();
    });

    lineSlider.addEventListener('input', () => {
      root.style.setProperty('--reader-leading', lineSlider.value);
      lineOutput.textContent = Number(lineSlider.value).toFixed(2);
      saveSettings();
      repaginate();
    });

    sheet.addEventListener('pointerdown', event => {
      startX = event.clientX;
      startY = event.clientY;
      longPressStartX = event.clientX;
      longPressStartY = event.clientY;
      longPressTriggered = false;
      clearLongPress();
      if (pageText.contains(event.target)) {
        longPressTimer = window.setTimeout(() => {
          longPressTriggered = selectSentenceAt(longPressStartX, longPressStartY);
          if (longPressTriggered) ignoreNextClick = true;
        }, 430);
      }
    });

    sheet.addEventListener('pointermove', event => {
      if (Math.hypot(event.clientX - longPressStartX, event.clientY - longPressStartY) > 10) clearLongPress();
    });

    sheet.addEventListener('pointercancel', clearLongPress);

    pageText.addEventListener('contextmenu', event => event.preventDefault());

    sheet.addEventListener('pointerup', event => {
      clearLongPress();
      if (Date.now() < pageTurnSuppressedUntil) return;
      if (longPressTriggered) {
        window.setTimeout(() => { ignoreNextClick = false; }, 450);
        return;
      }
      const dx = event.clientX - startX;
      const dy = event.clientY - startY;
      const bounds = sheet.getBoundingClientRect();
      const startedInLeftHalf = startX <= bounds.left + bounds.width * .5;
      if (window.getSelection()?.toString().trim()) {
        window.setTimeout(updateSelectionToolbar, 30);
        return;
      }
      if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy)) {
        ignoreNextClick = true;
        if (dx > 58 && startedInLeftHalf) openToc();
        window.setTimeout(() => { ignoreNextClick = false; }, 350);
      }
      window.setTimeout(updateSelectionToolbar, 30);
    });

    sheet.addEventListener('click', event => {
      if (dismissedOverlayByPointer) {
        dismissedOverlayByPointer = false;
        return;
      }
      const annotation = event.target.closest('.annotation-highlight');
      if (annotation) {
        const noteIds = (annotation.dataset.noteIds || '').split(',').filter(Boolean);
        showHighlightedNotes(noteIds, annotation.getBoundingClientRect());
        return;
      }
      if (event.target.closest('.active-selection-highlight')) return;
      if (Date.now() < pageTurnSuppressedUntil || ignoreNextClick || window.getSelection()?.toString().trim()) return;
      const bounds = sheet.getBoundingClientRect();
      const position = (event.clientX - bounds.left) / bounds.width;
      if (position < .35) turn(-1);
      if (position > .65) turn(1);
      if (position >= .35 && position <= .65) {
        toggleLightPopover(pageNumber);
      }
    });

    let selectionTimer;
    document.addEventListener('selectionchange', () => {
      window.clearTimeout(selectionTimer);
      selectionTimer = window.setTimeout(updateSelectionToolbar, 80);
    });

    noteInput.addEventListener('focus', () => {
      stabilizeNotesForKeyboard();
      [80, 180, 320].forEach(delay => window.setTimeout(stabilizeNotesForKeyboard, delay));
    });
    window.visualViewport?.addEventListener('resize', stabilizeNotesForKeyboard);
    window.visualViewport?.addEventListener('scroll', stabilizeNotesForKeyboard);
    window.addEventListener('scroll', stabilizeNotesForKeyboard, { passive:true });

    sheet.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') turn(-1);
      if (event.key === 'ArrowRight') turn(1);
    });

    const observer = new ResizeObserver(() => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(repaginate, 80);
    });
    observer.observe(pageText);
    window.addEventListener('sideleaf:core-state', () => {
      try { readingLineStates = JSON.parse(localStorage.getItem(readingLinesKey) || '{}'); }
      catch (_) { readingLineStates = {}; }
      const incoming = readingLineStates[activeBookId]?.zheng;
      if (incoming) {
        readingState.zheng.current = nullableAnchor(incoming.current);
        readingState.zheng.furthest = nullableAnchor(incoming.furthest);
      }
      renderReadingLines();
      if (pages[index]) renderPageContent(pages[index]);
      if (!notesSheet.hidden) renderNotes();
      renderToc();
    });
    SideleafSync.start(localStorage);
    applyTypography();
    void paginate(initialAnchor);
    renderToc();
  })();
</script>
</body>
</html>
