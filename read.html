<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfaf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sideleaf">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Sideleaf · 阅读</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  @view-transition {
    navigation: auto;
  }
  ::view-transition-group(sideleaf-book) {
    animation-duration: .42s;
    animation-timing-function: cubic-bezier(.22, .78, .18, 1);
  }
  :root {
    --foreground: #544c44;
    --muted-foreground: #8a8379;
    --border: rgba(71, 62, 51, .14);
    --card: #fcfaf7;
    --card-foreground: #544c44;
    --primary: #8f6f60;
    --wish: #d18b55;
    --zheng: #657572;
    --control-accent: #d6a18e;
    --zheng-marker: #879792;
    --wish-text: #b57d6b;
    --wish-selection: #d9b8aa;
    --wish-mark: rgba(217, 184, 170, .38);
    --zheng-mark: rgba(172, 188, 184, .38);
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --shadow-md: 0 12px 36px rgba(62, 52, 42, .10);
  }
  * { box-sizing: border-box; }
  html {
    -webkit-tap-highlight-color: transparent;
  }
  a,
  button,
  input,
  textarea,
  [role="button"] {
    -webkit-tap-highlight-color: transparent;
  }
  button {
    -webkit-appearance: none;
    appearance: none;
  }
  ::selection {
    background-color: var(--wish-mark) !important;
    color: #544c44 !important;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #fcfaf7;
  }
  body {
    margin: 0;
    overflow: hidden;
    background: #fcfaf7;
    color: var(--foreground);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", sans-serif;
    touch-action: manipulation;
  }
</style>
</head>
<body>
<div id="pagination-tester" class="viz-root" lang="zh-CN">
  <section class="tester-shell">
    <a class="shelf-link" href="./" aria-label="返回书架">‹</a>
    <button class="type-toggle" type="button" data-light-popover-trigger aria-expanded="false" aria-controls="tester-controls" aria-label="调整字号和行距">Aa</button>
    <div id="tester-controls" class="tester-controls" data-light-popover hidden>
      <label for="font-slider">字号 <output id="font-output">17px</output></label>
      <input id="font-slider" type="range" min="16" max="25" value="17">
      <label for="line-slider">行距 <output id="line-output">1.55</output></label>
      <input id="line-slider" type="range" min="1.55" max="2.45" step="0.05" value="1.55">
      <small class="build-version">Sideleaf 0.20.10</small>
    </div>

    <div class="page-wrap">
      <article class="reading-sheet" tabindex="0" aria-live="polite">
        <div class="chapter-name">雨停以后</div>
        <div class="page-text"></div>
        <div class="page-number" role="button" tabindex="0" data-light-popover-trigger aria-expanded="false" aria-controls="page-tools" aria-label="打开本页工具"></div>
      </article>
      <div class="measure-text" aria-hidden="true"></div>
    </div>

    <nav id="page-tools" class="page-tools" data-light-popover aria-label="本页工具" hidden>
      <button id="send-context" type="button" aria-label="整理当前页及前文给峥回顾">回望</button>
      <span aria-hidden="true"></span>
      <button id="request-zheng-read" type="button" aria-label="请峥正式阅读当前页">峥来读</button>
      <span aria-hidden="true"></span>
      <button id="open-chapter-journal" type="button">章节札记</button>
      <span aria-hidden="true"></span>
      <button id="open-reading-lines" type="button" data-light-popover-trigger aria-expanded="false" aria-controls="reading-lines-panel">阅读线</button>
    </nav>

    <section id="reading-lines-panel" class="reading-lines-panel" data-light-popover aria-label="两条阅读线" hidden>
      <button id="mark-zheng-line" class="reading-bookmark" type="button" aria-label="把峥的书签放在本页" aria-pressed="false"></button>
      <div class="reading-line-row wish-line">
        <div class="reading-line-copy"><strong>愿</strong><span id="wish-line-status">现在这里</span></div>
        <div class="reading-line-track"><i id="wish-line-fill"></i></div>
      </div>
      <div class="reading-line-row zheng-line">
        <div class="reading-line-copy"><strong>峥</strong><span id="zheng-line-status">还没开始</span></div>
        <div class="reading-line-track"><i id="zheng-line-fill"></i></div>
      </div>
      <p class="reading-lines-note">愿的线跟着当前页面移动；峥的线只在你明确放下书签时移动。</p>
    </section>

    <section id="chapter-journal" class="chapter-journal" role="dialog" aria-modal="false" aria-labelledby="chapter-journal-heading" aria-hidden="true" hidden>
      <div class="chapter-journal-head">
        <strong id="chapter-journal-heading"><span class="chapter-journal-label">札记</span><span id="chapter-journal-title"></span></strong>
        <button id="copy-chapter-journal" type="button" aria-label="递给峥" disabled>↑</button>
      </div>
      <div id="chapter-journal-body" class="chapter-journal-body is-empty">尚未留下札记</div>
    </section>

    <div id="selection-toolbar" class="selection-toolbar" hidden>
      <button id="like-selection" class="like-selection" type="button" aria-label="喜欢这句话" aria-pressed="false">♡</button>
      <span aria-hidden="true"></span>
      <button id="annotate-selection" type="button">说一句</button>
    </div>
    <div id="selection-handles" class="selection-handles" aria-hidden="true" hidden>
      <button class="selection-handle is-start" type="button" data-selection-edge="start" tabindex="-1" aria-label="调整选区开头"></button>
      <button class="selection-handle is-end" type="button" data-selection-edge="end" tabindex="-1" aria-label="调整选区结尾"></button>
    </div>

    <section class="notes-sheet" role="dialog" aria-modal="false" aria-label="原句对话" aria-hidden="true" hidden>
      <blockquote id="selection-quote" class="selection-quote" hidden></blockquote>
      <div id="notes-list" class="notes-list"></div>
      <div id="note-compose" class="note-compose" hidden>
        <textarea id="note-input" rows="1" aria-label="说一句" placeholder="接着说。"></textarea>
        <button id="save-note" class="save-note" type="button" hidden>发送</button>
      </div>
    </section>

    <div class="toc-backdrop" aria-hidden="true"></div>
    <aside class="toc-drawer" aria-hidden="true" aria-label="目录">
      <div class="toc-head">
        <strong id="toc-book-title">雨停以后</strong>
      </div>
      <nav id="toc-list" class="toc-list" aria-label="章节目录"></nav>
    </aside>

  </section>
</div>

<style>
  #pagination-tester {
    width: 100%;
    height: 100%;
    padding: 0;
    color: var(--foreground);
    --reader-size: 17px;
    --reader-leading: 1.55;
  }
  #pagination-tester .tester-shell {
    width: 100%;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }
  #pagination-tester .tester-controls {
    position: fixed;
    z-index: 20;
    top: calc(max(12px, env(safe-area-inset-top)) + 48px);
    right: max(12px, env(safe-area-inset-right));
    display: none;
    width: min(440px, calc(100% - 24px));
    grid-template-columns: auto minmax(90px, 1fr) auto minmax(90px, 1fr);
    align-items: center;
    gap: var(--space-3);
    margin: 0;
    padding: var(--space-3) var(--space-4);
    border: 1px solid rgba(255, 255, 255, .80);
    border-radius: 18px;
    background: rgba(252, 250, 247, .94);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .90),
      inset 0 -1px 0 rgba(91, 102, 105, .08),
      0 12px 32px rgba(67, 75, 76, .15);
    -webkit-backdrop-filter: blur(24px) saturate(1.34);
    backdrop-filter: blur(24px) saturate(1.34);
  }
  #pagination-tester .tester-controls.is-open { display: grid; }
  #pagination-tester .tester-controls label {
    color: rgba(84, 76, 68, .78);
  }
  #pagination-tester .tester-controls output {
    color: rgba(112, 105, 98, .62);
  }
  #pagination-tester .tester-controls input[type="range"] {
    accent-color: var(--control-accent);
    opacity: .86;
  }
  #pagination-tester .type-toggle {
    position: fixed;
    z-index: 21;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    width: 40px;
    height: 40px;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, .82);
    border-radius: 999px;
    background: rgba(252, 250, 247, .94);
    color: var(--muted-foreground);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .92),
      inset 0 -1px 0 rgba(91, 102, 105, .09),
      0 7px 20px rgba(67, 75, 76, .12);
    -webkit-backdrop-filter: blur(20px) saturate(1.34);
    backdrop-filter: blur(20px) saturate(1.34);
    font: 500 15px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #pagination-tester .shelf-link {
    position: fixed;
    z-index: 21;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, .82);
    border-radius: 999px;
    background: rgba(252, 250, 247, .94);
    color: var(--muted-foreground);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .92),
      inset 0 -1px 0 rgba(91, 102, 105, .09),
      0 7px 20px rgba(67, 75, 76, .12);
    -webkit-backdrop-filter: blur(20px) saturate(1.34);
    backdrop-filter: blur(20px) saturate(1.34);
    text-decoration: none;
    font: 300 30px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #pagination-tester label {
    color: var(--muted-foreground);
    white-space: nowrap;
  }
  #pagination-tester output {
    color: var(--foreground);
    font-variant-numeric: tabular-nums;
  }
  #pagination-tester input { width: 100%; accent-color: var(--primary); }
  #pagination-tester .build-version {
    grid-column: 1 / -1;
    color: rgba(138, 131, 121, .72);
    text-align: right;
    font-size: 10px;
    letter-spacing: .04em;
  }
  #pagination-tester .page-wrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
  }
  #pagination-tester .reading-sheet {
    box-sizing: border-box;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: var(--space-6) 0 0;
    border: 0;
    border-radius: 0;
    background: var(--card);
    color: var(--card-foreground);
    box-shadow: none;
    touch-action: pan-y;
    user-select: none;
    cursor: pointer;
    view-transition-name: sideleaf-book;
  }
  #pagination-tester .chapter-name {
    flex: 0 0 auto;
    margin-bottom: var(--space-5);
    text-align: center;
    color: var(--muted-foreground);
  }
  #pagination-tester .page-text,
  #pagination-tester .measure-text {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", "Microsoft YaHei", sans-serif !important;
    font-weight: 370 !important;
    font-size: var(--reader-size);
    line-height: var(--reader-leading);
    letter-spacing: .025em;
    white-space: pre-wrap;
    line-break: strict;
    word-break: normal;
    overflow-wrap: normal;
    text-align: justify;
  }
  #pagination-tester .paragraph-indent {
    display: inline-block;
    width: 2em;
    height: 1px;
    pointer-events: none;
  }
  #pagination-tester .page-text,
  #pagination-tester .page-text * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #pagination-tester .page-text {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    margin-right: calc(var(--reader-size) * 1.5) !important;
    margin-left: calc(var(--reader-size) * 1.5) !important;
  }
  #pagination-tester .reading-highlight {
    padding: 0;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  #pagination-tester .annotation-highlight { cursor: pointer; }
  #pagination-tester .reading-highlight.is-wish {
    background: linear-gradient(to top, var(--wish-mark) 0 .68em, transparent .68em);
  }
  #pagination-tester .reading-highlight.is-zheng {
    background: linear-gradient(to top, var(--zheng-mark) 0 .68em, transparent .68em);
  }
  #pagination-tester .reading-highlight.is-both {
    background:
      linear-gradient(to top, var(--wish-mark) 0 .34em, transparent .34em),
      linear-gradient(to top, var(--zheng-mark) 0 .68em, transparent .68em);
  }
  #pagination-tester .zheng-read-marker {
    display: inline-block;
    width: .42em;
    height: .42em;
    margin-left: .14em;
    border-radius: 999px;
    background: var(--zheng-marker);
    box-shadow: 0 0 0 2px rgba(135, 151, 146, .10);
    transform: translateY(-.08em);
  }
  #pagination-tester .active-selection-highlight {
    padding: 0;
    border-radius: 0;
    background: var(--wish-mark) !important;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  #pagination-tester .page-text,
  #pagination-tester .page-text * {
    caret-color: var(--wish-selection);
  }
  #pagination-tester .page-number {
    flex: 0 0 1em;
    min-height: 1em;
    margin-top: calc(var(--reader-size) / 2);
    margin-bottom: calc(var(--reader-size) * 1.667);
    text-align: center;
    color: var(--muted-foreground);
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #pagination-tester .measure-text {
    position: absolute;
    left: calc(var(--reader-size) * 1.5) !important;
    right: calc(var(--reader-size) * 1.5) !important;
    top: 0;
    height: 1px;
    overflow: hidden;
    visibility: hidden;
    pointer-events: none;
  }
  [hidden] { display: none !important; }
  #pagination-tester .page-tools {
    position: fixed;
    z-index: 30;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: auto 1px auto 1px auto 1px auto;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, .82);
    border-radius: 999px;
    background: rgba(252, 250, 247, .94);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .92),
      inset 0 -1px 0 rgba(91, 102, 105, .09),
      0 10px 30px rgba(67, 75, 76, .14);
    -webkit-backdrop-filter: blur(20px) saturate(1.34);
    backdrop-filter: blur(20px) saturate(1.34);
  }
  #pagination-tester .page-tools span {
    width: 1px;
    height: 18px;
    background: rgba(84, 76, 68, .14);
  }
  #pagination-tester .page-tools button,
  #pagination-tester .notes-sheet button,
  #pagination-tester .reading-lines-panel button {
    border: 0;
    background: transparent;
    color: var(--foreground);
    font: 500 14px/1.2 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  #pagination-tester .page-tools button {
    color: rgba(84, 76, 68, .62);
    font-size: 12.5px;
  }
  #pagination-tester .reading-lines-panel {
    position: fixed;
    z-index: 31;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    width: min(calc(100% - 36px), 360px);
    transform: translateX(-50%);
    overflow: hidden;
    isolation: isolate;
    padding: 16px;
    border: 1px solid rgba(255, 255, 255, .78);
    border-radius: 24px;
    background: linear-gradient(145deg, rgba(255, 255, 255, .66), rgba(242, 239, 235, .53));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .94),
      inset 0 -1px 0 rgba(84, 76, 68, .08),
      0 18px 48px rgba(68, 58, 51, .20);
    -webkit-backdrop-filter: blur(28px) saturate(1.28);
    backdrop-filter: blur(28px) saturate(1.28);
  }
  #pagination-tester .reading-line-row {
    padding: 0;
  }
  #pagination-tester .reading-bookmark + .reading-line-row { margin-top: 28px; }
  #pagination-tester .reading-line-row + .reading-line-row { margin-top: 9px; }
  #pagination-tester .reading-line-copy {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 7px;
  }
  #pagination-tester .reading-line-copy strong {
    color: rgba(84, 76, 68, .68);
    font-size: 14px;
  }
  #pagination-tester .reading-line-copy span {
    color: var(--muted-foreground);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  #pagination-tester .reading-line-track {
    height: 3px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(71, 62, 51, .10);
  }
  #pagination-tester .reading-line-track i {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    transition: width .22s ease;
  }
  #pagination-tester .wish-line .reading-line-track i { background: rgba(203, 163, 148, .88); }
  #pagination-tester .zheng-line .reading-line-track i { background: rgba(145, 166, 160, .88); }
  #pagination-tester .reading-lines-panel .reading-bookmark {
    position: absolute;
    top: 0;
    right: 16px;
    width: 17px;
    height: 29px;
    padding: 0;
    border: 0;
    border-radius: 3px 3px 1px 1px;
    background: #879d97;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%);
    filter: drop-shadow(0 4px 5px rgba(92, 117, 110, .13));
  }
  #pagination-tester .reading-lines-panel .reading-bookmark::after {

  }
  #pagination-tester .reading-lines-note {

  }

    backdrop-filter: blur(28px) saturate(1.28);
  }
  #pagination-tester .chapter-journal-head {
    display: flex;
    align-items: center;

  #pagination-tester .chapter-journal-head strong {

  #pagination-tester #chapter-journal-title {

  }
  #pagination-tester .chapter-journal-head button {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    padding: 0 0 2px;
    border: 1px solid rgba(255, 255, 255, .72);
    border-radius: 50%;
    background: rgba(252, 250, 247, .48);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .82), 0 4px 12px rgba(79, 65, 56, .09);

    font: 500 17px/1 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  #pagination-tester .chapter-journal-head button:disabled { opacity: .30; }
  #pagination-tester .chapter-journal-body {
    min-height: 0;
    width: 100%;
    overflow-y: auto;
    padding: 13px 14px;
    border: 1px solid rgba(255, 255, 255, .64);
    border-radius: 18px;
    background: rgba(252, 250, 247, .48);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .66);
    color: var(--zheng);

<script>
  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(registration => registration.update())
      .catch(() => {});
  }

  (() => {
    const root = document.getElementById('pagination-tester');
    const sheet = root.querySelector('.reading-sheet');
    const pageText = root.querySelector('.page-text');
    const pageNumber = root.querySelector('.page-number');
    const measure = root.querySelector('.measure-text');
    const fontSlider = root.querySelector('#font-slider');
    const lineSlider = root.querySelector('#line-slider');
    const fontOutput = root.querySelector('#font-output');
    const lineOutput = root.querySelector('#line-output');
    const typeToggle = root.querySelector('.type-toggle');
    const controls = root.querySelector('.tester-controls');
    const chapterName = root.querySelector('.chapter-name');
    const notesSheet = root.querySelector('.notes-sheet');
    const notesList = root.querySelector('#notes-list');
    const noteCompose = root.querySelector('#note-compose');
    const noteInput = root.querySelector('#note-input');
    const saveNote = root.querySelector('#save-note');
    const selectionToolbar = root.querySelector('#selection-toolbar');
    const likeSelection = root.querySelector('#like-selection');
    const annotateSelection = root.querySelector('#annotate-selection');
    const selectionHandles = root.querySelector('#selection-handles');
    const selectionHandleStart = root.querySelector('[data-selection-edge="start"]');
    const selectionHandleEnd = root.querySelector('[data-selection-edge="end"]');
    const selectionQuote = root.querySelector('#selection-quote');
    const sendContext = root.querySelector('#send-context');
    const requestZhengRead = root.querySelector('#request-zheng-read');
    const wishLineStatus = root.querySelector('#wish-line-status');
    const zhengLineStatus = root.querySelector('#zheng-line-status');
    const wishLineFill = root.querySelector('#wish-line-fill');
    const zhengLineFill = root.querySelector('#zheng-line-fill');
    const markZhengLine = root.querySelector('#mark-zheng-line');
    const openChapterJournal = root.querySelector('#open-chapter-journal');
    const chapterJournal = root.querySelector('#chapter-journal');
    const chapterJournalTitle = root.querySelector('#chapter-journal-title');
    const chapterJournalBody = root.querySelector('#chapter-journal-body');
    const copyChapterJournal = root.querySelector('#copy-chapter-journal');
    const tocDrawer = root.querySelector('.toc-drawer');
    const tocBackdrop = root.querySelector('.toc-backdrop');
    const tocList = root.querySelector('#toc-list');
    const tocBookTitle = root.querySelector('#toc-book-title');

    const booksKey = 'sideleaf.books.v1';
    const settingsKey = 'sideleaf.settings.v1';
    const notesKey = 'sideleaf.notes.v1';
    const likesKey = 'sideleaf.likes.v1';
    const readingLinesKey = 'sideleaf.reading-lines.v1';
    const chapterJournalsKey = 'sideleaf.chapter-journals.v1';
    const readingRequestsKey = 'sideleaf.read-requests.v1';
    const paginationCacheKey = '__sideleaf_pagination_cache_v1';
    const paginationLayoutVersion = '4';
    const bookId = new URLSearchParams(window.location.search).get('book');
    const storedBooks = SideleafLibrary.ensure(localStorage);
    const activeBook = storedBooks.find(book => book.id === (bookId || SideleafLibrary.DEFAULT_BOOK_ID))
      || SideleafLibrary.BUILT_IN_BOOKS[0];
    const activeBookId = activeBook.id;
    const text = activeBook.content;
    let readingLineStates = {};
    try { readingLineStates = JSON.parse(localStorage.getItem(readingLinesKey) || '{}'); } catch (_) {}

    function clampAnchor(value, fallback = 0) {
      const number = Number(value);
      return Number.isFinite(number) ? Math.max(0, Math.min(text.length, number)) : fallback;
    }

    function nullableAnchor(value) {
      return value === null || value === undefined ? null : clampAnchor(value);
    }

    const legacyAnchor = clampAnchor(activeBook?.progress || 0);
    const storedReadingState = readingLineStates[activeBookId] || {};
    const readingStateIsCurrent = storedReadingState.schemaVersion === 2;
    const migratedWishCurrent = clampAnchor(storedReadingState.wish?.current, legacyAnchor);
    const migratedZhengCurrent = nullableAnchor(storedReadingState.zheng?.current);
    const readingState = {
      wish: {
        current: migratedWishCurrent
      },
      zheng: {
        current: migratedZhengCurrent,
        furthest: readingStateIsCurrent
          ? nullableAnchor(storedReadingState.zheng?.furthest)
          : migratedZhengCurrent
      },
      schemaVersion: 2,
      textLength: text.length,
      updatedAt: Number(storedReadingState.updatedAt) || Date.now()
    };
    const initialAnchor = readingState.wish.current;

    function parseToc(source) {
      if (Array.isArray(activeBook.toc) && activeBook.toc.length) {
        const normalizedBookTitle = (activeBook.title || '').replace(/[\s　·:：_《》〈〉「」『』-]+/g, '').toLowerCase();
        const structuredEntries = activeBook.toc
          .map(entry => ({
            title: String(entry.title || '').trim(),
            level: Math.min(3, Math.max(1, Number(entry.level) || 1)),
            anchor: clampAnchor(entry.anchor)
          }))
          .filter(entry => {
            const normalizedTitle = entry.title.replace(/[\s　·:：_《》〈〉「」『』-]+/g, '').toLowerCase();
            return entry.title
              && normalizedTitle !== normalizedBookTitle
              && !/^(?:目录|目次|contents?)$/i.test(entry.title);
          })
          .sort((a, b) => a.anchor - b.anchor);
        if (structuredEntries.length) return structuredEntries;
      }
      const entries = [];
      let offset = 0;
      let markdownLevelShift = 0;
      const normalizedBookTitle = (activeBook.title || '').replace(/[\s　·:：_-]+/g, '').toLowerCase();
      source.split('\n').forEach(line => {
        const trimmed = line.trim();
        const markdown = trimmed.match(/^(#{1,3})\s+(.+?)\s*#*$/);
        const volume = trimmed.match(/^(第[^\s]{1,12}[卷部篇章回])(?:[\s　:：·-]+(.+))?$/);
        const section = trimmed.match(/^(第[^\s]{1,12}节)(?:[\s　:：·-]+(.+))?$/);
        const special = trimmed.match(/^(序章|序言|前言|楔子|引子|后记|尾声|终章)(?:[\s　:：·-]+(.+))?$/);
        if (markdown) {
          const headingTitle = markdown[2].trim();
          const normalizedHeading = headingTitle.replace(/[\s　·:：_-]+/g, '').toLowerCase();
          if (!entries.length && normalizedHeading === normalizedBookTitle) {
            markdownLevelShift = 1;
          } else {
            entries.push({
              title: headingTitle,
              level: Math.min(3, Math.max(1, markdown[1].length - markdownLevelShift)),
              anchor: offset
            });
          }
        } else if (section) {
          entries.push({ title: trimmed, level: 2, anchor: offset });
        } else if (volume || special) {
          entries.push({ title: trimmed, level: 1, anchor: offset });
        }
        offset += line.length + 1;
      });
      return entries.length ? entries : [{ title: activeBook.title || '正文', level: 1, anchor: 0 }];
    }

    const tocEntries = parseToc(text);

    chapterName.textContent = activeBook.title;
    tocBookTitle.textContent = activeBook.title;
    document.title = `${chapterName.textContent} · Sideleaf`;

    let savedSettings = {};
    try { savedSettings = JSON.parse(localStorage.getItem(settingsKey) || '{}'); } catch (_) {}
    if (savedSettings.fontSize) fontSlider.value = savedSettings.fontSize;
    if (savedSettings.lineHeight) lineSlider.value = savedSettings.lineHeight;
    root.style.setProperty('--reader-size', `${fontSlider.value}px`);
    root.style.setProperty('--reader-leading', lineSlider.value);
    fontOutput.textContent = `${fontSlider.value}px`;
    lineOutput.textContent = Number(lineSlider.value).toFixed(2);

    let pages = [];
    let index = 0;
    let startX = 0;
    let startY = 0;
    let ignoreNextClick = false;
    let pageTurnSuppressedUntil = 0;
    let resizeTimer;
    let editingNoteId = null;
    let composingNoteAuthor = 'wish';
    let activeSelection = null;
    let activeSelectionHighlightVisible = false;
    let focusedNoteIds = null;
    let notesAnchorRect = null;
    let drawerStartX = 0;
    let dismissedOverlayByPointer = false;
    let longPressTimer = null;
    let longPressTriggered = false;
    let longPressStartX = 0;
    let longPressStartY = 0;
    let draggingSelectionEdge = null;
    let selectionDragFrame = null;
    let activeJournalUnit = null;
    let paginationRun = 0;
    let paginationComplete = false;

    function isParagraphStart(offset) {
      if (offset <= 0) return true;
      let cursor = offset - 1;
      while (cursor >= 0 && (text[cursor] === ' ' || text[cursor] === '\t')) cursor -= 1;
      return text[cursor] === '\n';
    }

    function indentedMeasureText(fragment, globalStart) {
      const prefix = isParagraphStart(globalStart) && fragment[0] !== '\n' ? '　　' : '';
      return prefix + fragment.replace(/\n(?=[^\n])/g, '\n　　');
    }

    function fits(fragment, height, globalStart) {
      measure.style.height = `${height}px`;
      measure.textContent = indentedMeasureText(fragment, globalStart);
      return measure.scrollHeight <= height + 1;
    }

    const prohibitedPageStart = /[，。！？、；：）》」』】〕〉〗”’％‰℃°…—～·]/;
    const prohibitedPageEnd = /[（《「『【〔〈〖“‘]/;

    function adjustPageEnd(start, end, hardLimit) {
      let adjusted = end;
      if (end < hardLimit && end < text.length && prohibitedPageStart.test(text[end])) {
        let punctuationStart = end;
        while (punctuationStart > start && prohibitedPageStart.test(text[punctuationStart - 1])) {
          punctuationStart -= 1;
        }
        if (punctuationStart > start + 1 && !/\s/.test(text[punctuationStart - 1])) {
          adjusted = punctuationStart - 1;
        }
      }
      while (adjusted > start + 1 && prohibitedPageEnd.test(text[adjusted - 1])) {
        adjusted -= 1;
      }
      return Math.max(start + 1, adjusted);
    }

    function paginationTextSignature() {
      const sample = `${text.slice(0, 512)}\u0000${text.slice(Math.max(0, Math.floor(text.length / 2) - 256), Math.floor(text.length / 2) + 256)}\u0000${text.slice(-512)}`;
      let hash = 2166136261;
      for (let offset = 0; offset < sample.length; offset += 1) {
        hash ^= sample.charCodeAt(offset);
        hash = Math.imul(hash, 16777619);
      }
      return `${text.length}-${(hash >>> 0).toString(36)}`;
    }

    function paginationSignature(height) {
      return [
        paginationLayoutVersion,
        activeBookId,
        paginationTextSignature(),
        Math.round(pageText.clientWidth),
        Math.round(height),
        fontSlider.value,
        lineSlider.value
      ].join('|');
    }

    function pageFromBounds(start, end) {
      const rawPageText = text.slice(start, end);
      const leadingSpace = rawPageText.match(/^\s*/)?.[0].length || 0;
      const trailingSpace = rawPageText.match(/\s*$/)?.[0].length || 0;
      const displayStart = start + leadingSpace;
      const displayEnd = Math.max(displayStart, end - trailingSpace);
      return { start, end, displayStart, displayEnd, text:text.slice(displayStart, displayEnd) };
    }

    function readCachedPages(signature) {
      try {
        const cache = JSON.parse(localStorage.getItem(paginationCacheKey) || '{}');
        const bounds = cache?.entries?.[signature]?.bounds;
        if (!Array.isArray(bounds) || !bounds.length) return null;
        let previousEnd = -1;
        const restored = bounds.map(pair => {
          const start = Number(pair?.[0]);
          const end = Number(pair?.[1]);
          if (!Number.isInteger(start) || !Number.isInteger(end) || start < previousEnd || end <= start || end > text.length) {
            throw new Error('invalid-pagination-cache');
          }
          previousEnd = end;
          return pageFromBounds(start, end);
        });
        return restored;
      } catch (_) {
        return null;
      }
    }

    function saveCachedPages(signature, nextPages) {
      try {
        const cache = JSON.parse(localStorage.getItem(paginationCacheKey) || '{}');
        const entries = cache?.entries && typeof cache.entries === 'object' ? cache.entries : {};
        entries[signature] = {
          savedAt:Date.now(),
          bounds:nextPages.map(page => [page.start, page.end])
        };
        const recent = Object.entries(entries)
          .sort((left, right) => Number(right[1]?.savedAt || 0) - Number(left[1]?.savedAt || 0))
          .slice(0, 6);
        localStorage.setItem(paginationCacheKey, JSON.stringify({ entries:Object.fromEntries(recent) }));
      } catch (_) {}
    }

    function indexForAnchor(anchor, candidates = pages) {
      const found = candidates.findIndex((page, pageIndex) =>
        anchor >= page.start && (anchor < page.end || pageIndex === candidates.length - 1)
      );
      if (found >= 0) return found;
      for (let pageIndex = candidates.length - 1; pageIndex >= 0; pageIndex -= 1) {
        if (anchor >= candidates[pageIndex].start) return pageIndex;
      }
      return 0;
    }

    async function paginate(anchor = 0) {
      const availableHeight = pageText.clientHeight;
      if (!availableHeight || !pageText.clientWidth) return;
      const run = paginationRun += 1;
      const signature = paginationSignature(availableHeight);
      const cachedPages = readCachedPages(signature);
      if (cachedPages) {
        pages = cachedPages;
        paginationComplete = true;
        index = indexForAnchor(anchor);
        render();
        return;
      }
      paginationComplete = false;
      const nextPages = [];
      const pageBreakAnchors = [...new Set(tocEntries
        .map(entry => Number(entry.anchor))
        .filter(entryAnchor => Number.isFinite(entryAnchor) && entryAnchor > 0 && entryAnchor < text.length))]
        .sort((a, b) => a - b);
      let pageBreakIndex = 0;
      let start = 0;
      let renderedAnchor = false;
      let frameStartedAt = performance.now();
      while (start < text.length) {
        while (pageBreakAnchors[pageBreakIndex] <= start) pageBreakIndex += 1;
        const nextPageBreak = pageBreakAnchors[pageBreakIndex] || text.length;
        let low = start + 1;
        let high = Math.min(text.length, nextPageBreak, start + 6000);
        let best = low;
        while (low <= high) {
          const middle = Math.floor((low + high) / 2);
          if (fits(text.slice(start, middle), availableHeight, start)) {
            best = middle;
            low = middle + 1;
          } else {
            high = middle - 1;
          }
        }
        const end = adjustPageEnd(start, Math.max(start + 1, best), nextPageBreak);
        const page = pageFromBounds(start, end);
        nextPages.push(page);
        start = end;
        while (text[start] === '\n') start += 1;
        if (!renderedAnchor && anchor >= page.start && (anchor < start || start >= text.length)) {
          pages = nextPages;
          index = nextPages.length - 1;
          renderedAnchor = true;
          render(false);
        }
        if (performance.now() - frameStartedAt >= 8) {
          await new Promise(resolve => window.requestAnimationFrame(resolve));
          if (run !== paginationRun) return;
          frameStartedAt = performance.now();
        }
      }
      pages = nextPages;
      if (!renderedAnchor) index = indexForAnchor(anchor);
      paginationComplete = true;
      saveCachedPages(signature, pages);
      render();
    }

    function pageOrdinalForAnchor(anchor) {
      if (anchor === null || anchor === undefined || !pages.length) return null;
      const lookup = Number(anchor);
      const found = pages.findIndex((page, pageIndex) =>
        lookup >= page.start && (lookup < page.end || (paginationComplete && pageIndex === pages.length - 1))
      );
      return found >= 0 ? found + 1 : null;
    }

    function readingPercent(anchor, started = false) {
      if (anchor === null || anchor === undefined || !text.length) return 0;
      const percent = Math.max(0, Math.min(100, (Number(anchor) / text.length) * 100));
      return started ? Math.max(1.5, percent) : percent;
    }

    function persistReadingState() {
      readingState.textLength = text.length;
      readingState.updatedAt = Date.now();
      readingLineStates[activeBookId] = readingState;
      localStorage.setItem(readingLinesKey, JSON.stringify(readingLineStates));
      if (activeBook) {
        activeBook.progress = readingState.wish.current;
        activeBook.updatedAt = readingState.updatedAt;
        localStorage.setItem(booksKey, JSON.stringify(storedBooks));
      }
      SideleafSync.markDirty(localStorage, [readingLinesKey, booksKey]);
    }

    function renderReadingLines() {
      const wishCurrent = pageOrdinalForAnchor(readingState.wish.current);
      const total = paginationComplete ? pages.length : '…';
      wishLineStatus.textContent = `书签 ${wishCurrent || '…'}/${total}`;
      wishLineFill.style.width = `${readingPercent(readingState.wish.current, true)}%`;

      if (readingState.zheng.current === null) {
        zhengLineStatus.textContent = '还没开始';
        zhengLineFill.style.width = '0%';
      } else {
        const zhengCurrent = pageOrdinalForAnchor(readingState.zheng.current);
        const zhengFurthest = pageOrdinalForAnchor(readingState.zheng.furthest);
        zhengLineStatus.textContent = `书签 ${zhengCurrent || '…'}/${total} · 最远 ${zhengFurthest || '…'}/${total}`;
        zhengLineFill.style.width = `${readingPercent(readingState.zheng.furthest, true)}%`;
      }

      const page = pages[index];
      const zhengIsHere = Boolean(
        page
        && readingState.zheng.current !== null
        && readingState.zheng.current >= page.start
        && readingState.zheng.current < page.end
      );
      markZhengLine.classList.toggle('is-here', zhengIsHere);
      markZhengLine.setAttribute('aria-pressed', String(zhengIsHere));
      markZhengLine.setAttribute('aria-label', zhengIsHere ? '峥的书签在本页' : '把峥的书签放在本页');
    }

    function isRangeNote(note) {
      return Number.isFinite(Number(note.rangeStart)) && Number.isFinite(Number(note.rangeEnd))
        && Number(note.rangeEnd) > Number(note.rangeStart);
    }

    function rangeNotesForPage(page) {
      if (!page) return [];
      return readNotes().filter(note =>
        note.bookId === activeBookId && isRangeNote(note)
        && Number(note.rangeStart) < page.displayEnd
        && Number(note.rangeEnd) > page.displayStart
      );
    }

    function rangeLikesForPage(page) {
      if (!page) return [];
      return readLikes().filter(like =>
        like.bookId === activeBookId && isRangeNote(like)
        && Number(like.rangeStart) < page.displayEnd
        && Number(like.rangeEnd) > page.displayStart
      );
    }

    function renderPageContent(page) {
      const annotations = rangeNotesForPage(page);
      const likes = rangeLikesForPage(page);
      const zhengMarkerOffset = readingState.zheng.current > page.displayStart
        && readingState.zheng.current <= page.displayEnd
        ? Number(readingState.zheng.current)
        : null;
      const selection = activeSelectionHighlightVisible && activeSelection
        && activeSelection.start < page.displayEnd
        && activeSelection.end > page.displayStart
        ? activeSelection
        : null;
      const boundaries = new Set([page.displayStart, page.displayEnd]);
      for (let offset = page.displayStart; offset < page.displayEnd; offset += 1) {
        if (text[offset] === '\n' && offset + 1 < page.displayEnd) boundaries.add(offset + 1);
      }
      if (zhengMarkerOffset !== null) boundaries.add(zhengMarkerOffset);
      annotations.forEach(note => {
        boundaries.add(Math.max(page.displayStart, Number(note.rangeStart)));
        boundaries.add(Math.min(page.displayEnd, Number(note.rangeEnd)));
      });
      likes.forEach(like => {
        boundaries.add(Math.max(page.displayStart, Number(like.rangeStart)));
        boundaries.add(Math.min(page.displayEnd, Number(like.rangeEnd)));
      });
      if (selection) {
        boundaries.add(Math.max(page.displayStart, selection.start));
        boundaries.add(Math.min(page.displayEnd, selection.end));
      }
      const points = [...boundaries].sort((a, b) => a - b);
      const fragment = document.createDocumentFragment();
      for (let pointIndex = 0; pointIndex < points.length - 1; pointIndex += 1) {
        const from = points[pointIndex];
        const to = points[pointIndex + 1];
        if (to <= from) continue;
        const matchingNotes = annotations.filter(note =>
          Number(note.rangeStart) < to && Number(note.rangeEnd) > from
        );
        const matchingLikes = likes.filter(like =>
          Number(like.rangeStart) < to && Number(like.rangeEnd) > from
        );
        const selected = selection && selection.start < to && selection.end > from;
        const content = text.slice(from, to);
        if (isParagraphStart(from) && content[0] !== '\n') {
          const indent = document.createElement('span');
          indent.className = 'paragraph-indent';
          indent.setAttribute('aria-hidden', 'true');
          fragment.appendChild(indent);
        }
        if (!matchingNotes.length && !matchingLikes.length && !selected) {
          fragment.appendChild(document.createTextNode(content));
        } else {
          const mark = document.createElement('span');
          if (matchingNotes.length || matchingLikes.length) {
            mark.classList.add('reading-highlight');
            if (matchingNotes.length) mark.classList.add('annotation-highlight');
            else mark.classList.add('liked-highlight');
            const authors = new Set(matchingNotes.map(note => normalizeNoteAuthor(note.author)));
            matchingLikes.forEach(like => authors.add(normalizeNoteAuthor(like.author)));
            mark.classList.add(authors.size > 1 ? 'is-both' : authors.has('zheng') ? 'is-zheng' : 'is-wish');
            if (matchingNotes.length) mark.dataset.noteIds = matchingNotes.map(note => note.id).join(',');
          }
          if (selected) mark.classList.add('active-selection-highlight');
          mark.textContent = content;
          fragment.appendChild(mark);
        }
        if (zhengMarkerOffset === to) {
          const marker = document.createElement('span');
          marker.className = 'zheng-read-marker';
          marker.setAttribute('role', 'img');
          marker.setAttribute('aria-label', '峥读到这里');
          marker.title = '峥读到这里';
          fragment.appendChild(marker);
        }
      }
      pageText.replaceChildren(fragment);
    }

    function render(shouldPersist = true) {
      const page = pages[index];
      if (!page) return;
      hideSelectionToolbar();
      renderPageContent(page);
      pageNumber.textContent = `${index + 1}/${paginationComplete ? pages.length : '…'}`;
      const currentChapter = tocEntries[resolveTocIndex(page)] || tocEntries[0];
      chapterName.textContent = currentChapter?.title || activeBook?.title || '雨停以后';
      readingState.wish.current = page.start;
      if (shouldPersist) persistReadingState();
      renderReadingLines();
      if (!notesSheet.hidden) renderNotes();
      updateTocCurrent();
    }

    function repaginate() {
      const anchor = pages[index]?.start || 0;
      window.requestAnimationFrame(() => { void paginate(anchor); });
    }

    function applyTypography() {
      const inset = `${Number(fontSlider.value) * 1.5}px`;
      pageText.style.setProperty('margin-left', inset, 'important');
      pageText.style.setProperty('margin-right', inset, 'important');
      measure.style.setProperty('left', inset, 'important');
      measure.style.setProperty('right', inset, 'important');
      const readingFont = '-apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", "Microsoft YaHei", sans-serif';
      pageText.style.setProperty('font-family', readingFont, 'important');
      measure.style.setProperty('font-family', readingFont, 'important');
      pageText.style.setProperty('font-weight', '370', 'important');
      measure.style.setProperty('font-weight', '370', 'important');
    }

    function saveSettings() {
      localStorage.setItem(settingsKey, JSON.stringify({
        fontSize: Number(fontSlider.value),
        lineHeight: Number(lineSlider.value)
      }));
      SideleafSync.markDirty(localStorage, [settingsKey]);
    }

    function normalizeNoteAuthor(author) {
      return author === 'zheng' ? 'zheng' : 'wish';
    }

    function noteAuthorLabel(author) {
      return normalizeNoteAuthor(author) === 'zheng' ? '峥' : '愿';
    }

    function setNoteAuthor(author) {
      composingNoteAuthor = normalizeNoteAuthor(author);
      noteCompose.dataset.author = composingNoteAuthor;
    }

    function resizeNoteInput() {
      noteInput.style.height = 'auto';
      const viewportHeight = window.visualViewport?.height || window.innerHeight;
      const maxHeight = Math.max(72, Math.min(154, viewportHeight * .24));
      const nextHeight = Math.max(72, Math.min(noteInput.scrollHeight, maxHeight));
      noteInput.style.height = `${nextHeight}px`;
      noteInput.style.overflowY = noteInput.scrollHeight > maxHeight ? 'auto' : 'hidden';
      if (!notesSheet.hidden) window.requestAnimationFrame(() => positionNotes());
    }

    function readNotes() {
      try {
        const notes = JSON.parse(localStorage.getItem(notesKey) || '[]');
        return Array.isArray(notes)
          ? notes.map(note => ({ ...note, author: normalizeNoteAuthor(note.author) }))
          : [];
      } catch (_) { return []; }
    }

    function readReadingRequests() {
      try {
        const requests = JSON.parse(localStorage.getItem(readingRequestsKey) || '[]');
        return Array.isArray(requests) ? requests : [];
      } catch (_) { return []; }
    }

    function notesOnPage() {
      const page = pages[index];
      if (!page) return [];
      return readNotes().filter(note =>
        note.bookId === activeBookId && (
          isRangeNote(note)
            ? Number(note.rangeStart) < page.displayEnd && Number(note.rangeEnd) > page.displayStart
            : note.anchor >= page.start && note.anchor < page.end
        )
      );
    }

    function formatNoteTime(timestamp) {
      const value = Number(timestamp);
      if (!Number.isFinite(value) || value <= 0) return '';
      const date = new Date(value);
      const pad = part => String(part).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function renderNotes() {
      const pageNotes = notesOnPage();
      const notes = (focusedNoteIds === null
        ? pageNotes
        : pageNotes.filter(note => focusedNoteIds.includes(note.id)))
        .sort((a, b) => Number(a.createdAt || a.updatedAt || 0) - Number(b.createdAt || b.updatedAt || 0));
      notesList.replaceChildren();
      if (!notes.length) {
        if (!notesSheet.hidden) window.requestAnimationFrame(() => positionNotes());
        return;
      }
      notes.forEach(note => {
        const item = document.createElement('article');
        item.className = 'note-item';
        item.classList.add(note.author === 'zheng' ? 'is-zheng' : 'is-wish');
        const noteContent = document.createElement('div');
        noteContent.className = 'note-content';
        const noteTime = document.createElement('time');
        noteTime.className = 'note-time';
        const noteTimestamp = Number(note.createdAt || note.updatedAt || 0);
        if (Number.isFinite(noteTimestamp) && noteTimestamp > 0) {
          noteTime.dateTime = new Date(noteTimestamp).toISOString();
          noteTime.textContent = formatNoteTime(noteTimestamp);
        }
        const noteMeta = document.createElement('div');
        noteMeta.className = 'note-meta';
        noteMeta.hidden = !noteTime.textContent;
        noteMeta.append(noteTime);
        const noteText = document.createElement('p');
        noteText.className = 'note-text';
        noteText.textContent = note.text;
        noteContent.append(noteText);
        const noteBubble = document.createElement('div');
        noteBubble.className = 'note-bubble';
        noteBubble.append(noteMeta, noteContent);

        const more = document.createElement('button');
        more.className = 'note-more';
        more.type = 'button';
        more.textContent = '···';
        more.setAttribute('aria-label', '说一句选项');
        more.setAttribute('aria-expanded', 'false');

        const actions = document.createElement('div');
        actions.className = 'note-actions';
        actions.id = `note-actions-${note.id}`;
        actions.hidden = true;
        more.setAttribute('aria-controls', actions.id);

        const edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = '编辑';

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'delete-note';
        remove.textContent = '删除';

        more.addEventListener('click', () => {
          const shouldOpen = actions.hidden;
          closeNoteActions();
          if (!shouldOpen) return;
          actions.hidden = false;
          more.setAttribute('aria-expanded', 'true');
          window.requestAnimationFrame(() => {
            positionNotes();
            actions.scrollIntoView({ block:'nearest', behavior:'smooth' });
          });
        });
        edit.addEventListener('click', () => {
          editingNoteId = note.id;
          activeSelection = isRangeNote(note) ? {
            start: Number(note.rangeStart),
            end: Number(note.rangeEnd),
            quote: note.quote || text.slice(Number(note.rangeStart), Number(note.rangeEnd))
          } : null;
          noteCompose.hidden = false;
          saveNote.hidden = false;
          selectionQuote.hidden = !activeSelection;
          selectionQuote.textContent = activeSelection?.quote || '';
          noteInput.value = note.text;
          setNoteAuthor(note.author);
          saveNote.textContent = '保存修改';
          resizeNoteInput();
          noteInput.focus();
          closeNoteActions();
        });
        remove.addEventListener('click', () => {
          if (remove.dataset.confirm !== 'true') {
            remove.dataset.confirm = 'true';
            remove.textContent = '确认删除';
            return;
          }
          const nextNotes = readNotes().filter(item => item.id !== note.id);
          localStorage.setItem(notesKey, JSON.stringify(nextNotes));
          SideleafSync.markDirty(localStorage, [notesKey]);
          SideleafSync.queueDeletion(localStorage, { entity:'annotation-message', id:note.id });
          if (focusedNoteIds) focusedNoteIds = focusedNoteIds.filter(id => id !== note.id);
          if (editingNoteId === note.id) {
            editingNoteId = null;
            noteInput.value = '';
            setNoteAuthor('wish');
            saveNote.textContent = '发送';
          }
          renderPageContent(pages[index]);
          renderNotes();
        });

        actions.append(edit, remove);
        item.append(noteBubble);
        if (normalizeNoteAuthor(note.author) === 'wish') item.append(more, actions);
        notesList.appendChild(item);
      });
      if (!notesSheet.hidden) window.requestAnimationFrame(() => positionNotes());
    }

    function rememberRect(rect) {
      if (!rect) return null;
      return {
        left: rect.left,
        right: rect.right,
        top: rect.top,
        bottom: rect.bottom,
        width: rect.width,
        height: rect.height
      };
    }

    function closeNoteActions() {
      notesList.querySelectorAll('.note-actions:not([hidden])').forEach(actions => {
        actions.hidden = true;
        const item = actions.closest('.note-item');
        item?.querySelector('.note-more')?.setAttribute('aria-expanded', 'false');
        const remove = actions.querySelector('.delete-note');
        if (remove) {
          delete remove.dataset.confirm;
          remove.textContent = '删除';
        }
      });
    }

    function positionNotes(rect = notesAnchorRect) {
      if (!rect || notesSheet.hidden) return;
      const viewport = window.visualViewport;
      const viewportLeft = viewport?.offsetLeft || 0;
      const viewportTop = viewport?.offsetTop || 0;
      const viewportWidth = viewport?.width || window.innerWidth;
      const viewportHeight = viewport?.height || window.innerHeight;
      const margin = 14;
      const gap = 10;
      notesSheet.style.maxHeight = `${Math.max(180, Math.min(500, viewportHeight - margin * 2))}px`;
      const panelWidth = notesSheet.offsetWidth;
      const panelHeight = notesSheet.offsetHeight;
      const center = rect.left + rect.width / 2;
      const left = Math.max(
        viewportLeft + margin,
        Math.min(viewportLeft + viewportWidth - panelWidth - margin, center - panelWidth / 2)
      );
      const below = rect.bottom + gap;
      const above = rect.top - panelHeight - gap;
      const preferredTop = below + panelHeight <= viewportTop + viewportHeight - margin
        ? below
        : above;
      const minTop = Math.max(0, viewportTop) + margin;
      const maxTop = Math.max(minTop, Math.max(0, viewportTop) + viewportHeight - panelHeight - margin);
      const top = Math.max(minTop, Math.min(maxTop, preferredTop));
      notesSheet.style.left = `${left}px`;
      notesSheet.style.top = `${top}px`;
    }

    function stabilizeNotesForKeyboard() {
      if (notesSheet.hidden) return;
      window.requestAnimationFrame(() => {
        positionNotes();
        window.requestAnimationFrame(() => positionNotes());
      });
    }

    function showNotes(anchorRect = activeSelection?.anchorRect) {
      notesAnchorRect = rememberRect(anchorRect) || notesAnchorRect;
      selectionQuote.hidden = !activeSelection;
      selectionQuote.textContent = activeSelection?.quote || '';
      renderNotes();
      notesSheet.hidden = false;
      notesSheet.setAttribute('aria-hidden', 'false');
      closeLightPopovers();
      window.requestAnimationFrame(() => positionNotes());
    }

    function hideNotes() {
      notesSheet.hidden = true;
      notesSheet.setAttribute('aria-hidden', 'true');
      noteInput.blur();
      editingNoteId = null;
      noteInput.value = '';
      noteInput.style.height = '';
      setNoteAuthor('wish');
      saveNote.textContent = '发送';
      noteCompose.hidden = true;
      saveNote.hidden = true;
      selectionQuote.hidden = true;
      activeSelection = null;
      activeSelectionHighlightVisible = false;
      hideSelectionHandles();
      focusedNoteIds = null;
      notesAnchorRect = null;
      const page = pages[index];
      if (page) renderPageContent(page);
    }

    function hideSelectionToolbar() {
      selectionToolbar.hidden = true;
    }

    function hideSelectionHandles() {
      selectionHandles.hidden = true;
      selectionHandles.classList.remove('is-dragging');
      selectionHandleStart.classList.remove('is-dragging');
      selectionHandleEnd.classList.remove('is-dragging');
      draggingSelectionEdge = null;
    }

    function clearLongPress() {
      window.clearTimeout(longPressTimer);
      longPressTimer = null;
    }

    function pageAnchorFromPoint(clientX, clientY) {
      let node = null;
      let offset = 0;
      if (document.caretPositionFromPoint) {
        const caret = document.caretPositionFromPoint(clientX, clientY);
        node = caret?.offsetNode || null;
        offset = caret?.offset || 0;
      } else if (document.caretRangeFromPoint) {
        const caret = document.caretRangeFromPoint(clientX, clientY);
        node = caret?.startContainer || null;
        offset = caret?.startOffset || 0;
      }
      if (!node || !pageText.contains(node)) return null;
      const probe = document.createRange();
      probe.selectNodeContents(pageText);
      probe.setEnd(node, offset);
      const page = pages[index];
      return page ? page.displayStart + probe.toString().length : null;
    }

    function sentenceAt(anchor) {
      const stop = character => /[。！？!?；;\n]/.test(character || '');
      const closers = /[”’」』）》】]/;
      let start = Math.max(0, Math.min(text.length - 1, anchor));
      let end = start;
      while (start > 0 && !stop(text[start - 1])) start -= 1;
      while (start < text.length && /\s/.test(text[start])) start += 1;
      while (end < text.length && !stop(text[end])) end += 1;
      if (end < text.length) end += 1;
      while (end < text.length && closers.test(text[end])) end += 1;
      while (end > start && /\s/.test(text[end - 1])) end -= 1;
      return end > start ? { start, end } : null;
    }

    function positionSelectionToolbar(rect) {
      if (!rect) return;
      syncLikeSelectionButton();
      selectionToolbar.hidden = false;
      const halfWidth = Math.max(46, selectionToolbar.offsetWidth / 2);
      selectionToolbar.style.left = `${Math.max(halfWidth + 8, Math.min(window.innerWidth - halfWidth - 8, rect.left + rect.width / 2))}px`;
      selectionToolbar.style.top = `${Math.max(66, rect.top - 8)}px`;
    }

    function readLikes() {
      try {
        const likes = JSON.parse(localStorage.getItem(likesKey) || '[]');
        return Array.isArray(likes) ? likes : [];
      } catch (_) {
        return [];
      }
    }

    function activeLikeIndex(likes = readLikes()) {
      if (!activeSelection) return -1;
      return likes.findIndex(like =>
        like.bookId === activeBookId
        && normalizeNoteAuthor(like.author) === 'wish'
        && Number(like.rangeStart) === activeSelection.start
        && Number(like.rangeEnd) === activeSelection.end
      );
    }

    function syncLikeSelectionButton() {
      const liked = activeLikeIndex() >= 0;
      likeSelection.textContent = liked ? '♥' : '♡';
      likeSelection.classList.toggle('is-liked', liked);
      likeSelection.setAttribute('aria-pressed', String(liked));
      likeSelection.setAttribute('aria-label', liked ? '取消喜欢这句话' : '喜欢这句话');
    }

    function toggleSelectionLike() {
      if (!activeSelection) return;
      const likes = readLikes();
      const index = activeLikeIndex(likes);
      if (index >= 0) {
        likes.splice(index, 1);
      } else {
        const now = Date.now();
        likes.push({
          id: window.crypto?.randomUUID?.() || `${now}-${Math.random().toString(16).slice(2)}`,
          bookId: activeBookId,
          rangeStart: activeSelection.start,
          rangeEnd: activeSelection.end,
          quote: activeSelection.quote,
          prefix: activeSelection.prefix,
          suffix: activeSelection.suffix,
          author: 'wish',
          createdAt: now,
          updatedAt: now
        });
      }
      localStorage.setItem(likesKey, JSON.stringify(likes));
      SideleafSync.markDirty(localStorage, [likesKey]);
      syncLikeSelectionButton();
      likeSelection.classList.remove('did-toggle');
      void likeSelection.offsetWidth;
      likeSelection.classList.add('did-toggle');
    }

    function selectionRects() {
      return [...pageText.querySelectorAll('.active-selection-highlight')]
        .flatMap(highlight => [...highlight.getClientRects()])
        .filter(rect => rect.width > 0 && rect.height > 0);
    }

    function positionSelectionHandles(rects = selectionRects()) {
      if (!rects.length || !activeSelection) {
        hideSelectionHandles();
        return;
      }
      const first = rects[0];
      const last = rects[rects.length - 1];
      selectionHandleStart.style.left = `${first.left}px`;
      selectionHandleStart.style.top = `${first.top - 12}px`;
      selectionHandleStart.style.setProperty('--selection-line-height', `${first.height}px`);
      selectionHandleEnd.style.left = `${last.right}px`;
      selectionHandleEnd.style.top = `${last.top}px`;
      selectionHandleEnd.style.setProperty('--selection-line-height', `${last.height}px`);
      selectionHandles.hidden = false;
    }

    function updateActiveSelection(start, end) {
      if (!activeSelection || end <= start) return false;
      activeSelectionHighlightVisible = true;
      activeSelection.start = start;
      activeSelection.end = end;
      activeSelection.quote = text.slice(start, end);
      activeSelection.prefix = text.slice(Math.max(0, start - 60), start);
      activeSelection.suffix = text.slice(end, Math.min(text.length, end + 60));
      renderPageContent(pages[index]);
      const rects = selectionRects();
      if (!rects.length) return false;
      const last = rects[rects.length - 1];
      activeSelection.anchorRect = rememberRect(last);
      positionSelectionHandles(rects);
      if (!draggingSelectionEdge) positionSelectionToolbar(last);
      return true;
    }

    function selectSentenceAt(clientX, clientY) {
      const anchor = pageAnchorFromPoint(clientX, clientY);
      if (anchor === null) return false;
      const sentence = sentenceAt(anchor);
      if (!sentence) return false;
      activeSelection = {
        ...sentence,
        quote: text.slice(sentence.start, sentence.end),
        prefix: text.slice(Math.max(0, sentence.start - 60), sentence.start),
        suffix: text.slice(sentence.end, Math.min(text.length, sentence.end + 60))
      };
      activeSelectionHighlightVisible = true;
      focusedNoteIds = null;
      renderPageContent(pages[index]);
      window.requestAnimationFrame(() => {
        const rects = selectionRects();
        if (!rects.length) return;
        const rect = rects[rects.length - 1];
        activeSelection.anchorRect = rememberRect(rect);
        positionSelectionHandles(rects);
        positionSelectionToolbar(rect);
      });
      return true;
    }

    function startSelectionDrag(event) {
      if (!activeSelection) return;
      event.preventDefault();
      event.stopPropagation();
      draggingSelectionEdge = event.currentTarget.dataset.selectionEdge;
      selectionHandles.classList.add('is-dragging');
      event.currentTarget.classList.add('is-dragging');
      hideSelectionToolbar();
      try { event.currentTarget.setPointerCapture(event.pointerId); } catch (_) {}
    }

    function moveSelectionDrag(event) {
      if (!draggingSelectionEdge || !activeSelection) return;
      event.preventDefault();
      const clientX = event.clientX;
      const clientY = event.clientY;
      const handle = event.currentTarget;
      window.cancelAnimationFrame(selectionDragFrame);
      selectionDragFrame = window.requestAnimationFrame(() => {
        const page = pages[index];
        handle.style.pointerEvents = 'none';
        const anchor = pageAnchorFromPoint(clientX, clientY);
        handle.style.pointerEvents = '';
        if (!page || anchor === null) return;
        if (draggingSelectionEdge === 'start') {
          const start = Math.max(page.displayStart, Math.min(anchor, activeSelection.end - 1));
          updateActiveSelection(start, activeSelection.end);
        } else {
          const end = Math.min(page.displayEnd, Math.max(anchor, activeSelection.start + 1));
          updateActiveSelection(activeSelection.start, end);
        }
      });
    }

    function endSelectionDrag(event) {
      if (!draggingSelectionEdge) return;
      event.preventDefault();
      event.stopPropagation();
      window.cancelAnimationFrame(selectionDragFrame);
      const page = pages[index];
      event.currentTarget.style.pointerEvents = 'none';
      const anchor = pageAnchorFromPoint(event.clientX, event.clientY);
      event.currentTarget.style.pointerEvents = '';
      if (page && anchor !== null && activeSelection) {
        if (draggingSelectionEdge === 'start') {
          updateActiveSelection(
            Math.max(page.displayStart, Math.min(anchor, activeSelection.end - 1)),
            activeSelection.end
          );
        } else {
          updateActiveSelection(
            activeSelection.start,
            Math.min(page.displayEnd, Math.max(anchor, activeSelection.start + 1))
          );
        }
      }
      draggingSelectionEdge = null;
      selectionHandles.classList.remove('is-dragging');
      selectionHandleStart.classList.remove('is-dragging');
      selectionHandleEnd.classList.remove('is-dragging');
      const rects = selectionRects();
      const last = rects[rects.length - 1];
      if (last) {
        activeSelection.anchorRect = rememberRect(last);
        positionSelectionHandles(rects);
        positionSelectionToolbar(last);
      }
    }

    function selectionOffsets(range) {
      const startRange = document.createRange();
      startRange.selectNodeContents(pageText);
      startRange.setEnd(range.startContainer, range.startOffset);
      const endRange = document.createRange();
      endRange.selectNodeContents(pageText);
      endRange.setEnd(range.endContainer, range.endOffset);
      return {
        start: startRange.toString().length,
        end: endRange.toString().length
      };
    }

    function updateSelectionToolbar() {
      const selection = window.getSelection();
      if (!selection || selection.isCollapsed || !selection.rangeCount) {
        hideSelectionToolbar();
        return;
      }
      const range = selection.getRangeAt(0);
      const startElement = range.startContainer.nodeType === Node.ELEMENT_NODE
        ? range.startContainer
        : range.startContainer.parentElement;
      const endElement = range.endContainer.nodeType === Node.ELEMENT_NODE
        ? range.endContainer
        : range.endContainer.parentElement;
      if (!startElement || !endElement || !pageText.contains(startElement) || !pageText.contains(endElement)) {
        hideSelectionToolbar();
        return;
      }
      const page = pages[index];
      if (!page) return;
      const offsets = selectionOffsets(range);
      const rangeStart = page.displayStart + Math.min(offsets.start, offsets.end);
      const rangeEnd = page.displayStart + Math.max(offsets.start, offsets.end);
      const quote = text.slice(rangeStart, rangeEnd).trim();
      if (!quote) {
        hideSelectionToolbar();
        return;
      }
      const leadingTrim = text.slice(rangeStart, rangeEnd).indexOf(quote);
      const start = rangeStart + Math.max(0, leadingTrim);
      const end = start + quote.length;
      activeSelection = {
        start,
        end,
        quote,
        prefix: text.slice(Math.max(0, start - 60), start),
        suffix: text.slice(end, Math.min(text.length, end + 60))
      };
      activeSelectionHighlightVisible = true;
      const rangeRects = Array.from(range.getClientRects());
      const rect = rangeRects[rangeRects.length - 1] || range.getBoundingClientRect();
      activeSelection.anchorRect = rememberRect(rect);
      positionSelectionToolbar(rect);
    }

    function composeForSelection() {
      if (!activeSelection) return;
      activeSelectionHighlightVisible = true;
      focusedNoteIds = [];
      editingNoteId = null;
      noteInput.value = '';
      setNoteAuthor('wish');
      saveNote.textContent = '发送';
      noteCompose.hidden = false;
      saveNote.hidden = false;
      hideSelectionToolbar();
      hideSelectionHandles();
      window.getSelection()?.removeAllRanges();
      renderPageContent(pages[index]);
      showNotes(activeSelection.anchorRect);
      window.requestAnimationFrame(resizeNoteInput);
      window.setTimeout(() => noteInput.focus(), 80);
    }

    function showHighlightedNotes(noteIds, anchorRect) {
      const notes = readNotes().filter(note => noteIds.includes(note.id));
      if (!notes.length) return;
      const first = notes[0];
      activeSelection = isRangeNote(first) ? {
        start: Number(first.rangeStart),
        end: Number(first.rangeEnd),
        quote: first.quote || text.slice(Number(first.rangeStart), Number(first.rangeEnd)),
        prefix: first.prefix || text.slice(Math.max(0, Number(first.rangeStart) - 60), Number(first.rangeStart)),
        suffix: first.suffix || text.slice(Number(first.rangeEnd), Math.min(text.length, Number(first.rangeEnd) + 60))
      } : null;
      activeSelectionHighlightVisible = false;
      focusedNoteIds = noteIds;
      editingNoteId = null;
      noteInput.value = '';
      setNoteAuthor('wish');
      saveNote.textContent = '发送';
      noteCompose.hidden = false;
      saveNote.hidden = false;
      renderPageContent(pages[index]);
      showNotes(anchorRect);
      window.requestAnimationFrame(resizeNoteInput);
    }

    function readChapterJournals() {
      try {
        const journals = JSON.parse(localStorage.getItem(chapterJournalsKey) || '[]');
        return Array.isArray(journals) ? journals : [];
      } catch (_) { return []; }
    }

    function chapterUnitForTocIndex(tocIndex) {
      const safeIndex = Math.max(0, Math.min(tocEntries.length - 1, tocIndex));
      const ancestors = [];
      let expectedLevel = tocEntries[safeIndex]?.level || 1;
      for (let entryIndex = safeIndex; entryIndex >= 0 && expectedLevel > 0; entryIndex -= 1) {
        const item = tocEntries[entryIndex];
        if (item.level === expectedLevel) {
          ancestors.unshift(entryIndex);
          expectedLevel -= 1;
        }
      }
      const explicitChapter = [...ancestors].reverse().find(entryIndex =>
        /^(?:第.{1,12}[章回]|chapter\s*[\divxlcdm-]*)/i.test(tocEntries[entryIndex].title.trim())
      );
      const topEntry = tocEntries[ancestors[0]];
      const topIsContainer = topEntry && /^(?:第.{1,12}[卷部篇]|part\s*[\divxlcdm-]*|volume\s*[\divxlcdm-]*)/i.test(topEntry.title.trim());
      const chapterIndex = explicitChapter ?? (topIsContainer && ancestors.length > 1 ? ancestors[1] : ancestors[0]) ?? safeIndex;
      const entry = tocEntries[chapterIndex];
      if (!entry) return null;
      let end = text.length;
      for (let nextIndex = chapterIndex + 1; nextIndex < tocEntries.length; nextIndex += 1) {
        const next = tocEntries[nextIndex];
        if (next.level <= entry.level) {
          end = next.anchor;
          break;
        }
      }
      const path = [];
      for (let entryIndex = 0; entryIndex <= chapterIndex; entryIndex += 1) {
        const item = tocEntries[entryIndex];
        path[item.level - 1] = item.title;
        path.length = item.level;
      }
      return {
        key: `${entry.level}:${entry.anchor}:${entry.title}`,
        tocIndex: chapterIndex,
        title: entry.title,
        path: path.filter(Boolean),
        level: entry.level,
        anchor: entry.anchor,
        end
      };
    }

    function currentChapterUnit() {
      return chapterUnitForTocIndex(resolveTocIndex(pages[index]));
    }

    function chapterJournalForUnit(unit, journals = readChapterJournals()) {
      if (!unit) return null;
      const exact = journals.find(journal =>
        journal.bookId === activeBookId && journal.chapterKey === unit.key
      );
      if (exact) return exact;
      const legacy = journals.filter(journal =>
        journal.bookId === activeBookId
        && Number(journal.chapterAnchor) >= unit.anchor
        && Number(journal.chapterAnchor) < unit.end
      );
      return legacy.length === 1 ? legacy[0] : null;
    }

    function syncChapterJournalControls() {
      const value = String(chapterJournalForUnit(activeJournalUnit)?.text || '').trim();
      chapterJournalBody.textContent = value || '尚未留下札记';
      chapterJournalBody.classList.toggle('is-empty', !value);
      copyChapterJournal.disabled = !value;
    }

    function openCurrentChapterJournal() {
      const unit = currentChapterUnit();
      if (!unit) return;
      activeJournalUnit = unit;
      chapterJournalTitle.textContent = unit.title;
      chapterJournal.hidden = false;
      chapterJournal.setAttribute('aria-hidden', 'false');
      closeLightPopovers();
      closeToc();
      if (!notesSheet.hidden) hideNotes();
      syncChapterJournalControls();
    }

    function closeCurrentChapterJournal() {
      chapterJournal.hidden = true;
      chapterJournal.setAttribute('aria-hidden', 'true');
      activeJournalUnit = null;
    }

    async function copyCurrentChapterJournal() {
      const value = String(chapterJournalForUnit(activeJournalUnit)?.text || '').trim();
      if (!activeJournalUnit || !value) return;
      const packet = [
        '【Sideleaf｜峥的章节札记】',
        `书名：${activeBook?.title || '雨停以后'}`,
        `章节：${activeJournalUnit.path.join(' · ')}`,
        '',
        '以下是峥此前为这一章节留下的完整札记，请原样阅读，不要先替它压成一层短摘要。',
        '',
        value
      ].join('\n');
      try {
        await navigator.clipboard.writeText(packet);
        copyChapterJournal.textContent = '✓';
      } catch (_) {
        copyChapterJournal.textContent = '!';
      }
      window.setTimeout(() => {
        copyChapterJournal.textContent = '↑';
      }, 1800);
    }

    async function copyContext() {
      const page = pages[index];
      if (!page) return;
      const contextStart = Math.max(0, page.start - 2000);
      const from = page.start;
      const to = page.end;
      const now = Date.now();
      const requests = readReadingRequests();
      const existing = requests.find(request =>
        request.kind === 'lookback'
        && request.bookId === activeBookId
        && request.rangeStart === from
        && request.rangeEnd === to
        && request.status === 'pending'
      );
      const unit = currentChapterUnit();
      const request = existing || {
        id: window.crypto?.randomUUID?.() || `${now}-${Math.random().toString(16).slice(2)}`,
        bookId: activeBookId,
        createdAt: now
      };
      Object.assign(request, {
        kind:'lookback',
        contextStart,
        bookTitle:activeBook?.title || '雨停以后',
        chapterTitle:unit?.title || chapterName.textContent,
        chapterPath:unit?.path || [chapterName.textContent],
        chapterKey:unit?.key || null,
        chapterAnchor:unit?.anchor ?? null,
        chapterEnd:unit?.end ?? null,
        chapterLevel:unit?.level ?? null,
        rangeStart:from,
        rangeEnd:to,
        pageNumber:index + 1,
        totalPages:pages.length,
        status:'pending',
        requestedAt:now
      });
      if (!existing) requests.push(request);
      localStorage.setItem(readingRequestsKey, JSON.stringify(requests.slice(-100)));
      SideleafSync.markDirty(localStorage, [readingRequestsKey]);
      const syncResult = await SideleafSync.syncNow(localStorage);
      const zhengPage = pageOrdinalForAnchor(readingState.zheng.current);
      const relatedNotes = readNotes().filter(note =>
        note.bookId === activeBookId && (
          isRangeNote(note)
            ? Number(note.rangeStart) < to && Number(note.rangeEnd) > contextStart
            : note.anchor >= contextStart && note.anchor < to
        )
      );
      const noteBlock = relatedNotes.length
        ? relatedNotes.map((note, i) => {
            const quote = isRangeNote(note) ? `「${note.quote || text.slice(note.rangeStart, note.rangeEnd)}」` : '（旧页边批注）';
            return `${i + 1}. ${noteAuthorLabel(note.author)}｜${quote}：${note.text}`;
          }).join('\n')
        : '无';
      const relatedLikes = readLikes().filter(like =>
        like.bookId === activeBookId && isRangeNote(like)
        && Number(like.rangeStart) < to
        && Number(like.rangeEnd) > contextStart
      );
      const likeBlock = relatedLikes.length
        ? relatedLikes.map((like, i) => {
            const quote = like.quote || text.slice(like.rangeStart, like.rangeEnd);
            return `${i + 1}. ${noteAuthorLabel(like.author)}｜「${quote}」`;
          }).join('\n')
        : '无';
      const packet = [
        '【Sideleaf｜回望】',
        `书名：${activeBook?.title || '雨停以后'}`,
        `章节：${chapterName.textContent}`,
        `愿所在页：${index + 1}/${pages.length}`,
        `峥的阅读线：${zhengPage ? `${zhengPage}/${pages.length}` : '尚未开始'}`,
        '',
        '以下内容由当前页全文及当前页之前约 2000 字组成，只用于帮峥找回走到这里以前的阅读现场。',
        '这不是正式阅读请求；不要据此把后文视为已读，也不要移动峥的阅读线。',
        '',
        text.slice(contextStart, to),
        '',
        '【相关批注】',
        noteBlock,
        '',
        '【相关喜欢】',
        likeBlock
      ].join('\n');
      try {
        await navigator.clipboard.writeText(packet);
        sendContext.textContent = syncResult?.ok ? '已递给峥' : '已复制，待同步';
      } catch (_) {
        sendContext.textContent = syncResult?.ok ? '已递给峥' : '同步失败，再点一次';
      }
      window.setTimeout(() => { sendContext.textContent = '回望'; }, 1800);
    }

    async function requestCurrentPageReading() {
      const page = pages[index];
      if (!page) return;
      const readingRange = SideleafLibrary.expandReadingRange(text, page.displayStart, page.displayEnd);
      const from = readingRange.start;

      const relatedNotes = readNotes().filter(note =>

        )
      );
      const noteBlock = relatedNotes.length
        ? relatedNotes.map((note, i) => {

          }).join('\n')
        : '无';
      const packet = [
        '【Sideleaf｜峥来读】',
        `书名：${request.bookTitle}`,
        `章节：${request.chapterPath.join(' · ')}`,
        `页码：${request.pageNumber}/${request.totalPages}`,
        `阅读请求：${request.id}`,
        '',
        '以下是愿明确请峥正式阅读的当前页内容，并已补齐到完整段落；超长段落按完整句补齐。请实际读完后，再更新峥的阅读线或留下批注。',
